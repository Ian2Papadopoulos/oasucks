name = "oasa-stop"
main = "worker.js"
compatibility_date = "2025-01-01"

# Static app (index.html, icons, manifest, sw.js). Anything not matching a
# file here falls through to worker.js — so /api, /geocode, /rules, /push/*.
[assets]
directory = "./public"

# Paces push alerts and line tracking — the live arrivals shown in the
# app do NOT depend on this; they're fetched on demand at any hour.
# Cloudflare evaluates crons in UTC: per-minute while Athens is awake
# (UTC 4–21 ≈ Athens 06/07:00–24:00), every 5 minutes through the dead
# hours — so a night alert (e.g. on X95) still fires, just with up to
# 5-minute granularity. Harmless if push isn't set up: runs exit early.
#
# WANT FEWER RUNS? These are broad, "cover any possible alert" defaults
# (~1,150/day). Ask the Worker what your ACTUAL rules need:
#     curl "https://<your-url>/alerts/windows?token=$ADMIN_TOKEN"
# and paste the `crons` it returns here — typically ~100/day. With no
# alert rules at all it returns none, and you can comment this out
# entirely (tracking then needs a manual /track/sample, and alerts stop).
# Setting CF_API_TOKEN + CF_ACCOUNT_ID secrets makes the Worker apply
# that narrowed schedule to itself daily — see PUSH-SETUP.md.
[triggers]
crons = ["* 4-21 * * *", "*/5 22,23,0-3 * * *"]

# ---------------------------------------------------------------------
# ALERTS STORAGE (KV) — required for push notifications AND the community
# reports (red/yellow flags + the history log live in here).
# This binding is ACTIVE and points at the project's own namespace, so a
# deploy to the same Cloudflare account just works. Deploying under a
# DIFFERENT account? Make your own namespace and swap the id:
#     npx wrangler kv namespace create ALERTS   # (older wrangler: kv:namespace)
# ---------------------------------------------------------------------
[[kv_namespaces]]
binding = "ALERTS"
id = "286552a0463b4334b79d2961622a9ffe"

# ---------------------------------------------------------------------
# VEHICLE TRACKING (D1) — required only for the service stats (headways,
# bunching, missing trips) and the report history log.
# Also ACTIVE. Same rule: a different account needs its own database —
#     npx wrangler d1 create oasa-stats
# then paste the printed database_id below. Without a DB the app still
# runs; stats and /reports/toplist just report "not configured".
# ---------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "oasa-stats"
database_id = "8e15897a-c744-496a-9684-384a2dc42302"
