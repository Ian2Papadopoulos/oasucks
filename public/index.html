/* A flagged bus keeps driving after it was reported, so the pin has to
   follow it. We re-read live positions for the flagged vehicles only —
   a handful of routes, not the whole network. */
async function refreshFlagPositions(){
  const reps=activeReports().filter(r=>r.kind==="bus"&&r.routeCode&&r.veh);
  const codes=[...new Set(reps.map(r=>r.routeCode))].slice(0,8);
  if(!codes.length) return;
  const pos={};
  await withLimit(codes.map(c=>async()=>{
    const buses=await oasa("getBusLocation",c).catch(()=>null);
    (Array.isArray(buses)?buses:[]).forEach(v=>{
      const veh=String(pick(v,"VEH_NO","veh_no","VEH_CODE")||"");
      const la=Number(pick(v,"CS_LAT","cs_lat")), ln=Number(pick(v,"CS_LNG","cs_lng"));
      if(veh&&isFinite(la)&&isFinite(ln)) pos[veh]={lat:la,lng:ln};
    });
  }),4);
  state.busPos=Object.assign(state.busPos||{},pos);
}

/* The map is a problem map: only buses and metro stations that carry an
   active flag are drawn. Nothing "ok" appears — if it's on here, it's a
   problem. (Your own dot stays, purely so the pins have a reference.) */
function drawReportMap(){
  if(!repmap) return;
  replayer.clearLayers();
  const b=L.latLngBounds([]);
  L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:900}).addTo(replayer);
  b.extend([here.lat,here.lng]);
  activeReports().forEach(r=>{
    const live=(r.kind==="bus"&&r.veh&&state.busPos)?state.busPos[r.veh]:null;
    const la=live?live.lat:r.lat, ln=live?live.lng:r.lng;
    if(!isFinite(la)||!isFinite(ln)) return;
    // lineId/targetName come straight from a POST /reports body — untrusted.
    // Leaflet renders tooltip strings as HTML, so escape before interpolating.
    const name=r.kind==="bus"?`🚌 ${esc(r.lineId||"")} · ${esc(issueLabel(r.type))}`
      :`Ⓜ ${esc(r.targetName||"")} · ${esc(issueLabel(r.type))}`;
    const tail=esc(agoTxt(Date.now()/1000-r.at))+(isConf(r)?"":` · ${esc(t("unconfirmed"))}`);
    L.marker([la,ln],{icon:flagIcon(r.kind,isRed(r)?"red":"yellow",isConf(r)),
        zIndexOffset:isConf(r)?600:500})
      .addTo(replayer).bindTooltip(`${name} · ${tail}`,{direction:"top"});
    b.extend([la,ln]);
  });
  if(b.isValid()) repmap.fitBounds(b,{padding:[40,40],maxZoom:15});
}

function renderReportList(){
  const box=$("#rep-strip");
  const reps=activeReports().sort((a,b)=>b.at-a.at);
  $("#rep-sub").textContent=`${reps.length} ${t("reports").toLowerCase()}`;
  const legend=`<div class="rep-legend">
    <span><i class="yellow"></i>${t("legendIssue")}</span>
    <span><i class="red"></i>${t("legendInsp")}</span>
    <span><i class="hollow"></i>${t("legendUnconf")}</span></div>`;
  const items=reps.length?reps.map(r=>{
    const cls=(isRed(r)?"red":"yellow")+(isConf(r)?"":" faint");
    const where=r.targetName||r.lineId||"";
    const tags=[agoTxt(Date.now()/1000-r.at)];
    if(!isConf(r)) tags.push(t("unconfirmed"));
    if(r.confirms) tags.push(t("confirms")(r.confirms));
    if(r.mine) tags.push(t("mineOnly"));
    /* Anyone but the author can vouch for or knock down a flag. A "yes"
       from a second person is what turns an unconfirmed report into a
       real one; two "no"s remove it for everybody. */
    const vote=(!r.mine&&!r.voted)?`<div class="rvote">
        <button class="rv yes" data-id="${r.id}">${t("stillThere")}</button>
        <button class="rv no" data-id="${r.id}">${t("notThere")}</button></div>`:"";
    return `<div class="repitem${isConf(r)?"":" faint"}"><div class="rb ${cls}"></div><div class="ri">
      <div class="rt">${esc(issueLabel(r.type))}${r.lineId?" · "+esc(r.lineId):""}</div>
      <div class="rs">${esc(where)}<br>${esc(tags.join(" · "))}</div>${vote}
      </div>${r.mine?`<button class="rx" data-id="${r.id}">✕</button>`:""}</div>`;
  }).join(""):`<div class="note">${t("noReports")}</div>`;
  box.innerHTML=`<button class="rep-cta" id="rep-new">${t("reportCta")}</button>${legend}${items}`;
  $("#rep-new").onclick=openReportForm;
  box.querySelectorAll(".rx").forEach(btn=>{
    btn.onclick=async()=>{
      btn.disabled=true;
      try{
        await fetch(base()+"/reports/delete",{method:"POST",cache:"no-store",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({id:btn.dataset.id,by:myId()})});
        await refreshReports(); drawReportMap(); renderReportList(); renderView();
      }catch(_){ btn.disabled=false; }
    };
  });
  box.querySelectorAll(".rv").forEach(btn=>{
    btn.onclick=async()=>{
      const yes=btn.classList.contains("yes");
      btn.parentElement.querySelectorAll(".rv").forEach(b=>b.disabled=true);
      try{
        const res=await fetch(base()+"/reports/vote",{method:"POST",cache:"no-store",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({id:btn.dataset.id,by:myId(),vote:yes?"yes":"no"})});
        toast(res.status===409?t("voteDone"):t("voteThanks"));
        await refreshReports(); drawReportMap(); renderReportList(); renderView();
      }catch(_){ btn.parentElement.querySelectorAll(".rv").forEach(b=>b.disabled=false); }
    };
  });
}

async function refreshReports(){
  if(!hasBackend()) return;
  /* ?by= lets the server mark OUR rows with mine:true without ever
     exposing anyone's reporter token to other clients. */
  try{ const r=await fetch(`${base()}/reports?by=${encodeURIComponent(myId())}`,{cache:"no-store"});
    if(r.ok) state.reports=await r.json(); }catch(_){}
  repBadge();
}
function repBadge(){
  const n=activeReports().length, b=$("#repcount");
  b.textContent=n; b.style.display=n?"grid":"none";
}

/* ---------------- "which bus am I on?" -----------------------------
 * You can only flag the vehicle you are actually inside, so the app has
 * to work out which one that is.
 *
 * WHY THE OLD VERSION FAILED ON A MOVING BUS. It shortlisted vehicles by
 * distance and only then compared velocities. But an OASA fix is 30-60 s
 * old, so a bus doing 8 m/s reports itself 250-450 m behind where it
 * actually is — and the shortlist threw it away before the velocity
 * comparison ever saw it. The error is proportional to speed, so it
 * vanishes the moment the bus stops: hence "it only finds my bus when we
 * pull into a stop". Worse, the slack that was supposed to cover this was
 * scaled by navigator.geolocation's `speed`, which is null on most single
 * fixes — so in practice there was no slack at all.
 *
 * WHAT IT DOES NOW.
 *  0. TRACK YOURSELF FIRST. watchMe() collects several fixes over ~8 s and
 *     fits a velocity to them. Never trust one fix's `speed` field; a
 *     least-squares fit over real displacement always exists.
 *  1. SHORTLIST WIDE. Every live vehicle the server returns (it trims at
 *     1.5 km) ranked by PLAUSIBILITY, not raw distance: sideways offset
 *     from your path costs full price, lag along your own path is nearly
 *     free, because that is exactly what a stale fix looks like from a
 *     seat. Nothing is discarded for being "too far".
 *  2. CO-MOVEMENT decides. Two more samples ~5.5 s apart. If you are on
 *     board, your track and the vehicle's point the same way — and
 *     direction, unlike speed, is completely immune to the feed's timing
 *     being unknown. Those get "moving with you" and float to the top.
 *  3. THE 100 m RULE STILL BITES, but as a verdict rather than a filter:
 *     see onboardOK(). Standing on the pavement watching a bus go past,
 *     nothing co-moves with you and nothing is within 100 m, so you still
 *     cannot flag it.
 * ------------------------------------------------------------------ */
/* Returns {generated, buses[]} — the timestamp matters: the first sample
   may come from the Worker's 10 s cache, so measuring velocity against
   wall-clock would understate it. opts.fresh bypasses that cache and
   opts.routes narrows the fan-out to the candidates we care about. */
async function sampleBuses(at,opts){
  const pos=at||here;
  const o=opts||{};
  await ensureMode();
  if(hasBackend()){
    try{
      let u=`${base()}/scan?lat=${pos.lat.toFixed(5)}&lng=${pos.lng.toFixed(5)}`;
      if(o.fresh) u+="&fresh=1";
      if(o.routes&&o.routes.length) u+="&routes="+encodeURIComponent(o.routes.join(","));
      const r=await fetch(u,{cache:"no-store"});
      if(r.ok){
        const j=await r.json();
        return { generated:Number(j.generated)||Date.now()/1000,
          buses:(Array.isArray(j.buses)?j.buses:[]).map(b=>({
            veh:String(b.veh),route:b.route||{},lat:Number(b.lat),lng:Number(b.lng),
            ts:Number(b.ts)||null })) };
      }
    }catch(_){}
  }
  // no backend: the old phone-side fan-out
  let routes=[];
  (state.stops||[]).forEach(s=>(s.routes||[]).forEach(r=>{
    if(!routes.some(x=>x.code===r.code)) routes.push(r); }));
  if(o.routes&&o.routes.length) routes=routes.filter(r=>o.routes.includes(String(r.code)));
  const out=[];
  await withLimit(routes.slice(0,ONBOARD.maxRoutes).map(r=>async()=>{
    const buses=await oasa("getBusLocation",r.code,null,!!o.fresh).catch(()=>null);
    (Array.isArray(buses)?buses:[]).forEach(v=>{
      const veh=String(pick(v,"VEH_NO","veh_no","VEH_CODE")||"");
      const la=Number(pick(v,"CS_LAT","cs_lat")), ln=Number(pick(v,"CS_LNG","cs_lng"));
      if(!veh||!isFinite(la)||!isFinite(ln)) return;
      out.push({veh,route:r,lat:la,lng:ln,ts:null});
    });
  }),6);
  return { generated:Date.now()/1000, buses:out };
}
/* Also carries speed/heading when the device reports them (phones do
   while actually moving) and the fix's own timestamp — both feed the
   staleness maths below. */
function myPosition(){
  return new Promise(res=>{
    const fallback={lat:here.lat,lng:here.lng,acc:999,speed:null,heading:null,t:Date.now()/1000};
    if(!navigator.geolocation) return res(fallback);
    navigator.geolocation.getCurrentPosition(
      p=>{ rememberPos(p);
        const c=p.coords;
        res({lat:c.latitude,lng:c.longitude,acc:c.accuracy||0,
          speed:(isFinite(c.speed)&&c.speed>=0)?c.speed:null,
          heading:(isFinite(c.heading)&&c.heading>=0)?c.heading:null,
          t:(p.timestamp?p.timestamp/1000:Date.now()/1000)});
      },
      ()=>res(fallback),
      {enableHighAccuracy:true,timeout:6000,maximumAge:0});
  });
}

/* Watch our own position for a while and hand back a TRACK, not a point.
   One getCurrentPosition gives `speed:null` on most Android fixes (the
   fused provider only fills it from raw GNSS doppler) and -1 on iOS, so
   anything scaled by it silently became zero. Several fixes always give
   displacement, and displacement always gives velocity. */
function watchMe(ms,onFix){
  return new Promise(res=>{
    const fixes=[]; let id=null,done=false,timer=null;
    const finish=()=>{
      if(done) return; done=true;
      clearTimeout(timer);
      if(id!=null){ try{ navigator.geolocation.clearWatch(id); }catch(_){} }
      res(track(fixes));
    };
    timer=setTimeout(finish,ms);
    if(!navigator.geolocation){ finish(); return; }
    try{
      id=navigator.geolocation.watchPosition(p=>{
        const c=p.coords;
        if(!isFinite(c.latitude)||!isFinite(c.longitude)) return;
        rememberPos(p);
        fixes.push({lat:c.latitude,lng:c.longitude,acc:c.accuracy||0,
          speed:(isFinite(c.speed)&&c.speed>=0)?c.speed:null,
          heading:(isFinite(c.heading)&&c.heading>=0)?c.heading:null,
          t:(p.timestamp?p.timestamp/1000:Date.now()/1000)});
        if(onFix) onFix(fixes.length,fixes[fixes.length-1]);
        // enough spread to fit a line? don't make the rider wait out the timer
        if(fixes.length>=ONBOARD.trackMin&&
           (fixes[fixes.length-1].t-fixes[0].t)>=ms/1000*0.6) finish();
      },()=>finish(),{enableHighAccuracy:true,timeout:ms,maximumAge:0});
    }catch(_){ finish(); }
  });
}

/* Least-squares velocity through a set of fixes: fit east(t) and north(t)
   independently and take the slopes. Robust to the metre-scale jitter a
   single pair of fixes would turn into a wild vector. */
function fitVelocity(fixes){
  if(!fixes||fixes.length<2) return null;
  const o=fixes[0], t0=o.t;
  let n=0,st=0,stt=0,sx=0,sy=0,stx=0,sty=0;
  fixes.forEach(f=>{
    const d=vec(o,f), dt=f.t-t0;
    n++; st+=dt; stt+=dt*dt; sx+=d[0]; sy+=d[1]; stx+=dt*d[0]; sty+=dt*d[1];
  });
  const den=n*stt-st*st;
  if(!(Math.abs(den)>1e-6)) return null;
  return [(n*stx-st*sx)/den,(n*sty-st*sy)/den];
}

/* Roll a set of fixes up into {pos, v, speed, acc, fixes, ok}. */
function track(fixes){
  const list=(fixes||[]).slice().sort((a,b)=>a.t-b.t);
  const last=list[list.length-1]||null;
  const pos=last||{lat:here.lat,lng:here.lng,acc:999,speed:null,heading:null,t:Date.now()/1000};
  const span=list.length>1?(list[list.length-1].t-list[0].t):0;
  let v=null;
  // a fit needs both several fixes and a few seconds of them; otherwise
  // fall back to whatever the device volunteered on the last one
  if(list.length>=3&&span>=4) v=fitVelocity(list);
  if(!v&&list.length>=2&&span>=2){
    const d=vec(list[0],last); v=[d[0]/span,d[1]/span];
  }
  if(!v&&last&&last.speed!=null&&last.heading!=null){
    const rad=last.heading*Math.PI/180;
    v=[last.speed*Math.sin(rad),last.speed*Math.cos(rad)];   // heading is from north, clockwise
  }
  const accs=list.map(f=>f.acc).filter(a=>isFinite(a)&&a>0).sort((a,b)=>a-b);
  const acc=accs.length?accs[Math.floor(accs.length/2)]:(pos.acc||999);
  return { pos, v, speed:v?len(v):0, acc, fixes:list, span,
           ok:list.length>0&&acc<=ONBOARD.accMax };
}
/* metres east/north between two points — small-angle flat projection,
   which is plenty over the few dozen metres travelled in 6 seconds. */
function vec(a,b){
  const k=Math.cos(a.lat*Math.PI/180);
  return [(b.lng-a.lng)*111320*k,(b.lat-a.lat)*111320];
}
function len(v){ return Math.hypot(v[0],v[1]); }
function cosAngle(u,v){
  const l=len(u)*len(v);
  return l?((u[0]*v[0]+u[1]*v[1])/l):0;
}
/* The 100 m rule is against TRUE distance, but we only ever see two
   noisy estimates of it:
     · your GPS fix — tens of metres off in a street canyon;
     · the bus's telematics ping — refreshed every ~20-40 s, so a MOVING
       bus reports where it was, not where it is.
   That second error is the killer. At 30 km/h a 35 s-old fix sits ~290 m
   behind the bus, so the vehicle you are sitting in falls outside a
   100 m gate and never appears — while a bus stopped at the kerb, whose
   stale position has caught up with reality, does. Hence:

     while you are moving, the gate widens by exactly how far a bus
     travels during that staleness, and the decision of which candidate
     is YOURS is made on velocity, not distance (see matchBuses).

   Standing still the gate stays ~100 m, so the product rule — you can't
   flag a bus you're merely watching go past — is unchanged. */
/* The standing-still rule: ~100 m plus whatever the fix is worth. This is
   deliberately NOT widened by speed. Speed widens the SHORTLIST (see
   plausibility) because a stale fix lags; it must not widen the VERDICT,
   or "within reach" would mean 450 m on a moving bus and the rule would
   stop meaning anything. While moving, co-movement is the only route to
   a confirmed report. */
function acceptRadius(acc){ return ONBOARD.busRadius+Math.min(100,Math.max(0,acc||0)); }

/* How believable is "I am sitting inside that vehicle", in metres of
   doubt? Standing still we have nothing but distance. Moving, we split
   the gap between the bus's reported position and us into:
     along — displacement along OUR direction of travel. Positive means
             the bus is behind us, which is exactly what a stale fix
             looks like from on board, so it is nearly free.
     cross — sideways. A bus one street over has this no matter how
             stale it is, so it is charged in full.
   This is the inversion of the old behaviour: a bus 400 m behind us on
   our own street now outranks one 60 m away on a parallel one. */
function plausibility(at,me){
  const raw=haversine(at.lat,at.lng,me.pos.lat,me.pos.lng);
  if(!me.v||me.speed<ONBOARD.moveMs) return raw;
  const unit=[me.v[0]/me.speed,me.v[1]/me.speed];
  const off=vec(at,me.pos);                       // bus fix → me
  const along=off[0]*unit[0]+off[1]*unit[1];
  const cross=Math.hypot(off[0]-along*unit[0],off[1]-along*unit[1]);
  const reach=me.speed*ONBOARD.maxStaleS+120;     // furthest a stale fix can lag
  const lag=along<0 ? -along*1.5                  // ahead of us: not staleness
                    : Math.max(0,along-reach);    // behind us: free up to `reach`
  return cross+lag;
}

async function findMyBus(onProgress){
  const me=await watchMe(ONBOARD.trackMs,onProgress&&(n=>onProgress({phase:"fix",fixes:n})));
  if(!me.ok) return { me, p0:me.pos, t0:Date.now()/1000, list:[], badFix:true };
  if(onProgress) onProgress({phase:"scan"});
  const scan=await sampleBuses(me.pos);
  const near={};
  (scan.buses||[]).forEach(c=>{
    const d=haversine(c.lat,c.lng,me.pos.lat,me.pos.lng);
    if(d>ONBOARD.gateM) return;                   // the server's own trim, nothing tighter
    // the same vehicle can surface on two route variants — keep the closest
    if(!near[c.veh]||d<near[c.veh].d){
      near[c.veh]={...c,d,rawD:d,p0:{lat:c.lat,lng:c.lng},t0:c.ts||scan.generated};
    }
  });
  const list=Object.values(near).map(c=>{
    c.cost=plausibility(c,me); c.withYou=false; return c;
  }).sort(candOrder).slice(0,ONBOARD.shortlist);
  return { me, p0:me.pos, t0:scan.generated, list };
}
function candOrder(a,b){
  return (b.withYou?1:0)-(a.withYou?1:0) || a.cost-b.cost || a.d-b.d;
}

/* Two more looks, ~5.5 s apart. This is where the real decision happens.
 *
 * The insight: a stale feed shifts a bus's REPORTED POSITION, but not
 * the DIRECTION it is travelling. If you are on board, your track and the
 * bus's point the same way even when the reported positions are 300 m
 * apart — and direction, unlike speed, needs no knowledge of when the
 * feed's fixes were actually taken. So heading agreement is the primary
 * test and pace is applied only when OASA timestamps both ends.
 *
 * Three samples rather than two: a single 6 s baseline at walking-pace
 * speeds is barely larger than GPS noise, and OASA often repeats the
 * same fix across one interval and jumps across the next. Duplicated
 * fixes are dropped, so the baseline stretches to whatever the feed
 * actually gave us.
 *
 * onProgress fires after each round so the list re-ranks in front of the
 * rider instead of sitting still for 12 s. */
async function refineMyBus(cands,me0,t0,onProgress){
  const codes=[...new Set(cands.map(c=>String((c.route||{}).code||"")).filter(Boolean))].slice(0,6);
  const hist=new Map();
  cands.forEach(c=>hist.set(c.veh,[{lat:c.p0.lat,lng:c.p0.lng,ts:c.ts||null,t:c.t0||t0}]));
  let fixes=me0.fixes.slice();

  for(let round=1;round<ONBOARD.samples;round++){
    const seg=await watchMe(ONBOARD.sampleMs);
    fixes=fixes.concat(seg.fixes);
    const wall=Date.now()/1000;
    let scan;
    try{ scan=await sampleBuses(me0.pos,{fresh:true,routes:codes}); }catch(_){ scan=null; }
    if(scan) (scan.buses||[]).forEach(v=>{
      const h=hist.get(v.veh); if(!h) return;
      const prev=h[h.length-1];
      // an unchanged fix is not a new observation — recording it would
      // read as "this bus is parked" and destroy the baseline
      if(Math.abs(v.lat-prev.lat)<1e-7&&Math.abs(v.lng-prev.lng)<1e-7) return;
      h.push({lat:v.lat,lng:v.lng,ts:v.ts||null,t:Math.max(scan.generated||0,wall)});
    });
    const me=scoreCands(cands,hist,fixes);
    if(onProgress) onProgress(cands.slice().sort(candOrder),round,me);
  }
  return { list:cands.slice().sort(candOrder), me:track(fixes) };
}

/* Turn the accumulated position histories into a verdict per candidate.
   Returns the rider's own track, which is what onboardOK() needs. */
function scoreCands(cands,hist,fixes){
  const me=track(fixes);
  cands.forEach(c=>{
    const h=hist.get(c.veh)||[];
    const last=h[h.length-1]||c.p0;
    c.lat=last.lat; c.lng=last.lng;
    c.rawD=haversine(last.lat,last.lng,me.pos.lat,me.pos.lng);
    c.d=c.rawD; c.withYou=false; c.age=0;

    // nothing moved, or the feed never gave us a second distinct fix:
    // no velocity to compare, so no verdict — plausibility ranking stands
    if(h.length<2||!me.v||me.speed<ONBOARD.moveMs){
      c.cost=plausibility(last,me); return;
    }
    const first=h[0];
    const moved=vec(first,last), dist=len(moved);
    if(dist<ONBOARD.minMove){ c.cost=plausibility(last,me); return; }
    const dir=[moved[0]/dist,moved[1]/dist];

    /* Split the gap between the bus's reported position and me along its
       OWN direction of travel:
         along — what a stale fix looks like (the bus is behind itself)
         cross — what a DIFFERENT street looks like
       A stale fix inflates `along` and leaves `cross` at GPS-noise level;
       a bus one street over inflates `cross` however stale it is. */
    const off=vec(last,me.pos);
    const along=off[0]*dir[0]+off[1]*dir[1];
    const cross=Math.hypot(off[0]-along*dir[0],off[1]-along*dir[1]);
    c.cross=cross; c.along=along;

    /* Pace, and the dead-reckoning that follows it, both need to know how
       much real time the bus's displacement took. Only OASA's own stamps
       can tell us that — our sample interval is an upper bound on it, not
       a measurement. With stamps: compare speeds. Without: assume we are
       together, which makes the along-track lag itself the age of the fix. */
    let paceOK=true, busSpeed=me.speed;
    if(first.ts&&last.ts&&last.ts>first.ts){
      busSpeed=dist/(last.ts-first.ts);
      const ratio=Math.min(me.speed,busSpeed)/Math.max(me.speed,busSpeed);
      paceOK=ratio>ONBOARD.paceOK;
      c.age=Math.max(0,Math.min(ONBOARD.maxStaleS,(Date.now()/1000)-last.ts));
    }else{
      c.age=Math.max(0,Math.min(ONBOARD.maxStaleS,along/Math.max(busSpeed,0.5)));
    }
    const proj=project(last,[dir[0]*busSpeed,dir[1]*busSpeed],c.age);
    c.d=haversine(proj.lat,proj.lng,me.pos.lat,me.pos.lng);

    const cos=cosAngle(me.v,dir);
    const sameStreet=cross<=Math.max(ONBOARD.crossMax,me.acc||0);
    const reach=me.speed*ONBOARD.maxStaleS+150;
    const explainable=along>=-150&&along<=reach;
    c.agree=cos>ONBOARD.cosOK&&paceOK;
    c.withYou=c.agree&&sameStreet&&explainable;
    c.cost=cross+Math.max(0,along-reach);
  });
  return me;
}

/* The product rule, applied at the point of decision rather than as a
   filter on the shortlist: you may flag a vehicle that is co-moving with
   you, or one genuinely within arm's reach. Standing on the pavement
   watching a bus go past satisfies neither. */
function onboardOK(c,me){
  if(!c) return false;
  if(c.withYou) return true;
  return (c.d!=null?c.d:c.rawD)<=acceptRadius(me&&me.acc);
}
/* move a point by a velocity vector (m/s, east/north) for `secs` */
function project(p,v,secs){
  const k=Math.cos(p.lat*Math.PI/180)||1;
  return { lat:p.lat+(v[1]*secs)/111320, lng:p.lng+(v[0]*secs)/(111320*k) };
}

/* -------------------- report form (2 steps) ------------------------ */
const reportForm={open:false};
const NOTICE_KEY="repNotice";
/* Shown once, before anyone's first report. It is the app's only
   acceptable-use statement at the point it actually matters, and it is
   also what makes "you are responsible for what you file" something the
   rider has read rather than something buried in the terms. */
function openReportForm(){
  if(!localStorage.getItem(NOTICE_KEY)){ firstReportNotice(); return; }
  reportFormBody();
}
function firstReportNotice(){
  const box=$("#rep-strip");
  reportForm.open=true;
  box.innerHTML=`<div class="field"><label>${t("firstH")}</label>
      <div class="note">${esc(t("firstP"))}</div></div>
    <button class="rep-cta" id="rf-ok" style="margin-top:12px">${t("agree")}</button>
    <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
  $("#rf-ok").onclick=()=>{
    try{ localStorage.setItem(NOTICE_KEY,"1"); }catch(_){}
    reportFormBody();
  };
  $("#rf-cancel").onclick=()=>{
    reportForm.open=false; drawReportMap(); renderReportList();
  };
}
function reportFormBody(){
  const box=$("#rep-strip");
  reportForm.open=true;
  // No category preselected: scanning for buses costs a burst of API
  // calls and a GPS fix, so nothing happens until the user says where
  // they are.
  let kind=null, target=null, type=null, busy=false;

  const close=()=>{ reportForm.open=false; drawReportMap(); renderReportList(); };
  const kindChips=()=>`<div class="field"><label>${t("reportWhere")}</label>
    <div class="chips" id="rf-kind">
      <button class="chip${kind==="bus"?" on":""}" data-k="bus">${t("onBus")}</button>
      <button class="chip${kind==="metro"?" on":""}" data-k="metro">${t("atMetro")}</button>
    </div></div>`;
  const wireKind=()=>box.querySelectorAll("#rf-kind .chip").forEach(c=>c.onclick=()=>{
    if(busy||c.dataset.k===kind) return;
    kind=c.dataset.k; type=TYPES_BY_KIND[kind][0]; target=null; step1();
  });

  /* ---- step 1: what are you on / at? ---- */
  function step1(){
    if(!kind){
      box.innerHTML=kindChips()+
        `<div class="note">${t("pickWhere")}</div>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-cancel").onclick=close;
      return;
    }
    box.innerHTML=kindChips()+
      `<div class="note" id="rf-body">${kind==="bus"?t("scanBus"):t("searching")}</div>
       <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
    wireKind(); $("#rf-cancel").onclick=close;
    kind==="bus"?pickBus():pickMetro();
  }

  async function pickBus(){
    busy=true;
    const myKind=kind;
    const alive=()=>reportForm.open&&kind===myKind;
    const note=txt=>{ const b=$("#rf-body"); if(b) b.textContent=txt; };
    let found=null, me=null;
    try{
      found=await findMyBus(p=>{ if(alive()) note(p.phase==="scan"?t("scanBus"):t("gpsFix")); });
    }catch(_){ found=null; }
    busy=false;
    if(!alive()) return;

    // A vague fix can't identify anything; say so instead of scanning and
    // then blaming the feed for the empty list it was always going to give.
    if(!found||found.badFix){
      box.innerHTML=kindChips()+
        `<div class="note">${t("gpsWeak")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      return;
    }
    if(!found.list.length){
      box.innerHTML=kindChips()+
        `<div class="note">${t("noBusNear")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      return;
    }
    const cands=found.list;
    me=found.me;
    drawCands(cands.slice().sort(candOrder),1);
    // further opinions arrive every few seconds and re-rank in place
    refineMyBus(cands,found.me,found.t0,(list,round,mNow)=>{
      me=mNow||me;
      if(alive()&&!target) drawCands(list,round+1);
    }).then(res=>{
      me=res.me||me;
      if(alive()&&!target) drawCands(res.list,ONBOARD.samples);
    }).catch(()=>{});

    function drawCands(list,round){
      const pending=round<ONBOARD.samples;
      box.innerHTML=kindChips()+
        `<div class="field"><label>${t("confirmBus")}</label>
          <div class="cands" id="rf-cands">${list.map((c,i)=>{
            const dest=destOf((LANG==="en"?(c.route.en||c.route.el):(c.route.el||c.route.en))||"");
            const ok=onboardOK(c,me);
            return `<button class="cand${c.withYou?" hot":""}${ok?"":" cold"}" data-i="${i}">
              <span class="cand-tile num">${esc(c.route.id||"")}</span>
              <span class="cand-txt"><span class="cand-dest">${esc(dest)}</span>
                <span class="cand-meta">${fmtDist(c.d)}${c.withYou?` · ✓ ${t("withYou")}`
                  :(ok?"":` · ${t("unsure")}`)}</span></span>
            </button>`; }).join("")}</div></div>
         <div class="shint">${pending?t("scanRefine"):t("onboardNote")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      box.querySelectorAll(".cand").forEach(b=>b.onclick=()=>{
        const c=list[+b.dataset.i];
        target={ id:c.veh, name:destOf((LANG==="en"?(c.route.en||c.route.el):(c.route.el||c.route.en))||""),
          lineId:c.route.id||"", routeCode:c.route.code, veh:c.veh, lat:c.lat, lng:c.lng,
          /* The location check no longer BLOCKS the choice — it grades it.
             A graded-down report is filed as unconfirmed: visible, hollow,
             short-lived, and it needs a second rider to agree before it
             counts. See the two-tier note in worker.js. */
          confirmed:onboardOK(c,me) };
        step2();
      });
    }
  }

  async function pickMetro(){
    busy=true; await loadMetro(); busy=false;
    if(!reportForm.open||kind!=="metro") return;
    const near=(state.metro||[]).map(m=>({...m,d:haversine(m.lat,m.lng,here.lat,here.lng)}))
      .filter(m=>m.d<=ONBOARD.metroRadius).sort((a,b)=>a.d-b.d);
    if(!near.length){
      box.innerHTML=kindChips()+
        `<div class="note">${t("noMetroNear")}</div>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-cancel").onclick=close; return;
    }
    box.innerHTML=kindChips()+
      `<div class="field"><label>${t("nearestStation")}</label>
        <div class="cands" id="rf-cands">${near.map((m,i)=>`
          <button class="cand" data-i="${i}"><span class="cand-tile">Ⓜ</span>
            <span class="cand-txt"><span class="cand-dest">${esc(LANG==="en"?(m.name_en||m.name):m.name)}</span>
              <span class="cand-meta">${esc(m.lines.map(l=>"M"+l).join(" · "))} · ${fmtDist(m.d)}</span></span>
          </button>`).join("")}</div></div>
       <div class="shint">${t("metroNote")}</div>
       <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
    wireKind(); $("#rf-cancel").onclick=close;
    box.querySelectorAll(".cand").forEach(b=>b.onclick=()=>{
      const m=near[+b.dataset.i];
      /* Stations don't move and don't go stale, so the 600 m rule is a
         real measurement here — a metro report is always confirmed. */
      target={ id:m.id, name:(LANG==="en"?(m.name_en||m.name):m.name)||"",
        lineId:m.lines.map(l=>"M"+l).join("/"), routeCode:null, veh:null,
        lat:m.lat, lng:m.lng, confirmed:true };
      step2();
    });
  }

  /* ---- step 2: what's happening? (menu depends on the category) ---- */
  function step2(){
    const types=TYPES_BY_KIND[kind]||[];
    if(!types.includes(type)) type=types[0];
    box.innerHTML=`
      <div class="field"><label>${kind==="bus"?t("onBus"):t("atMetro")}</label>
        <div class="picked"><span class="cand-tile num">${esc(target.lineId||"Ⓜ")}</span>
          <span class="cand-dest">${esc(target.name||target.id)}</span></div></div>
      <div class="field"><label>${t("issueType")}</label>
        <div class="chips" id="rf-type">${types.map(x=>
          `<button class="chip${x===type?" on":""}" data-t="${x}">${esc(issueLabel(x))}</button>`).join("")}
        </div></div>
      ${target.confirmed?"":`<div class="shint">${t("unconfNote")}</div>`}
      <button class="rep-cta" id="rf-send" style="margin-top:14px">${t("send")}</button>
      <button class="ghost" id="rf-back">${t("back")}</button>
      <div class="note" id="rf-msg" style="display:none"></div>`;
    box.querySelectorAll("#rf-type .chip").forEach(c=>c.onclick=()=>{
      type=c.dataset.t;
      box.querySelectorAll("#rf-type .chip").forEach(x=>x.classList.toggle("on",x===c));
    });
    $("#rf-back").onclick=()=>{ target=null; step1(); };
    $("#rf-send").onclick=send;
  }

  async function send(){
    const btn=$("#rf-send"), msg=$("#rf-msg");
    if(!target) return;
    btn.disabled=true; btn.textContent="…";
    const fail=txt=>{ msg.style.display=""; msg.textContent=txt;
      btn.disabled=false; btn.textContent=t("send"); };
    try{
      const res=await fetch(base()+"/reports",{method:"POST",cache:"no-store",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ by:myId(), kind, type,
          targetId:target.id, targetName:target.name, lineId:target.lineId,
          routeCode:target.routeCode, veh:target.veh, lat:target.lat, lng:target.lng,
          confirmed:!!target.confirmed })});
      let j={}; try{ j=await res.json(); }catch(_){}
      if(!res.ok){ fail(j.error||("HTTP "+res.status)); return; }
      reportForm.open=false;
      await refreshReports(); await refreshFlagPositions();
      drawReportMap(); renderReportList(); renderView();
    }catch(e){ fail(String((e&&e.message)||e)); }
  }

  step1();
}

/* =========================== the menu ============================= *
 * Everything that isn't "what's coming to my stop" lives behind the ☰:
 * look up a line, watch the buses move, switch language, read about it.
 * ------------------------------------------------------------------ */
function menuOpen(){ return !$("#menu").hidden; }
function toggleMenu(force){
  const open = force!=null?force:!menuOpen();
  $("#menu").hidden=!open;
  $("#menubtn").setAttribute("aria-expanded",open?"true":"false");
}
document.addEventListener("click",e=>{
  if(!menuOpen()) return;
  if(e.target.closest("#menu")||e.target.closest("#menubtn")) return;
  toggleMenu(false);
});

/* ------------------------- toast + stop card ---------------------- */
let toastTimer=null;
function toast(msg){
  const el=$("#toast"); if(!el||!msg) return;
  el.textContent=msg; el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ el.hidden=true; },1900);
}

/* One stop, centred, with the same arrival rows as the list — opened
   from search so you can glance at it without walking there. Long-press
   its name to pin it, exactly like in the list. */
let cardStop=null;
function openStopCard(s){
  cardStop=s;
  $("#stopcard").classList.add("on");
  renderStopCard();
  (async()=>{                       // fill in whatever we don't have yet
    try{
      if(!s.routesLoaded) await loadRoutes(s);
      await loadArrivals(s);
    }catch(_){}
    if(cardStop===s) renderStopCard();
  })();
}
function closeStopCard(){ $("#stopcard").classList.remove("on"); cardStop=null; }
function renderStopCard(){
  const s=cardStop; if(!s) return;
  const fav=isFav(s.code);
  $("#sc-name").innerHTML=(fav?'<span class="star">★</span>':"")+esc(stopName(s));
  const w=walkMin(s.dist);
  $("#sc-meta").textContent=[isFinite(s.dist)?fmtDist(s.dist):"",
    w?`🚶 ~${w}′`:""].filter(Boolean).join(" · ");
  const rows=$("#sc-rows");
  if(!s.arrLoaded){ rows.innerHTML='<div class="skel"></div><div class="skel"></div>'; }
  else if(!s.arrivals.length){ rows.innerHTML=`<div class="empty">${t("nobus")}</div>`; }
  else{
    rows.innerHTML="";
    s.arrivals.slice(0,CONFIG.maxRows).forEach(a=>{
      const now=a.min<=1,d=arrDest(s,a.code);
      const row=document.createElement("div"); row.className="row";
      row.innerHTML=`<div class="tile num">${esc(String(arrLine(s,a.code)))}</div>
        <div class="dest">${d?`<span class="to">${t("to")}</span>${esc(d)}`:""}${flagLine(reportForArrival(a))}</div>
        <div class="eta ${now?"now":""}">${now?`<span class="v">${t("now")}</span>`
          :`<span class="v num">${a.min}</span><span class="u">${t("min")}</span>`}</div>`;
      onLongPress(row,()=>{ closeStopCard(); openRoutePreview(s,String(a.code),a.min); });
      rows.appendChild(row);
    });
  }
  $("#sc-hint").textContent=fav?t("favHintOn"):t("favHint");
}

/* ------------------------ line lookup ------------------------------ */
async function loadLines(){
  if(state.lines&&state.lines.length) return state.lines;
  if(hasBackend()){
    try{ const r=await fetch(base()+"/lines",{cache:"no-store"});
      if(r.ok){ const j=await r.json(); if(Array.isArray(j)&&j.length){ state.lines=j; return j; } } }catch(_){}
  }
  // no backend (or the endpoint failed): go straight to OASA
  const raw=await oasa("webGetLines").catch(()=>null);
  state.lines=(Array.isArray(raw)?raw:[]).map(l=>({
    code:String(pick(l,"LineCode","line_code")||""),
    id:String(pick(l,"LineID","line_id")||""),
    el:pick(l,"LineDescr","line_descr")||"", en:pick(l,"LineDescrEng","line_descr_eng")||"",
  })).filter(l=>l.code&&l.id);
  return state.lines;
}
function openLineSearch(){
  toggleMenu(false);
  $("#ln-h").textContent=t("lineH"); $("#ln-p").textContent=t("lineP");
  $("#lnq").placeholder=t("linePh");
  $("#lnres").innerHTML="";
  $("#linebg").classList.add("on");
  $("#lnq").value=""; setTimeout(()=>$("#lnq").focus(),80);
  loadLines();
}
function closeLineSearch(){ $("#linebg").classList.remove("on"); }
/* "22" should find 022 and Α22 but not 220 — so: exact, then prefix,
   then anywhere, and only fall back to the description text after that. */
function matchLines(lines,q){
  const s=q.trim().toLowerCase();
  if(!s) return [];
  const norm=x=>String(x||"").toLowerCase().replace(/^0+/,"");
  const ns=norm(s);
  const score=l=>{
    const id=l.id.toLowerCase(), nid=norm(id);
    if(id===s||nid===ns) return 0;
    if(id.startsWith(s)||nid.startsWith(ns)) return 1;
    if(id.includes(s)) return 2;
    if((l.el+" "+l.en).toLowerCase().includes(s)) return 3;
    return 9;
  };
  return lines.map(l=>({l,r:score(l)})).filter(x=>x.r<9)
    .sort((a,b)=>a.r-b.r||String(a.l.id).localeCompare(String(b.l.id),undefined,{numeric:true}))
    .slice(0,25).map(x=>x.l);
}
/* One field, two kinds of answer: lines (matched against the cached
   catalogue) and stops. OASA has no stop-name search, so stops come from
   the Worker's /stops/search, which geocodes the query and returns the
   stops around that place — plus anything matching among the stops
   already loaded around you, which needs no request at all. */
function localStopMatches(q){
  const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const n=norm(q);
  if(!n) return [];
  const pool=(state.stops||[]).concat(Object.values(state.favLive||{}));
  const seen={},out=[];
  pool.forEach(s=>{
    const key=String(s.code);
    if(seen[key]) return;
    if(norm(s.name_el).includes(n)||norm(s.name_en).includes(n)||norm(s.street).includes(n)){
      seen[key]=1; out.push(s);
    }
  });
  return out.sort((a,b)=>(a.dist||0)-(b.dist||0)).slice(0,6);
}
async function doLineSearch(){
  const box=$("#lnres"), q=$("#lnq").value;
  if(!q.trim()) return;
  box.innerHTML=`<div class="res-msg">${t("searching")}</div>`;

  const lines=await loadLines();
  const lineHits=matchLines(lines,q);
  const localStops=localStopMatches(q);

  let remoteStops=[];
  if(hasBackend()){
    try{
      const r=await fetch(`${base()}/stops/search?q=${encodeURIComponent(q)}`,{cache:"no-store"});
      if(r.ok){ const j=await r.json(); remoteStops=Array.isArray(j.stops)?j.stops:[]; }
    }catch(_){}
  }
  // de-dupe: a stop we already hold locally wins (it has live arrivals)
  const haveLocal={}; localStops.forEach(s=>{ haveLocal[String(s.code)]=1; });
  const stopHits=localStops.concat(remoteStops.filter(s=>!haveLocal[String(s.code)]))
    .slice(0,8);

  if(!lineHits.length&&!stopHits.length){
    box.innerHTML=`<div class="res-msg">${t("noLine")}</div>`; return;
  }
  box.innerHTML="";
  if(lineHits.length){
    const h=document.createElement("div"); h.className="sec-label";
    h.textContent=t("secLines"); box.appendChild(h);
  }
  lineHits.forEach(l=>{
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`<b class="num">${esc(l.id)}</b> · ${esc((LANG==="en"?(l.en||l.el):(l.el||l.en))||"")}`;
    b.onclick=()=>pickLineDirection(l);
    box.appendChild(b);
  });
  if(stopHits.length){
    const h=document.createElement("div"); h.className="sec-label";
    h.textContent=t("secStops"); box.appendChild(h);
  }
  stopHits.forEach(raw=>{
    const s=adoptStop(raw);
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`${isFav(s.code)?'<span class="star">★</span> ':""}🚏 ${esc(stopName(s))}`
      +(isFinite(s.dist)?` <span style="color:var(--ink3)">· ${fmtDist(s.dist)}</span>`:"");
    b.onclick=()=>{ closeLineSearch(); openStopCard(s); };
    box.appendChild(b);
  });
}
/* Turn a search result into a full stop object we can load arrivals
   into — reusing the live one if we already track that code. */
function adoptStop(raw){
  const key=String(raw.code);
  const existing=(state.stops||[]).find(s=>String(s.code)===key)||state.favLive[key];
  if(existing) return existing;
  const s={code:key,name_el:raw.name_el||"",name_en:raw.name_en||"",street:raw.street||"",
    lat:Number(raw.lat),lng:Number(raw.lng),
    dist:(isFinite(raw.lat)&&isFinite(here.lat))?haversine(here.lat,here.lng,Number(raw.lat),Number(raw.lng)):NaN,
    lines:[],routes:[],routeMap:{},arrivals:[],routesLoaded:false,arrLoaded:false};
  state.favLive[key]=s;      // keep it around so favouriting works
  return s;
}
/* A line has two directions (and sometimes more variants); each is its
   own route code, and a route code is what the preview needs. */
async function pickLineDirection(line){
  const box=$("#lnres");
  box.innerHTML=`<div class="res-msg">${t("searching")}</div>`;
  const raw=await oasa("getRoutesForLine",line.code).catch(()=>null);
  const routes=(Array.isArray(raw)?raw:[]).map(r=>({
    code:String(pick(r,"RouteCode","route_code")||""),
    el:pick(r,"RouteDescr","route_descr")||line.el,
    en:pick(r,"RouteDescrEng","route_descr_eng")||line.en,
  })).filter(r=>r.code);
  if(!routes.length){ box.innerHTML=`<div class="res-msg">${t("noRoute")}</div>`; return; }
  const show=r=>{ closeLineSearch();
    openRoutePreview(null,r.code,null,{line:line.id,el:r.el,en:r.en}); };
  if(routes.length===1){ show(routes[0]); return; }
  box.innerHTML=`<div class="res-msg">${t("pickDir")}</div>`;
  routes.slice(0,6).forEach(r=>{
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`<b class="num">${esc(line.id)}</b> · ${esc(destOf((LANG==="en"?(r.en||r.el):(r.el||r.en))||""))}`;
    b.onclick=()=>show(r);
    box.appendChild(b);
  });
}

/* ---------------------- live bus map -------------------------------
 * "Every bus in Athens" is more subrequests than a Worker gets in one
 * go, so the map is honest about it: it loads the lines around the map
 * centre and draws every vehicle running on them. Pan and hit ↻ to load
 * another area. */
let lmap=null,llayer=null,liveBusy=false;
function openLiveMap(){
  toggleMenu(false);
  $("#live").classList.add("on");
  $("#live-title").textContent=t("liveH");
  if(!lmap){
    lmap=L.map("livemap",{zoomControl:true}).setView([here.lat,here.lng],14);
    L.tileLayer(tileUrl(),{subdomains:"abcd",maxZoom:20,detectRetina:true,attribution:TILE_ATTR}).addTo(lmap);
    llayer=L.layerGroup().addTo(lmap);
  }
  $("#live-hint").innerHTML=`<div class="shint">${t("liveHint")}</div>`;
  setTimeout(()=>lmap.invalidateSize(),70);
  loadLive();
}
function closeLiveMap(){ $("#live").classList.remove("on"); }
async function loadLive(){
  if(liveBusy||!lmap) return;
  liveBusy=true;
  $("#live-sub").textContent=t("liveLoading");
  const c=lmap.getCenter();
  let buses=[];
  try{
    if(hasBackend()){
      const r=await fetch(`${base()}/live?lat=${c.lat.toFixed(4)}&lng=${c.lng.toFixed(4)}`,{cache:"no-store"});
      if(r.ok){ const j=await r.json(); buses=Array.isArray(j.buses)?j.buses:[]; }
    } else {
      // no backend: fan out over the routes we already know about
      const routes=[]; (state.stops||[]).forEach(s=>(s.routes||[]).forEach(x=>{
        if(!routes.some(y=>y.code===x.code)) routes.push(x); }));
      await withLimit(routes.slice(0,10).map(rt=>async()=>{
        const arr=await oasa("getBusLocation",rt.code).catch(()=>null);
        (Array.isArray(arr)?arr:[]).forEach(v=>buses.push({
          veh:String(pick(v,"VEH_NO","veh_no")||""), line:rt.id, routeCode:rt.code,
          el:rt.el, en:rt.en,
          lat:Number(pick(v,"CS_LAT","cs_lat")), lng:Number(pick(v,"CS_LNG","cs_lng"))}));
      }),5);
    }
  }catch(_){}
  llayer.clearLayers();
  L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:900}).addTo(llayer);
  let n=0;
  buses.forEach(v=>{
    if(!isFinite(v.lat)||!isFinite(v.lng)) return;
    n++;
    const dest=destOf((LANG==="en"?(v.en||v.el):(v.el||v.en))||"");
    L.marker([v.lat,v.lng],{icon:L.divIcon({className:"",
      html:`<div class="livebus num">${esc(v.line||"")}</div>`,iconSize:[30,20],iconAnchor:[15,10]})})
      .addTo(llayer).bindTooltip(`${esc(v.line||"")}${dest?" · "+esc(dest):""}`,{direction:"top"});
  });
  $("#live-sub").textContent = n?t("liveCount")(n):t("liveNone");
  liveBusy=false;
}

/* ====================== tracking & stats UI ======================= */
let statRoute=null, statDays=7;
function openStats(){ $("#statbg").classList.add("on"); renderStats(); }
function closeStats(){ $("#statbg").classList.remove("on"); }
async function trackList(){
  if(!hasBackend()) return null;
  try{ const r=await fetch(base()+"/track/list",{cache:"no-store"}); return r.ok?await r.json():null; }catch{ return null; }
}
async function renderStats(){
  $("#st-h").textContent=t("stats"); $("#st-p").textContent=t("statsP");
  const body=$("#st-body");
  const list=await trackList();
  if(list===null){ body.innerHTML=`<div class="note">${t("trackOff")}</div>`; return; }
  body.innerHTML="";

  if(!list.length) body.innerHTML=`<div class="note">${t("noTracked")}</div>`;
  const nowS=Math.floor(Date.now()/1000);
  list.forEach(r=>{
    const d=document.createElement("div"); d.className="rule";
    const days=Math.max(0,(nowS-(r.added_at||nowS))/86400);
    const dur = days>=1 ? `${Math.floor(days)}${t("dayShort")}`
      : `${Math.max(1,Math.round(days*24))}${t("hourShort")}`;
    const fresh = r.last_ts ? relTime(nowS-r.last_ts) : null;
    const ready = days>=3 && (r.events||0)>=400;
    const started = r.added_at ? new Date(r.added_at*1000).toLocaleDateString() : "";
    d.innerHTML=`<div class="info"><div class="ln">${esc(r.line_id||r.route_code)}
        <span style="font-weight:600;color:var(--muted);font-size:11.5px"> · ${t("trackingFor")} ${dur}</span></div>
      <div class="dt">${esc(destOf(r.descr)||"")}<br>
        ${t("sinceWord")} ${started} · <b style="color:var(--paper)">${(r.events||0).toLocaleString()}</b> ${t("events")}${r.vehicles?` · ${r.vehicles} ${t("vehicles").toLowerCase()}`:""}
        ${fresh?`<br>${t("lastBus")} ${fresh}`:""}
        <br><span style="${ready?"font-weight:700":"background:var(--marker);padding:0 3px"}">${ready?"✓ "+t("readyWord"):"◷ "+t("buildingWord")}</span></div></div>`;
    const view=document.createElement("button"); view.className="del"; view.textContent="📊";
    view.onclick=()=>{ statRoute=r.route_code; showRouteStats(); };
    const del=document.createElement("button"); del.className="del"; del.textContent="✕";
    del.onclick=async()=>{
      del.disabled=true; del.textContent="…";
      try{
        const res=await fetch(base()+"/track/remove",{method:"POST",cache:"no-store",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({route_code:r.route_code})});
        if(!res.ok){ let j={}; try{ j=await res.json(); }catch(_){}
          del.textContent="!"; del.title=j.error||("HTTP "+res.status); del.disabled=false; return; }
        renderStats();
      }catch(e){ del.textContent="!"; del.title=String((e&&e.message)||e); del.disabled=false; }
    };
    d.appendChild(view); d.appendChild(del); body.appendChild(d);
  });

  // add a line from the stops currently loaded
  const stops=state.stops.slice(0,CONFIG.listStops).filter(s=>s.routes&&s.routes.length);
  if(stops.length){
    const wrap=document.createElement("div");
    wrap.innerHTML=`<div class="field"><label>${t("addTrack")}</label>
      <select id="tk-route">${stops.flatMap(s=>(s.routes||[]).map(r=>
        `<option value="${esc(r.code)}" data-line="${esc(r.id)}" data-descr="${esc((LANG==="en"?(r.en||r.el):(r.el||r.en))||"")}">${esc(r.id)} · ${esc(destOf((LANG==="en"?(r.en||r.el):(r.el||r.en))||""))}</option>`)).join("")}
      </select></div>`;
    const msg=document.createElement("div"); msg.className="note"; msg.style.display="none";
    const add=document.createElement("button"); add.className="primary"; add.textContent=t("addTrack");
    const fail=txt=>{ msg.style.display=""; msg.textContent=txt;
      add.disabled=false; add.textContent=t("addTrack"); };
    add.onclick=async()=>{
      const sel=wrap.querySelector("#tk-route");
      const o=sel&&sel.selectedOptions&&sel.selectedOptions[0];
      if(!sel||!sel.value){ fail("no line selected"); return; }
      add.disabled=true; add.textContent="…"; msg.style.display="none";
      try{
        const r=await fetch(base()+"/track/add",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ route_code:sel.value,
            line_id:(o&&o.dataset.line)||"", line_code:(o&&o.dataset.line)||"",
            descr:(o&&o.dataset.descr)||"" })});
        let j={}; try{ j=await r.json(); }catch(_){}
        if(!r.ok){ fail(`${j.error||"HTTP "+r.status}${j.max?" ("+j.max+" max)":""}`); return; }
        renderStats();
      }catch(e){ fail(String((e&&e.message)||e)); }
    };
    body.appendChild(wrap); body.appendChild(add); body.appendChild(msg);
  }
}

function relTime(sec){
  if(!isFinite(sec)||sec<0) return "";
  if(sec<90) return t("justNow");
  if(sec<3600) return `${Math.round(sec/60)}${t("minShort")} ${t("agoWord")}`;
  if(sec<86400) return `${Math.round(sec/3600)}${t("hourShort")} ${t("agoWord")}`;
  return `${Math.round(sec/86400)}${t("dayShort")} ${t("agoWord")}`;
}
function kpi(label,value,cls){ return `<div class="${cls||""}"><b>${value}</b><span>${label}</span></div>`; }
async function showRouteStats(){
  const body=$("#st-body");
  body.innerHTML=`<div class="note">${t("searching")}</div>`;
  try{
    const [s,bunch,miss]=await Promise.all([
      fetch(`${base()}/stats?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),
      fetch(`${base()}/stats/bunching?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),
      fetch(`${base()}/stats/missing?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),
    ]);
    if(!s||!s.enough){
      body.innerHTML=`<div class="note">${t("collecting")}<br>${(s&&s.total)||0} ${t("events")}</div>
        <button class="ghost" id="st-back">←</button>`;
      $("#st-back").onclick=renderStats; return;
    }
    const regCls=s.regularity>=75?"ok":s.regularity>=50?"warn":"bad";  // ok / marked / boxed
    const bunchCls=s.bunchRate<=5?"ok":s.bunchRate<=15?"warn":"bad";
    const missCls=s.missingRate<=5?"ok":s.missingRate<=15?"warn":"bad";
    const maxH=Math.max(1,...(s.hourly||[]).map(h=>h.n));
    const bars=Array.from({length:24},(_,h)=>{
      const f=(s.hourly||[]).find(x=>x.h===h);
      const v=f?f.n:0; const pct=Math.round(v/maxH*100);
      return `<i class="${pct>66?"hi":""}" style="height:${Math.max(2,pct)}%" title="${h}:00 — ${v}"></i>`;
    }).join("");

    body.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div class="tile num" style="height:28px;min-width:44px;font-size:13px">${esc((s.route&&s.route.line_id)||statRoute)}</div>
        <div style="color:var(--muted);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${esc(destOf((s.route&&s.route.descr)||"")||"")}</div>
        <button class="chip${statDays===7?" on":""}" id="d7">${t("last7")}</button>
        <button class="chip${statDays===30?" on":""}" id="d30">${t("last30")}</button>
      </div>
      <div class="kpi">
        ${kpi(t("waitReal"), s.expectedWait+"′")}
        ${kpi(t("headway"), s.typicalGap+"′")}
        ${kpi(t("regular"), s.regularity+"%", regCls)}
        ${kpi(t("bunching"), s.bunchRate+"%", bunchCls)}
        ${kpi(t("missingSvc"), s.missingRate+"%", missCls)}
        ${kpi(t("worst"), s.worstGap+"′")}
      </div>
      <div class="note">${s.total} ${t("events")} · ${s.vehicles} ${t("vehicles").toLowerCase()}</div>
      <div class="sec-label">${t("byHour")}</div>
      <div class="hrs">${bars}</div>
      <div class="hrlab"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
      <div class="sec-label">${t("bunching")} · ${t("incidents")}</div>
      ${bunch&&bunch.length?bunch.slice(0,6).map(b=>
        `<div class="inc"><b>${Math.round(b.gapSec/60*10)/10}′</b> ${t("bunching").toLowerCase()} · ${new Date(b.at*1000).toLocaleString()}</div>`).join("")
        :`<div class="inc">${t("noneYet")}</div>`}
      <div class="sec-label">${t("missingSvc")}</div>
      ${miss&&miss.length?miss.slice(0,6).map(g=>
        `<div class="inc"><b>${g.minutes}′</b> (${t("headway").toLowerCase()} ~${g.typical}′) · ${new Date(g.from*1000).toLocaleString()}</div>`).join("")
        :`<div class="inc">${t("noneYet")}</div>`}
      <button class="ghost" id="st-back">←</button>`;
    $("#d7").onclick=()=>{ statDays=7; showRouteStats(); };
    $("#d30").onclick=()=>{ statDays=30; showRouteStats(); };
    $("#st-back").onclick=renderStats;
  }catch(e){ body.innerHTML=`<div class="note">${t("err")}</div>`; }
}

/* ============================ alerts =============================== */
function u8(b64){ const p="=".repeat((4-b64.length%4)%4);
  const s=(b64+p).replace(/-/g,"+").replace(/_/g,"/"); const raw=atob(s);
  const a=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i); return a; }
async function ensurePush(){
  if(!hasBackend()) throw new Error("nobackend");
  if(!("serviceWorker" in navigator)||!("PushManager" in window)) throw new Error("unsupported");
  const kr=await fetch(base()+"/push/key"); if(!kr.ok) throw new Error("notconfigured");
  const {key}=await kr.json();
  let perm=Notification.permission;
  if(perm==="default") perm=await Notification.requestPermission();
  if(perm!=="granted") throw new Error("denied");
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)});
  const id=localStorage.getItem("subId")||null;
  const r=await fetch(base()+"/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,subscription:sub.toJSON()})});
  const j=await r.json(); localStorage.setItem("subId",j.id); state.subId=j.id; return j.id;
}
async function loadRules(){
  if(!hasBackend()||!state.subId){ state.rules=[]; return; }
  try{ const r=await fetch(`${base()}/rules?sub=${encodeURIComponent(state.subId)}`);
    state.rules=r.ok?await r.json():[]; }catch{ state.rules=[]; }
}
function bellBadge(){
  const n=state.rules.filter(r=>r.enabled!==false).length;
  const b=$("#bellcount"); b.textContent=n; b.style.display=n?"grid":"none";
}
function openAlerts(){ $("#alertbg").classList.add("on"); renderAlerts(); }
function closeAlerts(){ $("#alertbg").classList.remove("on"); }
function renderAlerts(){
  const list=$("#rulelist"),form=$("#ruleform"); list.innerHTML=""; form.innerHTML="";
  if(!hasBackend()){ list.innerHTML=`<div class="note">${t("pushOff")}</div>`; return; }
  if(!state.rules.length) list.innerHTML=`<div class="note">${t("noRules")}</div>`;
  state.rules.forEach(r=>{
    const d=document.createElement("div"); d.className="rule";
    const days=(r.days||[]).map(i=>t("dayNames")[i]).join(" ");
    d.innerHTML=`<div class="info"><div class="ln">${esc(r.lineId||"")} · ${esc(r.stopName||"")}</div>
      <div class="dt">${esc(r.routeName||"")}<br>${days} · ${esc(r.from)}–${esc(r.to)} · ${(r.leads||[]).join("′, ")}′</div></div>`;
    const del=document.createElement("button"); del.className="del"; del.textContent="✕";
    del.onclick=async()=>{ await fetch(base()+"/rules/delete",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:r.id,sub:state.subId})});   // sub = ownership proof
      await loadRules(); bellBadge(); renderAlerts(); };
    d.appendChild(del); list.appendChild(d);
  });
  const add=document.createElement("button"); add.className="primary"; add.textContent=t("newAlert");
  add.onclick=()=>renderForm(); form.appendChild(add);
  const test=document.createElement("button"); test.className="ghost"; test.textContent=t("test");
  test.onclick=async()=>{
    try{ const id=await ensurePush();
      const r=await fetch(base()+"/push/test",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({sub:id})});
      test.textContent=r.ok?"✓":t("err"); setTimeout(()=>test.textContent=t("test"),2500);
    }catch(e){ test.textContent=e.message==="denied"?t("pushDenied"):t("pushOff");
      setTimeout(()=>test.textContent=t("test"),3000); }
  };
  form.appendChild(test);
}
function renderForm(){
  const form=$("#ruleform"); form.innerHTML="";
  const stops=state.stops.slice(0,CONFIG.listStops);
  if(!stops.length){ form.innerHTML=`<div class="note">${t("needStops")}</div>`; return; }
  const wrap=document.createElement("div");
  wrap.innerHTML=`
    <div class="field"><label>${t("stop")}</label><select id="f-stop">
      ${stops.map((s,i)=>`<option value="${i}">${esc(stopName(s))}</option>`).join("")}</select></div>
    <div class="field"><label>${t("line")}</label><select id="f-route"></select></div>
    <div class="field"><label>${t("days")}</label><div class="chips" id="f-days"></div></div>
    <div class="field two"><div><label>${t("from")}</label><input type="time" id="f-from" value="08:30"></div>
      <div><label>${t("till")}</label><input type="time" id="f-to" value="08:50"></div></div>
    <div class="field"><label>${t("lead")}</label><div class="chips" id="f-leads"></div></div>`;
  form.appendChild(wrap);
  const sel=new Set([1,2,3,4,5]),db=wrap.querySelector("#f-days");
  [1,2,3,4,5,6,0].forEach(i=>{ const c=document.createElement("button");
    c.className="chip"+(sel.has(i)?" on":""); c.textContent=t("dayNames")[i];
    c.onclick=()=>{ sel.has(i)?sel.delete(i):sel.add(i); c.classList.toggle("on"); }; db.appendChild(c); });
  const leads=new Set([10,5]),lb=wrap.querySelector("#f-leads");
  [15,10,5,3].forEach(L=>{ const c=document.createElement("button");
    c.className="chip"+(leads.has(L)?" on":""); c.textContent=L+"′";
    c.onclick=()=>{ leads.has(L)?leads.delete(L):leads.add(L); c.classList.toggle("on"); }; lb.appendChild(c); });
  const rs=wrap.querySelector("#f-route");
  function fill(){ const s=stops[+wrap.querySelector("#f-stop").value];
    rs.innerHTML=(s.routes||[]).map(r=>{ const d=LANG==="en"?(r.en||r.el):(r.el||r.en);
      return `<option value="${esc(r.code)}">${esc(r.id)} · ${esc(d||"")}</option>`; }).join("")||`<option value="">—</option>`; }
  wrap.querySelector("#f-stop").onchange=fill; fill();
  const save=document.createElement("button"); save.className="primary"; save.textContent=t("save");
  save.onclick=async()=>{
    save.disabled=true;
    try{
      const id=await ensurePush();
      const s=stops[+wrap.querySelector("#f-stop").value];
      const rc=wrap.querySelector("#f-route").value;
      const route=(s.routes||[]).find(r=>r.code===rc)||{};
      const rule={sub:id,stopCode:s.code,stopName:stopName(s),lineId:route.id||"",routeCodes:[rc],
        routeName:(LANG==="en"?(route.en||route.el):(route.el||route.en))||"",
        days:[...sel].sort(),from:wrap.querySelector("#f-from").value,to:wrap.querySelector("#f-to").value,
        leads:[...leads].sort((a,b)=>b-a),enabled:true};
      const r=await fetch(base()+"/rules",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(rule)});
      if(!r.ok) throw new Error("save");
      await loadRules(); bellBadge(); renderAlerts();
    }catch(e){ const n=document.createElement("div"); n.className="note";
      n.textContent=e.message==="denied"?t("pushDenied"):t("pushOff"); form.appendChild(n); save.disabled=false; }
  };
  form.appendChild(save);
  const cancel=document.createElement("button"); cancel.className="ghost"; cancel.textContent=t("cancel");
  cancel.onclick=renderAlerts; form.appendChild(cancel);
}
