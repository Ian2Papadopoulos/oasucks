 * the shared list, but it only probes a few unknown stops per request —
 * so when the client is the one that discovers a dead stop (by opening
 * its popup) it must (a) remember it locally, or the next /nearby brings
 * it straight back, and (b) tell the server, which re-verifies with OASA
 * before recording it for everyone. */
const DEAD_KEY="deadStops";
let deadStops=new Set();
try{ const v=JSON.parse(localStorage.getItem(DEAD_KEY)||"[]");
  if(Array.isArray(v)) deadStops=new Set(v.map(String)); }catch(_){}
function markStopDead(code){
  code=String(code); if(!code||deadStops.has(code)) return;
  deadStops.add(code);
  // keep the local list from growing without bound
  if(deadStops.size>400) deadStops=new Set([...deadStops].slice(-300));
  try{ localStorage.setItem(DEAD_KEY,JSON.stringify([...deadStops])); }catch(_){}
  if(hasBackend()) fetch(base()+"/stops/dead",{method:"POST",cache:"no-store",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({code})})
    .catch(()=>{});
}
function notDead(list){ return (list||[]).filter(s=>!deadStops.has(String(s.code))); }

function mapStop(s){
  const lat=Number(pick(s,"StopLat","StopY","stop_lat"));
  const lng=Number(pick(s,"StopLng","StopX","stop_lng"));
  const dist=(isFinite(lat)&&isFinite(lng))?haversine(here.lat,here.lng,lat,lng):Infinity;
  return { code:String(pick(s,"StopCode","StopID","stop_code")||""),
    name_el:pick(s,"StopDescr","StopDescrEng")||"", name_en:pick(s,"StopDescrEng","StopDescr")||"",
    street:pick(s,"StopStreet","StopStreetEng")||"", lat,lng,dist,
    lines:[],routes:[],routeMap:{},arrivals:[],routesLoaded:false,arrLoaded:false };
}
async function loadRoutes(s){
  const routes=await oasa("webRoutesForStop",s.code);
  const rm={},seen=new Set(),lines=[],all=[];
  (Array.isArray(routes)?routes:[]).forEach(r=>{
    const rc=pick(r,"RouteCode","route_code"); if(rc==null) return;
    const id=pick(r,"LineID","line_id","LineCode","line_code");
    const el=pick(r,"RouteDescr","route_descr","LineDescr","line_descr");
    const en=pick(r,"RouteDescrEng","route_descr_eng","LineDescrEng","line_descr_eng");
    rm[String(rc)]={line:id,el,en};
    all.push({code:String(rc),id:String(id||rc),el,en});
    const key=String(id||rc);
    if(id&&!seen.has(key)){ seen.add(key); lines.push({id:String(id),el,en}); }
  });
  s.routeMap=rm; s.routes=all;
  s.lines=lines.sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  s.routesLoaded=true;
}
async function loadArrivals(s){
  const arr=await oasa("getStopArrivals",s.code);
  s.arrivals=(Array.isArray(arr)?arr:[])
    .map(a=>({code:String(pick(a,"route_code","RouteCode")||""),
      veh:String(pick(a,"veh_code","VEH_NO","VEH_CODE")||""),
      min:parseInt(pick(a,"btime2","btime","stop_time")||"999",10)}))
    .filter(a=>isFinite(a.min)).sort((x,y)=>x.min-y.min);
  s.arrLoaded=true;
}

/* One request instead of ~9: the Worker fans out to OASA for us. */
async function loadStopsBatch(){
  const u=`${base()}/nearby?lat=${here.lat}&lng=${here.lng}&radius=${state.radius}`
        +`&limit=${CONFIG.listPool}&markers=${CONFIG.maxMarkers}`;
  const r=await fetch(u,{cache:"no-store"});
  if(!r.ok) throw new Error("nearby "+r.status);
  const j=await r.json();
  if(Array.isArray(j.reports)){ state.reports=j.reports; repBadge(); }
  const prev={}; state.stops.forEach(s=>prev[s.code]=s);
  state.stops=notDead(j.stops).filter(s=>!(s.routes&&s.routes.length===0&&s.lines&&s.lines.length===0&&s.detail)).map(s=>{
    const p=prev[s.code]||{};
    const routes=(s.routes&&s.routes.length)?s.routes:(p.routes||[]);
    const rm={}; routes.forEach(r=>{ rm[r.code]={line:r.id,el:r.el,en:r.en}; });
    return {
      code:String(s.code), name_el:s.name_el||"", name_en:s.name_en||"", street:s.street||"",
      lat:Number(s.lat), lng:Number(s.lng), dist:Number(s.dist),
      lines:(s.lines&&s.lines.length)?s.lines:(p.lines||[]),
      routes, routeMap:rm,
      arrivals: s.detail ? (s.arrivals||[]).map(a=>({code:String(a.code||""),veh:String(a.veh||""),min:a.min}))
        : (p.arrivals||[]),
      routesLoaded: routes.length>0,
      arrLoaded: !!s.detail || !!p.arrLoaded
    };
  });
  state._mapCodes=null;
  markLoaded();
  updateRadiusLabel(); renderView();
  warmMap();
  loadFarFavs();
  fillVisibleArrivals();
}

/* The guarantee behind the cap: whatever the list is about to SHOW, it
   shows with arrivals. The server loads the closest CONFIG.listStops, so
   normally there is nothing left to do; this only fires for a stop the
   list surfaces that the batch didn't cover (a far favourite reordering
   the window, or the server trimming under its subrequest budget). It is
   bounded by the cap, so at most a handful of requests, and it means a
   row can never sit on the grey loading bars forever. Favourites are left
   to loadFarFavs so we don't fetch the same stop twice. */
async function fillVisibleArrivals(){
  const need=listStops().filter(s=>s&&!s.arrLoaded&&!isFav(s.code));
  if(!need.length) return;
  await withLimit(need.map(s=>async()=>{
    try{ if(!s.routesLoaded) await loadRoutes(s); await loadArrivals(s); }catch(_){}
  }),4);
  if(state.view==="list") renderView();
}

async function loadStops(){
  if(loading) return; loading=true;
  try{
    await ensureMode();
    if(hasBackend()){ await loadStopsBatch(); loading=false; return; }
    await loadStopsLegacy();
  }catch(e){
    if(state.view==="list")
      $("#list").innerHTML=`<div class="msg"><b>${esc(navigator.onLine===false?t("offline"):t("err"))}</b><br><button onclick="startRefresh()">${t("retry")}</button></div>`;
  }
  loading=false;
}

/* Fallback path (no backend — e.g. opened as a local file via CORS proxies). */
async function loadStopsLegacy(){
    const pts=samplePoints(here.lat,here.lng,state.radius);
    const res=await Promise.all(pts.map(p=>oasa("getClosestStops",p[0],p[1]).catch(()=>null)));
    const byCode={};
    res.forEach(arr=>{ if(Array.isArray(arr)) arr.forEach(s=>{
      const c=String(pick(s,"StopCode","StopID","stop_code")||""); if(c&&!byCode[c]) byCode[c]=s; }); });
    const prev={}; state.stops.forEach(s=>prev[s.code]=s);
    let stops=notDead(Object.values(byCode).map(mapStop))
      .filter(s=>isFinite(s.dist)&&s.dist<=state.radius)
      .sort((a,b)=>a.dist-b.dist).slice(0,CONFIG.maxMarkers);
    stops.forEach(s=>{ const p=prev[s.code]; if(p){
      s.lines=p.lines; s.routes=p.routes; s.routeMap=p.routeMap; s.routesLoaded=p.routesLoaded;
      s.arrivals=p.arrivals; s.arrLoaded=p.arrLoaded; } });
    state.stops=stops; state._mapCodes=null;
    markLoaded();
    updateRadiusLabel(); renderView();
    warmMap();

    await withLimit(state.stops.filter(s=>!s.routesLoaded).map(s=>()=>loadRoutes(s)),6);
    renderView();

    const need=state.stops.slice(0,CONFIG.listStops).slice();
    state.stops.forEach(s=>{ const m=mapMarkers[s.code];
      if(m&&m.isPopupOpen&&m.isPopupOpen()&&!need.includes(s)) need.push(s); });
    await withLimit(need.map(s=>()=>loadArrivals(s)),4);
    renderView(); updateRadiusLabel();
    loadFarFavs();
}

/* Polling pauses when the tab is hidden — a forgotten tab used to keep
   refreshing all night for nobody. Coming back refreshes immediately. */
let paused=false, lastTouch=Date.now(), sleeping=false;

/* Polling is tiered, because an open tab that nobody is looking at used to
   refresh forever:
     active   — every 30s
     idle     — after 4 min without interaction, every 45s
     asleep   — after 15 min, stop entirely and wait for a tap
     hidden   — stop immediately (tab backgrounded / phone locked) */
function stopTimers(){ clearInterval(timer); timer=null; }
/* When the numbers were last refreshed. The old two-pixel bar animated a
   width every 250 ms forever, which is a repaint per tick on every device
   for information nobody reads mid-sweep. One line of text, updated every
   20 s, says the same thing and costs nothing. */
let lastLoad=0;
function markLoaded(){ lastLoad=Date.now(); paintFresh(); }
function paintFresh(){
  const el=$("#fresh"); if(!el) return;
  if(!lastLoad){ if(el.textContent){ el.textContent=""; el.classList.remove("stale"); } return; }
  const secs=Math.round((Date.now()-lastLoad)/1000);
  const txt=secs<15?t("freshNow"):t("freshAgo")(secs<90?`${secs}${t("secShort")}`
    :`${Math.round(secs/60)}${t("minShort")}`);
  // called four times a second, so never write what is already there
  if(el.textContent!==txt) el.textContent=txt;
  el.classList.toggle("stale",secs>150);
}
function currentInterval(){
  return (Date.now()-lastTouch > CONFIG.idleAfter) ? CONFIG.idleMs : CONFIG.refreshMs;
}
function showSleep(){
  sleeping=true; stopTimers();
  const b=$("#wake"); if(b) b.classList.add("on");
}
function wake(){
  const b=$("#wake"); if(b) b.classList.remove("on");
  sleeping=false; lastTouch=Date.now(); startRefresh();
}
/* Why a 250 ms tick drives a 30 s refresh.
 *
 * A bare setInterval(loadStops, 30000) is wrong in two ways on a phone.
 * Browsers throttle long timers on a page that looks idle, and a plain
 * interval has no memory: if a tick is deferred you do not get it late,
 * you get it a whole period later. Between the two, arrivals were landing
 * a minute or more behind the sign at the stop, and a bus that had already
 * gone kept its row until the sweep that never came.
 *
 * So the deadline is the state and the tick only asks whether it has
 * passed. Late ticks self-correct instead of compounding, and the tier
 * (active / idle) is re-read at each refresh rather than frozen when the
 * timer was created. This is the cadence the progress bar used to run on;
 * the bar is what was wasteful, not the tick, since it wrote a style four
 * times a second. Comparing two numbers costs nothing. */
const TICK_MS=250;
function startRefresh(){
  stopTimers();
  if(document.hidden){ paused=true; return; }
  paused=false; sleeping=false;
  const b=$("#wake"); if(b) b.classList.remove("on");
  loadStops();
  nextAt=Date.now()+currentInterval();
  timer=setInterval(tick,TICK_MS);
}
function tick(){
  const now=Date.now();
  if(now-lastTouch > CONFIG.sleepAfter) return showSleep();
  if(now>=nextAt){ nextAt=now+currentInterval(); loadStops(); }
  paintFresh();
}
function touched(){
  const wasIdle = Date.now()-lastTouch > CONFIG.idleAfter;
  lastTouch=Date.now();
  if(sleeping) return;                 // needs an explicit tap on the wake button
  if(wasIdle && !document.hidden) startRefresh();
}
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>
  window.addEventListener(ev,touched,{passive:true}));
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ stopTimers(); paused=true; }
  else { lastTouch=Date.now();
    if(sleeping) return;
    if(paused){ paused=false; startRefresh(); } }
});

/* ------------------------- location flow --------------------------- */
function openSheet(){ $("#sheetbg").classList.add("on"); }
function closeSheet(){ $("#sheetbg").classList.remove("on"); }
function setLocation(lat,lng,label,gps,fromSheet){
  here={lat,lng,label,gps}; state.mapFitted=false; state._mapCodes=null; state.stops=[];
  if(fromSheet) closeSheet();
  applyStatics(); startRefresh();
}
/* One tap, not three. The old flow fired getCurrentPosition with an 8s
   timeout at boot; if you hadn't answered the browser's permission
   prompt within 8s the call "failed", the sheet opened, and you had to
   tap 📍 to start over. Now: ask the Permissions API first — already
   denied goes straight to the sheet (no doomed call), already granted
   gets a normal timeout, and a pending prompt gets 45s so the dialog
   can't outlive the timer. The last good fix is cached so the next
   launch shows your area instantly while a fresh fix arrives. */
function rememberPos(p){
  try{ localStorage.setItem("lastPos",JSON.stringify({
    lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()})); }catch(_){}
}
function useGPS(){
  $("#locwhere").textContent=t("locating");
  if(!navigator.geolocation){ openSheet(); return; }
  const go=timeout=>navigator.geolocation.getCurrentPosition(
    p=>{ rememberPos(p); setLocation(p.coords.latitude,p.coords.longitude,t("you"),true,true); },
    err=>{
      if(err&&err.code===1){ $("#s-p").textContent=t("denied"); openSheet(); }
      else if(!here.gps) openSheet();          // no fix and no cached one — ask
      $("#locwhere").textContent=here.label||PRESETS[0].el;
    },
    {enableHighAccuracy:true,timeout,maximumAge:30000});
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:"geolocation"}).then(st=>{
      if(st.state==="denied"){ $("#s-p").textContent=t("denied"); openSheet();
        $("#locwhere").textContent=here.label||PRESETS[0].el; return; }
      go(st.state==="granted"?12000:45000);
    }).catch(()=>go(25000));
  } else go(25000);
}
async function doSearch(){
  const q=$("#addr").value.trim(); if(!q) return;
  const box=$("#results"); box.innerHTML=`<div class="res-msg">${t("searching")}</div>`;
  try{
    const items=await geocode(q);
    if(!items.length){
      box.innerHTML=`<div class="res-msg">${esc(emptyMsg(false,"noResults"))}</div>`; return; }
    box.innerHTML="";
    items.forEach(it=>{ const b=document.createElement("button"); b.className="res";
      b.textContent=it.display_name;
      b.onclick=()=>setLocation(Number(it.lat),Number(it.lon),placeLabel(it)||t("you"),false,true);
      box.appendChild(b); });
  }catch(_){ box.innerHTML=`<div class="res-msg">${esc(emptyMsg(true,"err"))}</div>`; }
}

/* ---------------------- full-screen map picker --------------------- */
let pmap=null,pickLabel="",revTimer=null;
function openPicker(){
  $("#picker").classList.add("on");
  if(!pmap){
    pmap=L.map("pickmapEl",{zoomControl:false,attributionControl:false}).setView([here.lat,here.lng],16);
    L.tileLayer(tileUrl(),{subdomains:"abcd",maxZoom:20,detectRetina:true}).addTo(pmap);
    pmap.on("moveend",()=>{ clearTimeout(revTimer); revTimer=setTimeout(updatePickLabel,400); });
  } else pmap.setView([here.lat,here.lng],16);
  setTimeout(()=>{ pmap.invalidateSize(); updatePickLabel(); },80);
}
function closePicker(){ $("#picker").classList.remove("on"); }
let pickShort="";
async function updatePickLabel(){
  const c=pmap.getCenter(); $("#picklabel").textContent=t("searching");
  const coords=`${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`;
  try{
    const r=await reverse(c.lat,c.lng);
    pickLabel=r.full||coords; pickShort=r.short||coords;
  }catch{ pickLabel=coords; pickShort=coords; }
  $("#picklabel").textContent=pickLabel;
}

/* ==================== route preview (long-press list) ============== */
let rmap=null,rlayer=null;
function polyOf(pts){
  return (Array.isArray(pts)?pts:[]).slice()
    .sort((a,b)=>Number(a.routed_order||0)-Number(b.routed_order||0))
    .map(p=>[Number(p.routed_y),Number(p.routed_x)])
    .filter(p=>isFinite(p[0])&&isFinite(p[1]));
}
function nearestIdx(pl,pt){ let bi=0,bd=Infinity;
  for(let i=0;i<pl.length;i++){ const d=(pl[i][0]-pt[0])**2+(pl[i][1]-pt[1])**2; if(d<bd){bd=d;bi=i;} }
  return bi; }

/* Route preview. Opened two ways, and the only difference is whether we
   have a boarding stop: from the arrivals list we do (highlight the bit
   of the journey ahead of you), from the line search we don't (show the
   whole route end to end). `meta` carries the line labels in that second
   case, since there is no stop.routeMap to read them from. */
async function openRoutePreview(stop,routeCode,minutes,meta){
  const info=stop?(stop.routeMap[routeCode]||{}):(meta||{});
  $("#rp").classList.add("on");
  $("#rp-tile").textContent=info.line||routeCode;
  $("#rp-title").textContent=destOf(LANG==="en"?(info.en||info.el):(info.el||info.en))||"";
  $("#rp-sub").textContent=stop
    ? `${stopName(stop)} · ${minutes<=1?t("now"):minutes+"′"}`
    : t("wholeRoute");
  $("#rp-strip").innerHTML=`<div class="res-msg" style="color:var(--muted);font-size:13px;padding:8px 2px">${t("searching")}</div>`;
  if(!rmap){
    rmap=L.map("rpmap",{zoomControl:true});
    L.tileLayer(tileUrl(),{subdomains:"abcd",maxZoom:20,detectRetina:true,attribution:TILE_ATTR}).addTo(rmap);
    rlayer=L.layerGroup().addTo(rmap);
    rmap.setView([here.lat,here.lng],14);
  } else rlayer.clearLayers();
  setTimeout(()=>rmap.invalidateSize(),70);

  const [pts,rstops,buses]=await Promise.all([
    oasa("webRouteDetails",routeCode).catch(()=>null),
    oasa("webGetStops",routeCode).catch(()=>null),
    oasa("getBusLocation",routeCode).catch(()=>null)]);

  const pl=polyOf(pts);
  const list=(Array.isArray(rstops)?rstops:[]).map(x=>({
    code:String(pick(x,"StopCode","StopID","stop_code")||""),
    name:(LANG==="en"?(clean(pick(x,"StopDescrEng","StopDescr"))||clean(pick(x,"StopDescr")))
                     :(clean(pick(x,"StopDescr","StopDescrEng"))))||"",
    lat:Number(pick(x,"StopLat","StopY","stop_lat")),
    lng:Number(pick(x,"StopLng","StopX","stop_lng"))
  })).filter(x=>isFinite(x.lat)&&isFinite(x.lng));

  let idx=-1;
  if(stop){
    idx=list.findIndex(x=>x.code===String(stop.code));
    if(idx<0&&list.length) idx=nearestIdx(list.map(x=>[x.lat,x.lng]),[stop.lat,stop.lng]);
  }
  const onward = idx>=0 ? list.slice(idx,idx+CONFIG.onward+1) : [];
  let ahead=[];                                  // the highlighted stretch, for the fit below

  // with a boarding stop: full route faint, the journey ahead bright.
  // without one: the whole line is the subject, so draw it all bright.
  if(pl.length){
    if(!stop){
      L.polyline(pl,{color:"#FFFFFF",weight:9,opacity:.95}).addTo(rlayer);
      L.polyline(pl,{color:"#17171A",weight:4.5,className:"flashline"}).addTo(rlayer);
      L.polyline(pl,{color:"#FFE24A",weight:2.5,opacity:1,className:"marchline"}).addTo(rlayer);
    } else {
      // The stretch behind you is context, so it stays flat grey. Everything
      // from this stop to the terminus is the journey you are about to make,
      // and gets the same live snake the map draws: white casing, pulsing
      // dark core, dashes marching the way the bus goes.
      L.polyline(pl,{color:"#B4B4AE",weight:3,opacity:.9}).addTo(rlayer);
      const from=idx>=0?list[idx]:(isFinite(stop.lat)?stop:null);
      const i0=from?nearestIdx(pl,[from.lat,from.lng]):-1;
      ahead=i0>=0?pl.slice(i0):[];
      if(ahead.length>1){
        L.polyline(ahead,{color:"#FFFFFF",weight:9,opacity:.95}).addTo(rlayer);
        L.polyline(ahead,{color:"#17171A",weight:4.5,className:"flashline"}).addTo(rlayer);
        L.polyline(ahead,{color:"#FFE24A",weight:2.5,opacity:1,className:"marchline"}).addTo(rlayer);
        L.marker(ahead[ahead.length-1],{icon:L.divIcon({className:"",
          html:`<div class="endm">${esc(destOf(LANG==="en"?(info.en||info.el):(info.el||info.en))||"▸")}</div>`,
          iconSize:[0,0],iconAnchor:[0,10]}),zIndexOffset:800}).addTo(rlayer);
      }
    }
  }
  // every stop on the route as a dot, so the plain stretches aren't blank
  list.forEach((x,i)=>{
    if(idx>=0 && i>=idx && i<=idx+CONFIG.onward) return;   // those get numbered markers below
    if(!stop){
      L.marker([x.lat,x.lng],{icon:L.divIcon({className:"",html:'<div class="nstop"></div>',
        iconSize:[11,11],iconAnchor:[5.5,5.5]})}).addTo(rlayer)
        .bindTooltip(`${i+1}. ${esc(x.name)}`,{direction:"top"});
      return;
    }
    L.circleMarker([x.lat,x.lng],{radius:2.5,color:"#5A6B8C",weight:1,
      fillColor:"#8A97AD",fillOpacity:.85}).addTo(rlayer).bindTooltip(esc(x.name),{direction:"top"});
  });
  onward.forEach((x,i)=>{
    if(i===0) return;
    L.marker([x.lat,x.lng],{icon:L.divIcon({className:"",html:'<div class="nstop"></div>',
      iconSize:[11,11],iconAnchor:[5.5,5.5]})}).addTo(rlayer).bindTooltip(`${i}. ${esc(x.name)}`,{direction:"top"});
  });
  if(stop&&isFinite(stop.lat)) L.marker([stop.lat,stop.lng],{icon:L.divIcon({className:"",
    html:'<div class="board"></div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:600})
    .addTo(rlayer).bindTooltip(esc(stopName(stop)),{direction:"top",permanent:false});
  L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:700}).addTo(rlayer);
  (Array.isArray(buses)?buses:[]).forEach(b=>{
    const la=Number(pick(b,"CS_LAT","cs_lat")),ln=Number(pick(b,"CS_LNG","cs_lng"));
    if(isFinite(la)&&isFinite(ln)) L.marker([la,ln],{icon:L.divIcon({className:"",
      html:'<div class="busm">🚌</div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:500}).addTo(rlayer);
  });

  // zoom: to the part of the journey that matters, or to the whole line
  const b=L.latLngBounds([]);
  if(stop){
    // fit the highlighted stretch, not just the next few stops: the snake now
    // runs to the terminus, and a highlight that leaves the screen is worse
    // than a slightly wider view.
    (ahead.length?ahead:onward.map(x=>[x.lat,x.lng])).forEach(p=>b.extend(p));
    b.extend([here.lat,here.lng]);
    if(isFinite(stop.lat)) b.extend([stop.lat,stop.lng]);
    if(b.isValid()) rmap.fitBounds(b,{padding:[45,45],maxZoom:15});
  } else {
    (pl.length?pl:list.map(x=>[x.lat,x.lng])).forEach(p=>b.extend(p));
    if(b.isValid()) rmap.fitBounds(b,{padding:[30,30]});
  }

  const strip = stop ? onward : list;
  $("#rp-strip").innerHTML = strip.length
    ? `<div class="sec-label">${stop?t("nextStops"):`${t("allStops")} · ${list.length}`}</div>`
      + strip.map((x,i)=>
        `<div class="ns${stop&&i===0?" first":""}"><div class="n">${stop?(i===0?"▶":i):(i+1)}</div>
          <div class="nm">${esc(x.name||("#"+x.code))}</div></div>`).join("")
    : `<div class="note">${t("noRoute")}</div>`;
}
function closeRP(){ $("#rp").classList.remove("on"); }

/* ================ one route, drawn on the main map =================
 * This used to be a carousel: long-press a stop and every line serving it
 * paraded past on a timer. It looked busy and answered a question nobody
 * had asked — you want ONE line, the one you are waiting for. So the
 * choice moved into the stop's popup, where the lines are already listed,
 * and nothing is drawn until you pick one.
 *
 * The drawing itself is unchanged: the same layered snake (white casing,
 * pulsing dark core, marching yellow dashes), the same destination label
 * at the far end, the same origin dot at the stop, the same fit to the
 * whole line. Only the trigger is different.
 *
 * `seq` guards against a slow route arriving after you picked another. */
const rline={code:null,seq:0,layer:null,saved:null,stop:null,cache:{}};
async function drawRoute(stop,code,info){
  if(!map||!code) return;
  const me=++rline.seq;
  if(!rline.saved) rline.saved={c:map.getCenter(),z:map.getZoom()};
  if(!rline.layer) rline.layer=L.layerGroup().addTo(map);
  rline.code=String(code); rline.stop=stop;

  const label=destOf(LANG==="en"?(info.en||info.el):(info.el||info.en))||"";
  $("#rl-tile").textContent=info.line||code;
  $("#rl-dest").textContent=label;
  $("#rl-from").textContent=stop?t("fromStop")(stopName(stop)):"";
  $("#rl").classList.add("on");

  let pl=rline.cache[code];
  if(!pl){ pl=polyOf(await oasa("webRouteDetails",code).catch(()=>null)); rline.cache[code]=pl; }
  if(rline.seq!==me) return;                 // a newer pick won the race

  rline.layer.clearLayers();
  if(!pl.length){ $("#rl-dest").textContent=t("noRoute"); return; }
  L.polyline(pl,{color:"#FFFFFF",weight:9,opacity:.95}).addTo(rline.layer);
  L.polyline(pl,{color:"#17171A",weight:4.5,className:"flashline"}).addTo(rline.layer);
  L.polyline(pl,{color:"#FFE24A",weight:2.5,opacity:1,className:"marchline"}).addTo(rline.layer);
  L.marker(pl[pl.length-1],{icon:L.divIcon({className:"",html:`<div class="endm">${esc(label||"▸")}</div>`,
    iconSize:[0,0],iconAnchor:[0,10]}),zIndexOffset:800}).addTo(rline.layer);
  if(stop&&isFinite(stop.lat)) L.marker([stop.lat,stop.lng],{icon:L.divIcon({className:"",
    html:'<div class="origin"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:900}).addTo(rline.layer);
  map.fitBounds(L.latLngBounds(pl),{padding:[42,42]});
}
function clearRoute(restore){
  rline.seq++; rline.code=null; rline.stop=null;
  if(rline.layer) rline.layer.clearLayers();
  $("#rl").classList.remove("on");
  if(restore&&rline.saved&&map) map.setView(rline.saved.c,rline.saved.z);
  rline.saved=null;
}


/* ======================== issue reports ========================== *
 * Riders flag what they see. Every flag is red and carries its own label
 * on the map. Colour carries the CATEGORY (red = something is wrong,
 * blue = who is present / what is operationally happening); the type
 * decides how long it lives — staff of any sort ride a bus for a few
 * stops but work a station for hours, and a broken lift outlasts both.
 * Reports clear themselves when they expire; only the person who filed
 * one can remove it early. */
/* What can be reported, per target kind — and which of the two
   CATEGORIES each type belongs to:
     issue (red)  something is wrong with the vehicle or station
     ops   (blue) who is present and what is operationally happening
   Ops entries are factual and staff-agnostic on purpose: "fare
   inspection on this line" is service information, like "no A/C". The
   app reports situations, never people. Mirrored server-side in
   REPORT_TYPES/CATEGORY — keep the two in sync. */
const TYPES_BY_KIND={ bus:["breakdown","crowded","noac","fare","security","staff"],
                      metro:["lift","fare","security","staff"] };
const CATEGORY={ breakdown:"issue",crowded:"issue",noac:"issue",lift:"issue",
                 fare:"ops",security:"ops",staff:"ops" };
/* Records filed before v32 carry the old `inspector` type; map it so
   they render sensibly for the couple of hours until they expire. */
function catOf(ty){ return CATEGORY[ty]||(ty==="inspector"?"ops":"issue"); }
const CAT_ORDER=["issue","ops"];
/* You may only flag the vehicle you are inside, or a station you are
   standing at — these numbers are what "inside" and "at" mean.

   Locality is enforced by the SHORTLIST, not by a verdict: only vehicles
   the server returned within gateM are offered, ranked by plausibility.
   See the long note above findMyBus for why gating on raw distance was
   the bug that made a moving bus impossible to flag. */
const ONBOARD={ metroRadius:600, maxRoutes:20,
  shortlist:10,       // candidates the co-movement pass is allowed to weigh
  gateM:800,          // how far out a candidate may start (matches SCAN.keepM)
  trackMs:8000,       // how long we watch our OWN position before scanning
  trackMin:3,         // fixes that make a track usable
  sampleMs:5500,      // gap between vehicle samples
  samples:3,          // total vehicle samples (1 up front + 2 while refining)
  minMove:20,
  staleS:40,          // assumed worst-case age of an OASA position fix
  maxRadius:900,      // never widen past this, however fast we're going
  moveMs:2,           // m/s above which we treat the rider as "in traffic"
  cosOK:0.75,         // heading agreement for "moving with you"
  paceOK:0.5,         // slower/faster ratio that still counts as the same
  crossMax:80,        // sideways offset that still counts as the same street
  maxStaleS:75,       // most staleness we'll believe when inferring a fix's age
  accMax:150 };       // above this the fix is too vague to reason about at all
/* Every flag is red now. Inspectors and faults differ in how long they
   live (see TTL in worker.js) and in what the label says, not in colour —
   a two-colour scheme just made people decode the palette before reading
   the word that was already there. */
function agoTxt(sec){
  const m=Math.max(0,Math.round(sec/60));
  if(m<1) return t("justNow");
  return `${m}${t("minShort")} ${t("agoShort")}`;
}
function issueLabel(ty){ return t("ti_"+ty)||ty; }
function myId(){
  let id=localStorage.getItem("subId");
  if(!id){ id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
    localStorage.setItem("subId",id); }
  return id;
}
function activeReports(){
  const now=Date.now()/1000;
  return (state.reports||[]).filter(r=>r.expires>now);
}
/* Every report is trusted. What used to be a confirmation tier is now
   just a head count: each reporter files their own record for a target,
   so N records sharing kind+targetId+type means N different people are
   saying the same thing. We collapse them into ONE flag carrying that
   number — otherwise four people reporting the same bus would stack four
   identical pins on top of each other. */
function reportKey(r){ return `${r.kind}|${r.targetId}|${r.type}`; }
function groupedReports(){
  const by=new Map();
  activeReports().forEach(r=>{
    const k=reportKey(r), g=by.get(k);
    if(!g){ by.set(k,{...r,count:1,mineId:r.mine?r.id:null}); return; }
    g.count++;
    g.mine=g.mine||r.mine;
    if(r.mine) g.mineId=r.id;
    // the group speaks with its most recent voice, and its freshest position
    if(r.at>g.at){ g.at=r.at; g.lat=r.lat; g.lng=r.lng; }
    if(r.expires>g.expires) g.expires=r.expires;
  });
  return [...by.values()];
}

/* Which flag, if any, applies to this arrival row? Prefer an exact
   vehicle match, fall back to one filed against the whole line. */
function reportForArrival(a){
  const rs=groupedReports().filter(r=>r.kind==="bus");
  return rs.find(r=>r.veh && a.veh && r.veh===a.veh)
      || rs.find(r=>!r.veh && r.routeCode===a.code)
      || null;
}
function reportForMetro(id){
  return groupedReports().find(r=>r.kind==="metro"&&r.targetId===String(id))||null;
}
function flagLine(r){
  if(!r) return "";
  const ago=agoTxt(Date.now()/1000-r.at);
  const n=r.count>1?` · ${esc(t("nReports")(r.count))}`:"";
  return `<div class="flagline ${catOf(r.type)}">${esc(issueLabel(r.type))}${n} · ${ago}</div>`;
}

let repmap=null, replayer=null;
function openReports(){
  $("#rep").classList.add("on");
  $("#rep-title").textContent=t("reports");
  if(!repmap){
    repmap=L.map("repmap",{zoomControl:true});
    L.tileLayer(tileUrl(),{subdomains:"abcd",maxZoom:20,detectRetina:true,attribution:TILE_ATTR}).addTo(repmap);
    replayer=L.layerGroup().addTo(repmap);
    repmap.setView([here.lat,here.lng],14);
    repmap.on("zoomend",syncFlagLabels);
  }
  setTimeout(()=>repmap.invalidateSize(),70);
  loadMetro();
  drawReportMap(); renderReportList();
  /* /nearby piggy-backs the public list; re-fetch with ?by= so our own
     rows come back marked mine:true and show their ✕ button. */
  refreshReports()
    .then(()=>{ drawReportMap(); if(!reportForm.open) renderReportList(); })
    .then(refreshFlagPositions).then(drawReportMap);
}
function closeReports(){ $("#rep").classList.remove("on"); }

async function loadMetro(){
  if(state.metro&&state.metro.length) return state.metro;
  if(!hasBackend()) return [];
  try{ const r=await fetch(base()+"/metro"); state.metro=r.ok?await r.json():[]; }
  catch{ state.metro=[]; }
  return state.metro;
}
function flagIcon(kind,count,cat){
  // the head count rides on the pin, so a busy flag reads as busy even
  // when its label is hidden at low zoom
  const badge=count>1?`<span class="flag-n">${count>9?"9+":count}</span>`:"";
  return L.divIcon({className:"",
    html:`<div class="flag ${cat} ${kind}">${badge}</div>`,
    iconSize:[17,17],iconAnchor:[8,8],popupAnchor:[0,-10]});
}
/* A flagged bus keeps driving after it was reported, so the pin has to
   follow it. We re-read live positions for the flagged vehicles only —
   a handful of routes, not the whole network. */
async function refreshFlagPositions(){
  const reps=activeReports().filter(r=>r.kind==="bus"&&r.routeCode&&r.veh);
  const codes=[...new Set(reps.map(r=>r.routeCode))].slice(0,8);
  if(!codes.length) return;
  const pos={};
  await withLimit(codes.map(c=>async()=>{
    const buses=await oasa("getBusLocation",c).catch(()=>null);
    (Array.isArray(buses)?buses:[]).forEach(v=>{
      const veh=String(pick(v,"VEH_NO","veh_no","VEH_CODE")||"");
      const la=Number(pick(v,"CS_LAT","cs_lat")), ln=Number(pick(v,"CS_LNG","cs_lng"));
      if(veh&&isFinite(la)&&isFinite(ln)) pos[veh]={lat:la,lng:ln};
    });
  }),4);
  state.busPos=Object.assign(state.busPos||{},pos);
}

/* Zoomed out, a dozen permanent labels overlap into an unreadable pile,
   so below this zoom they're hidden and the pin's count badge carries the
   weight; tap a pin for the popup, which says the same thing. */
const REPMAP={ labelZoom:15 };
function syncFlagLabels(){
  if(!repmap) return;
  const el=repmap.getContainer();
  el.classList.toggle("nolabels", repmap.getZoom()<REPMAP.labelZoom);
}

/* The map is a problem map: only buses and metro stations that carry an
   active flag are drawn. Nothing "ok" appears — if it's on here, it's a
   problem. (Your own dot stays, purely so the pins have a reference.) */
function drawReportMap(){
  if(!repmap) return;
  replayer.clearLayers();
  const b=L.latLngBounds([]);
  L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:900}).addTo(replayer);
  b.extend([here.lat,here.lng]);
  groupedReports().forEach(r=>{
    const live=(r.kind==="bus"&&r.veh&&state.busPos)?state.busPos[r.veh]:null;
    const la=live?live.lat:r.lat, ln=live?live.lng:r.lng;
    if(!isFinite(la)||!isFinite(ln)) return;
    // lineId/targetName come straight from a POST /reports body — untrusted.
    // Leaflet renders tooltip strings as HTML, so escape before interpolating.
    const who=r.kind==="bus"?`🚌 ${esc(r.lineId||"")}`:`Ⓜ ${esc(r.targetName||"")}`;
    const n=r.count>1?` · ${esc(t("nReports")(r.count))}`:"";
    const cat=catOf(r.type);
    const m=L.marker([la,ln],{icon:flagIcon(r.kind,r.count,cat),zIndexOffset:600}).addTo(replayer);
    /* The label sits ON the map above the pin, because the whole point of
       this screen is "what is wrong and where" and a pin you must tap to
       identify answers only half of that. Below REPMAP.labelZoom they are
       hidden — at city scale a dozen of them overlap into noise — and the
       popup carries the same words on tap instead. */
    m.bindTooltip(esc(issueLabel(r.type))+(r.count>1?` ×${r.count}`:""),
      {permanent:true,direction:"top",offset:[0,-9],className:"flaglabel "+cat});
    m.bindPopup(`${who} · ${esc(issueLabel(r.type))}${n} · ${esc(agoTxt(Date.now()/1000-r.at))}`);
    b.extend([la,ln]);
  });
  if(b.isValid()) repmap.fitBounds(b,{padding:[40,40],maxZoom:15});
  syncFlagLabels();
}

function renderReportList(){
  const box=$("#rep-strip");
  // one row per flagged thing, busiest-and-freshest first
  const reps=groupedReports().sort((a,b)=>b.count-a.count||b.at-a.at);
  $("#rep-sub").textContent=`${reps.length} ${t("reports").toLowerCase()}`;
  const items=reps.length?reps.map(r=>{
    const where=r.targetName||r.lineId||"";
    const tags=[agoTxt(Date.now()/1000-r.at)];
    if(r.mine) tags.push(t("mineOnly"));
    // the head count IS the credibility signal now — give it its own chip
    const n=r.count>1?`<span class="rn ${catOf(r.type)}">${esc(t("nReports")(r.count))}</span>`:"";
    const cat=catOf(r.type);
    return `<div class="repitem"><div class="rb ${cat}"></div><div class="ri">
      <div class="rt">${esc(issueLabel(r.type))}${r.lineId?" · "+esc(r.lineId):""}${n}</div>
      <div class="rs">${esc(where)}<br>${esc(tags.join(" · "))}</div>
      </div>${r.mine?`<button class="rx" data-id="${r.mineId}">✕</button>`:""}</div>`;
  }).join(""):`<div class="note">${t("noReports")}</div>`;
  const legend=`<div class="rep-legend">
    <span><i class="issue"></i>${t("legIssue")}</span>
    <span><i class="ops"></i>${t("legOps")}</span></div>`;
  box.innerHTML=`<button class="rep-cta" id="rep-new">${t("reportCta")}</button>${legend}${items}`;
  $("#rep-new").onclick=openReportForm;
  box.querySelectorAll(".rx").forEach(btn=>{
    btn.onclick=async()=>{
      btn.disabled=true;
      try{
        await fetch(base()+"/reports/delete",{method:"POST",cache:"no-store",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({id:btn.dataset.id,by:myId()})});
        await refreshReports(); drawReportMap(); renderReportList(); renderView();
      }catch(_){ btn.disabled=false; }
    };
  });
}

async function refreshReports(){
  if(!hasBackend()) return;
  /* ?by= lets the server mark OUR rows with mine:true without ever
     exposing anyone's reporter token to other clients. */
  try{ const r=await fetch(`${base()}/reports?by=${encodeURIComponent(myId())}`,{cache:"no-store"});
    if(r.ok) state.reports=await r.json(); }catch(_){}
  repBadge();
}
function repBadge(){
  const n=activeReports().length, b=$("#repcount");
  b.textContent=n; b.style.display=n?"grid":"none";
}

/* ---------------- "which bus am I on?" -----------------------------
 * You can only flag the vehicle you are actually inside, so the app has
 * to work out which one that is.
 *
 * WHY THE OLD VERSION FAILED ON A MOVING BUS. It shortlisted vehicles by
 * distance and only then compared velocities. But an OASA fix is 30-60 s
 * old, so a bus doing 8 m/s reports itself 250-450 m behind where it
 * actually is — and the shortlist threw it away before the velocity
 * comparison ever saw it. The error is proportional to speed, so it
 * vanishes the moment the bus stops: hence "it only finds my bus when we
 * pull into a stop". Worse, the slack that was supposed to cover this was
 * scaled by navigator.geolocation's `speed`, which is null on most single
 * fixes — so in practice there was no slack at all.
 *
 * WHAT IT DOES NOW.
 *  0. TRACK YOURSELF FIRST. watchMe() collects several fixes over ~8 s and
 *     fits a velocity to them. Never trust one fix's `speed` field; a
 *     least-squares fit over real displacement always exists.
 *  1. SHORTLIST WIDE. Every live vehicle the server returns (it trims at
 *     1.5 km) ranked by PLAUSIBILITY, not raw distance: sideways offset
 *     from your path costs full price, lag along your own path is nearly
 *     free, because that is exactly what a stale fix looks like from a
 *     seat. Nothing is discarded for being "too far".
 *  2. CO-MOVEMENT decides. Two more samples ~5.5 s apart. If you are on
 *     board, your track and the vehicle's point the same way — and
 *     direction, unlike speed, is completely immune to the feed's timing
 *     being unknown. Those get "moving with you" and float to the top.
 *  3. YOU CONFIRM WITH A TAP. The app ranks and marks the one that moves
 *     with you; it never picks for you, and every pick is trusted.
 * ------------------------------------------------------------------ */
/* Returns {generated, buses[]} — the timestamp matters: the first sample
   may come from the Worker's 10 s cache, so measuring velocity against
   wall-clock would understate it. opts.fresh bypasses that cache and
   opts.routes narrows the fan-out to the candidates we care about. */
async function sampleBuses(at,opts){
  const pos=at||here;
  const o=opts||{};
  await ensureMode();
  if(hasBackend()){
    try{
      let u=`${base()}/scan?lat=${pos.lat.toFixed(5)}&lng=${pos.lng.toFixed(5)}`;
      if(o.fresh) u+="&fresh=1";
      if(o.routes&&o.routes.length) u+="&routes="+encodeURIComponent(o.routes.join(","));
      const r=await fetch(u,{cache:"no-store"});
      if(r.ok){
        const j=await r.json();
        return { generated:Number(j.generated)||Date.now()/1000,
          buses:(Array.isArray(j.buses)?j.buses:[]).map(b=>({
            veh:String(b.veh),route:b.route||{},lat:Number(b.lat),lng:Number(b.lng),
            ts:Number(b.ts)||null })) };
      }
    }catch(_){}
  }
  // no backend: the old phone-side fan-out
  let routes=[];
  (state.stops||[]).forEach(s=>(s.routes||[]).forEach(r=>{
    if(!routes.some(x=>x.code===r.code)) routes.push(r); }));
  if(o.routes&&o.routes.length) routes=routes.filter(r=>o.routes.includes(String(r.code)));
  const out=[];
  await withLimit(routes.slice(0,ONBOARD.maxRoutes).map(r=>async()=>{
    const buses=await oasa("getBusLocation",r.code,null,!!o.fresh).catch(()=>null);
    (Array.isArray(buses)?buses:[]).forEach(v=>{
      const veh=String(pick(v,"VEH_NO","veh_no","VEH_CODE")||"");
      const la=Number(pick(v,"CS_LAT","cs_lat")), ln=Number(pick(v,"CS_LNG","cs_lng"));
      if(!veh||!isFinite(la)||!isFinite(ln)) return;
      out.push({veh,route:r,lat:la,lng:ln,ts:null});
    });
  }),6);
  return { generated:Date.now()/1000, buses:out };
}
/* Also carries speed/heading when the device reports them (phones do
   while actually moving) and the fix's own timestamp — both feed the
   staleness maths below. */
function myPosition(){
  return new Promise(res=>{
    const fallback={lat:here.lat,lng:here.lng,acc:999,speed:null,heading:null,t:Date.now()/1000};
    if(!navigator.geolocation) return res(fallback);
    navigator.geolocation.getCurrentPosition(
      p=>{ rememberPos(p);
        const c=p.coords;
        res({lat:c.latitude,lng:c.longitude,acc:c.accuracy||0,
          speed:(isFinite(c.speed)&&c.speed>=0)?c.speed:null,
          heading:(isFinite(c.heading)&&c.heading>=0)?c.heading:null,
          t:(p.timestamp?p.timestamp/1000:Date.now()/1000)});
      },
      ()=>res(fallback),
      {enableHighAccuracy:true,timeout:6000,maximumAge:0});
  });
}

/* Watch our own position for a while and hand back a TRACK, not a point.
   One getCurrentPosition gives `speed:null` on most Android fixes (the
   fused provider only fills it from raw GNSS doppler) and -1 on iOS, so
   anything scaled by it silently became zero. Several fixes always give
   displacement, and displacement always gives velocity. */
function watchMe(ms,onFix){
  return new Promise(res=>{
    const fixes=[]; let id=null,done=false,timer=null;
    const finish=()=>{
      if(done) return; done=true;
      clearTimeout(timer);
      if(id!=null){ try{ navigator.geolocation.clearWatch(id); }catch(_){} }
      res(track(fixes));
    };
    timer=setTimeout(finish,ms);
    if(!navigator.geolocation){ finish(); return; }
    try{
      id=navigator.geolocation.watchPosition(p=>{
        const c=p.coords;
        if(!isFinite(c.latitude)||!isFinite(c.longitude)) return;
        rememberPos(p);
        fixes.push({lat:c.latitude,lng:c.longitude,acc:c.accuracy||0,
          speed:(isFinite(c.speed)&&c.speed>=0)?c.speed:null,
          heading:(isFinite(c.heading)&&c.heading>=0)?c.heading:null,
          t:(p.timestamp?p.timestamp/1000:Date.now()/1000)});
        if(onFix) onFix(fixes.length,fixes[fixes.length-1]);
        // enough spread to fit a line? don't make the rider wait out the timer
        if(fixes.length>=ONBOARD.trackMin&&
           (fixes[fixes.length-1].t-fixes[0].t)>=ms/1000*0.6) finish();
      },()=>finish(),{enableHighAccuracy:true,timeout:ms,maximumAge:0});
    }catch(_){ finish(); }
  });
}

/* Least-squares velocity through a set of fixes: fit east(t) and north(t)
   independently and take the slopes. Robust to the metre-scale jitter a
   single pair of fixes would turn into a wild vector. */
function fitVelocity(fixes){
  if(!fixes||fixes.length<2) return null;
  const o=fixes[0], t0=o.t;
  let n=0,st=0,stt=0,sx=0,sy=0,stx=0,sty=0;
  fixes.forEach(f=>{
    const d=vec(o,f), dt=f.t-t0;
    n++; st+=dt; stt+=dt*dt; sx+=d[0]; sy+=d[1]; stx+=dt*d[0]; sty+=dt*d[1];
  });
  const den=n*stt-st*st;
  if(!(Math.abs(den)>1e-6)) return null;
  return [(n*stx-st*sx)/den,(n*sty-st*sy)/den];
}

/* Roll a set of fixes up into {pos, v, speed, acc, fixes, ok}. */
function track(fixes){
  const list=(fixes||[]).slice().sort((a,b)=>a.t-b.t);
  const last=list[list.length-1]||null;
  const pos=last||{lat:here.lat,lng:here.lng,acc:999,speed:null,heading:null,t:Date.now()/1000};
  const span=list.length>1?(list[list.length-1].t-list[0].t):0;
  let v=null;
  // a fit needs both several fixes and a few seconds of them; otherwise
  // fall back to whatever the device volunteered on the last one
  if(list.length>=3&&span>=4) v=fitVelocity(list);
  if(!v&&list.length>=2&&span>=2){
    const d=vec(list[0],last); v=[d[0]/span,d[1]/span];
  }
  if(!v&&last&&last.speed!=null&&last.heading!=null){
    const rad=last.heading*Math.PI/180;
    v=[last.speed*Math.sin(rad),last.speed*Math.cos(rad)];   // heading is from north, clockwise
  }
  const accs=list.map(f=>f.acc).filter(a=>isFinite(a)&&a>0).sort((a,b)=>a-b);
  const acc=accs.length?accs[Math.floor(accs.length/2)]:(pos.acc||999);
  return { pos, v, speed:v?len(v):0, acc, fixes:list, span,
           ok:list.length>0&&acc<=ONBOARD.accMax };
}
/* metres east/north between two points — small-angle flat projection,
   which is plenty over the few dozen metres travelled in 6 seconds. */
function vec(a,b){
  const k=Math.cos(a.lat*Math.PI/180);
  return [(b.lng-a.lng)*111320*k,(b.lat-a.lat)*111320];
}
function len(v){ return Math.hypot(v[0],v[1]); }
function cosAngle(u,v){
  const l=len(u)*len(v);
  return l?((u[0]*v[0]+u[1]*v[1])/l):0;
}
/* The 100 m rule is against TRUE distance, but we only ever see two
   noisy estimates of it:
     · your GPS fix — tens of metres off in a street canyon;
     · the bus's telematics ping — refreshed every ~20-40 s, so a MOVING
       bus reports where it was, not where it is.
   That second error is the killer. At 30 km/h a 35 s-old fix sits ~290 m
   behind the bus, so the vehicle you are sitting in falls outside a
   100 m gate and never appears — while a bus stopped at the kerb, whose
   stale position has caught up with reality, does. Hence:

     while you are moving, the gate widens by exactly how far a bus
     travels during that staleness, and the decision of which candidate
     is YOURS is made on velocity, not distance (see matchBuses).

   Standing still the gate stays ~100 m, so the product rule — you can't
   flag a bus you're merely watching go past — is unchanged. */
/* How believable is "I am sitting inside that vehicle", in metres of
   doubt? Standing still we have nothing but distance. Moving, we split
   the gap between the bus's reported position and us into:
     along — displacement along OUR direction of travel. Positive means
             the bus is behind us, which is exactly what a stale fix
             looks like from on board, so it is nearly free.
     cross — sideways. A bus one street over has this no matter how
             stale it is, so it is charged in full.
   This is the inversion of the old behaviour: a bus 400 m behind us on
   our own street now outranks one 60 m away on a parallel one. */
function plausibility(at,me){
  const raw=haversine(at.lat,at.lng,me.pos.lat,me.pos.lng);
  if(!me.v||me.speed<ONBOARD.moveMs) return raw;
  const unit=[me.v[0]/me.speed,me.v[1]/me.speed];
  const off=vec(at,me.pos);                       // bus fix → me
  const along=off[0]*unit[0]+off[1]*unit[1];
  const cross=Math.hypot(off[0]-along*unit[0],off[1]-along*unit[1]);
  const reach=me.speed*ONBOARD.maxStaleS+120;     // furthest a stale fix can lag
  const lag=along<0 ? -along*1.5                  // ahead of us: not staleness
                    : Math.max(0,along-reach);    // behind us: free up to `reach`
  return cross+lag;
}

async function findMyBus(onProgress){
  const me=await watchMe(ONBOARD.trackMs,onProgress&&(n=>onProgress({phase:"fix",fixes:n})));
  if(!me.ok) return { me, p0:me.pos, t0:Date.now()/1000, list:[], badFix:true };
  if(onProgress) onProgress({phase:"scan"});
  const scan=await sampleBuses(me.pos);
  const near={};
  (scan.buses||[]).forEach(c=>{
    const d=haversine(c.lat,c.lng,me.pos.lat,me.pos.lng);
    if(d>ONBOARD.gateM) return;                   // the server's own trim, nothing tighter
    // the same vehicle can surface on two route variants — keep the closest
    if(!near[c.veh]||d<near[c.veh].d){
      near[c.veh]={...c,d,rawD:d,p0:{lat:c.lat,lng:c.lng},t0:c.ts||scan.generated};
    }
  });
  const list=Object.values(near).map(c=>{
    c.cost=plausibility(c,me); c.withYou=false; return c;
  }).sort(candOrder).slice(0,ONBOARD.shortlist);
  return { me, p0:me.pos, t0:scan.generated, list };
}
function candOrder(a,b){
  return (b.withYou?1:0)-(a.withYou?1:0) || a.cost-b.cost || a.d-b.d;
}

/* Two more looks, ~5.5 s apart. This is where the real decision happens.
 *
 * The insight: a stale feed shifts a bus's REPORTED POSITION, but not
 * the DIRECTION it is travelling. If you are on board, your track and the
 * bus's point the same way even when the reported positions are 300 m
 * apart — and direction, unlike speed, needs no knowledge of when the
 * feed's fixes were actually taken. So heading agreement is the primary
 * test and pace is applied only when OASA timestamps both ends.
 *
 * Three samples rather than two: a single 6 s baseline at walking-pace
 * speeds is barely larger than GPS noise, and OASA often repeats the
 * same fix across one interval and jumps across the next. Duplicated
 * fixes are dropped, so the baseline stretches to whatever the feed
 * actually gave us.
 *
 * onProgress fires after each round so the list re-ranks in front of the
 * rider instead of sitting still for 12 s. */
async function refineMyBus(cands,me0,t0,onProgress){
  const codes=[...new Set(cands.map(c=>String((c.route||{}).code||"")).filter(Boolean))].slice(0,6);
  const hist=new Map();
  cands.forEach(c=>hist.set(c.veh,[{lat:c.p0.lat,lng:c.p0.lng,ts:c.ts||null,t:c.t0||t0}]));
  let fixes=me0.fixes.slice();

  for(let round=1;round<ONBOARD.samples;round++){
    const seg=await watchMe(ONBOARD.sampleMs);
    fixes=fixes.concat(seg.fixes);
    const wall=Date.now()/1000;
    let scan;
    try{ scan=await sampleBuses(me0.pos,{fresh:true,routes:codes}); }catch(_){ scan=null; }
    if(scan) (scan.buses||[]).forEach(v=>{
      const h=hist.get(v.veh); if(!h) return;
      const prev=h[h.length-1];
      // an unchanged fix is not a new observation — recording it would
      // read as "this bus is parked" and destroy the baseline
      if(Math.abs(v.lat-prev.lat)<1e-7&&Math.abs(v.lng-prev.lng)<1e-7) return;
      h.push({lat:v.lat,lng:v.lng,ts:v.ts||null,t:Math.max(scan.generated||0,wall)});
    });
    const me=scoreCands(cands,hist,fixes);
    if(onProgress) onProgress(cands.slice().sort(candOrder),round,me);
  }
  return { list:cands.slice().sort(candOrder), me:track(fixes) };
}

/* Turn the accumulated position histories into a verdict per candidate.
   Returns the rider's own track. */
function scoreCands(cands,hist,fixes){
  const me=track(fixes);
  cands.forEach(c=>{
    const h=hist.get(c.veh)||[];
    const last=h[h.length-1]||c.p0;
    c.lat=last.lat; c.lng=last.lng;
    c.rawD=haversine(last.lat,last.lng,me.pos.lat,me.pos.lng);
    c.d=c.rawD; c.withYou=false; c.age=0;

    // nothing moved, or the feed never gave us a second distinct fix:
    // no velocity to compare, so no verdict — plausibility ranking stands
    if(h.length<2||!me.v||me.speed<ONBOARD.moveMs){
      c.cost=plausibility(last,me); return;
    }
    const first=h[0];
    const moved=vec(first,last), dist=len(moved);
    if(dist<ONBOARD.minMove){ c.cost=plausibility(last,me); return; }
    const dir=[moved[0]/dist,moved[1]/dist];

    /* Split the gap between the bus's reported position and me along its
       OWN direction of travel:
         along — what a stale fix looks like (the bus is behind itself)
         cross — what a DIFFERENT street looks like
       A stale fix inflates `along` and leaves `cross` at GPS-noise level;
       a bus one street over inflates `cross` however stale it is. */
    const off=vec(last,me.pos);
    const along=off[0]*dir[0]+off[1]*dir[1];
    const cross=Math.hypot(off[0]-along*dir[0],off[1]-along*dir[1]);
    c.cross=cross; c.along=along;

    /* Pace, and the dead-reckoning that follows it, both need to know how
       much real time the bus's displacement took. Only OASA's own stamps
       can tell us that — our sample interval is an upper bound on it, not
       a measurement. With stamps: compare speeds. Without: assume we are
       together, which makes the along-track lag itself the age of the fix. */
    let paceOK=true, busSpeed=me.speed;
    if(first.ts&&last.ts&&last.ts>first.ts){
      busSpeed=dist/(last.ts-first.ts);
      const ratio=Math.min(me.speed,busSpeed)/Math.max(me.speed,busSpeed);
      paceOK=ratio>ONBOARD.paceOK;
      c.age=Math.max(0,Math.min(ONBOARD.maxStaleS,(Date.now()/1000)-last.ts));
    }else{
      c.age=Math.max(0,Math.min(ONBOARD.maxStaleS,along/Math.max(busSpeed,0.5)));
    }
    const proj=project(last,[dir[0]*busSpeed,dir[1]*busSpeed],c.age);
    c.d=haversine(proj.lat,proj.lng,me.pos.lat,me.pos.lng);

    const cos=cosAngle(me.v,dir);
    const sameStreet=cross<=Math.max(ONBOARD.crossMax,me.acc||0);
    const reach=me.speed*ONBOARD.maxStaleS+150;
    const explainable=along>=-150&&along<=reach;
    c.agree=cos>ONBOARD.cosOK&&paceOK;
    c.withYou=c.agree&&sameStreet&&explainable;
    c.cost=cross+Math.max(0,along-reach);
  });
  return me;
}

/* move a point by a velocity vector (m/s, east/north) for `secs` */
function project(p,v,secs){
  const k=Math.cos(p.lat*Math.PI/180)||1;
  return { lat:p.lat+(v[1]*secs)/111320, lng:p.lng+(v[0]*secs)/(111320*k) };
}

/* -------------------- report form (2 steps) ------------------------ */
const reportForm={open:false};
const NOTICE_KEY="repNotice";
/* Shown once, before anyone's first report. It is the app's only
   acceptable-use statement at the point it actually matters, and it is
   also what makes "you are responsible for what you file" something the
   rider has read rather than something buried in the terms. */
function openReportForm(){
  if(!localStorage.getItem(NOTICE_KEY)){ firstReportNotice(); return; }
  reportFormBody();
}
function firstReportNotice(){
  const box=$("#rep-strip");
  reportForm.open=true;
  box.innerHTML=`<div class="field"><label>${t("firstH")}</label>
      <div class="note">${esc(t("firstP"))}</div></div>
    <button class="rep-cta" id="rf-ok" style="margin-top:12px">${t("agree")}</button>
    <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
  $("#rf-ok").onclick=()=>{
    try{ localStorage.setItem(NOTICE_KEY,"1"); }catch(_){}
    reportFormBody();
  };
  $("#rf-cancel").onclick=()=>{
    reportForm.open=false; drawReportMap(); renderReportList();
  };
}
function reportFormBody(){
  const box=$("#rep-strip");
  reportForm.open=true;
  // No category preselected: scanning for buses costs a burst of API
  // calls and a GPS fix, so nothing happens until the user says where
  // they are.
  let kind=null, target=null, type=null, busy=false;

  const close=()=>{ reportForm.open=false; drawReportMap(); renderReportList(); };
  const kindChips=()=>`<div class="field"><label>${t("reportWhere")}</label>
    <div class="chips" id="rf-kind">
      <button class="chip${kind==="bus"?" on":""}" data-k="bus">${t("onBus")}</button>
      <button class="chip${kind==="metro"?" on":""}" data-k="metro">${t("atMetro")}</button>
    </div></div>`;
  const wireKind=()=>box.querySelectorAll("#rf-kind .chip").forEach(c=>c.onclick=()=>{
    if(busy||c.dataset.k===kind) return;
    kind=c.dataset.k; type=TYPES_BY_KIND[kind][0]; target=null; step1();
  });

  /* ---- step 1: what are you on / at? ---- */
  function step1(){
    if(!kind){
      box.innerHTML=kindChips()+
        `<div class="note">${t("pickWhere")}</div>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-cancel").onclick=close;
      return;
    }
    box.innerHTML=kindChips()+
      `<div class="note" id="rf-body">${kind==="bus"?t("scanBus"):t("searching")}</div>
       <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
    wireKind(); $("#rf-cancel").onclick=close;
    kind==="bus"?pickBus():pickMetro();
  }

  async function pickBus(){
    busy=true;
    const myKind=kind;
    const alive=()=>reportForm.open&&kind===myKind;
    const note=txt=>{ const b=$("#rf-body"); if(b) b.textContent=txt; };
    let found=null, me=null;
    try{
      found=await findMyBus(p=>{ if(alive()) note(p.phase==="scan"?t("scanBus"):t("gpsFix")); });
    }catch(_){ found=null; }
    busy=false;
    if(!alive()) return;

    // A vague fix can't identify anything; say so instead of scanning and
    // then blaming the feed for the empty list it was always going to give.
    if(!found||found.badFix){
      box.innerHTML=kindChips()+
        `<div class="note">${t("gpsWeak")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      return;
    }
    if(!found.list.length){
      box.innerHTML=kindChips()+
        `<div class="note">${t("noBusNear")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      return;
    }
    const cands=found.list;
    me=found.me;
    drawCands(cands.slice().sort(candOrder),1);
    // further opinions arrive every few seconds and re-rank in place
    refineMyBus(cands,found.me,found.t0,(list,round,mNow)=>{
      me=mNow||me;
      if(alive()&&!target) drawCands(list,round+1);
    }).then(res=>{
      me=res.me||me;
      if(alive()&&!target) drawCands(res.list,ONBOARD.samples);
    }).catch(()=>{});

    function drawCands(list,round){
      const pending=round<ONBOARD.samples;
      box.innerHTML=kindChips()+
        `<div class="field"><label>${t("confirmBus")}</label>
          <div class="cands" id="rf-cands">${list.map((c,i)=>{
            const dest=destOf((LANG==="en"?(c.route.en||c.route.el):(c.route.el||c.route.en))||"");
            return `<button class="cand${c.withYou?" hot":""}" data-i="${i}">
              <span class="cand-tile num">${esc(c.route.id||"")}</span>
              <span class="cand-txt"><span class="cand-dest">${esc(dest)}</span>
                <span class="cand-meta">${fmtDist(c.d)}${c.withYou?` · ✓ ${t("withYou")}`:""}</span></span>
            </button>`; }).join("")}</div></div>
         <div class="shint">${pending?t("scanRefine"):t("onboardNote")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      box.querySelectorAll(".cand").forEach(b=>b.onclick=()=>{
        const c=list[+b.dataset.i];
        target={ id:c.veh, name:destOf((LANG==="en"?(c.route.en||c.route.el):(c.route.el||c.route.en))||""),
          lineId:c.route.id||"", routeCode:c.route.code, veh:c.veh, lat:c.lat, lng:c.lng };
        step2();
      });
    }
  }

  async function pickMetro(){
    busy=true; await loadMetro(); busy=false;
    if(!reportForm.open||kind!=="metro") return;
    const near=(state.metro||[]).map(m=>({...m,d:haversine(m.lat,m.lng,here.lat,here.lng)}))
      .filter(m=>m.d<=ONBOARD.metroRadius).sort((a,b)=>a.d-b.d);
    if(!near.length){
      box.innerHTML=kindChips()+
        `<div class="note">${t("noMetroNear")}</div>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-cancel").onclick=close; return;
    }
    box.innerHTML=kindChips()+
      `<div class="field"><label>${t("nearestStation")}</label>
        <div class="cands" id="rf-cands">${near.map((m,i)=>`
          <button class="cand" data-i="${i}"><span class="cand-tile">Ⓜ</span>
            <span class="cand-txt"><span class="cand-dest">${esc(LANG==="en"?(m.name_en||m.name):m.name)}</span>
              <span class="cand-meta">${esc(m.lines.map(l=>"M"+l).join(" · "))} · ${fmtDist(m.d)}</span></span>
          </button>`).join("")}</div></div>
       <div class="shint">${t("metroNote")}</div>
       <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
    wireKind(); $("#rf-cancel").onclick=close;
    box.querySelectorAll(".cand").forEach(b=>b.onclick=()=>{
      const m=near[+b.dataset.i];
      target={ id:m.id, name:(LANG==="en"?(m.name_en||m.name):m.name)||"",
        lineId:m.lines.map(l=>"M"+l).join("/"), routeCode:null, veh:null,
        lat:m.lat, lng:m.lng };
      step2();
    });
  }

  /* ---- step 2: what's happening? Types are grouped under their two
     categories, each chip carrying its category's colour, so the split
     is obvious before you pick rather than only afterwards on the map. */
  function step2(){
    const types=TYPES_BY_KIND[kind]||[];
    if(!types.includes(type)) type=types[0];
    const group=cat=>{
      const list=types.filter(x=>catOf(x)===cat);
      if(!list.length) return "";
      return `<div class="field"><label>${cat==="issue"?t("catIssue"):t("catOps")}</label>
        <div class="chips">${list.map(x=>
          `<button class="chip ${cat}${x===type?" on":""}" data-t="${x}">${esc(issueLabel(x))}</button>`
        ).join("")}</div></div>`;
    };
    box.innerHTML=`
      <div class="field"><label>${kind==="bus"?t("onBus"):t("atMetro")}</label>
        <div class="picked"><span class="cand-tile num">${esc(target.lineId||"Ⓜ")}</span>
          <span class="cand-dest">${esc(target.name||target.id)}</span></div></div>
      <div id="rf-type">${CAT_ORDER.map(group).join("")}</div>
      <button class="rep-cta" id="rf-send" style="margin-top:14px">${t("send")}</button>
      <button class="ghost" id="rf-back">${t("back")}</button>
      <div class="note" id="rf-msg" style="display:none"></div>`;
    box.querySelectorAll("#rf-type .chip").forEach(c=>c.onclick=()=>{
      type=c.dataset.t;
      box.querySelectorAll("#rf-type .chip").forEach(x=>x.classList.toggle("on",x===c));
    });
    $("#rf-back").onclick=()=>{ target=null; step1(); };
    $("#rf-send").onclick=send;
  }

  async function send(){
    const btn=$("#rf-send"), msg=$("#rf-msg");
    if(!target) return;
    btn.disabled=true; btn.textContent="…";
    const fail=txt=>{ msg.style.display=""; msg.textContent=txt;
      btn.disabled=false; btn.textContent=t("send"); };
    try{
      const res=await fetch(base()+"/reports",{method:"POST",cache:"no-store",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ by:myId(), kind, type,
          targetId:target.id, targetName:target.name, lineId:target.lineId,
          routeCode:target.routeCode, veh:target.veh, lat:target.lat, lng:target.lng })});
      let j={}; try{ j=await res.json(); }catch(_){}
      if(!res.ok){ fail(j.error||("HTTP "+res.status)); return; }
      reportForm.open=false;
      await refreshReports(); await refreshFlagPositions();
      drawReportMap(); renderReportList(); renderView();
    }catch(e){ fail(String((e&&e.message)||e)); }
  }

  step1();
}

/* ------------------------ line lookup ------------------------------ */
async function loadLines(){
  if(state.lines&&state.lines.length) return state.lines;
  if(hasBackend()){
    try{ const r=await fetch(base()+"/lines",{cache:"no-store"});
      if(r.ok){ const j=await r.json(); if(Array.isArray(j)&&j.length){ state.lines=j; return j; } } }catch(_){}
  }
  // no backend (or the endpoint failed): go straight to OASA
  const raw=await oasa("webGetLines").catch(()=>null);
  state.lines=(Array.isArray(raw)?raw:[]).map(l=>({
    code:String(pick(l,"LineCode","line_code")||""),
    id:String(pick(l,"LineID","line_id")||""),
    el:pick(l,"LineDescr","line_descr")||"", en:pick(l,"LineDescrEng","line_descr_eng")||"",
  })).filter(l=>l.code&&l.id);
  return state.lines;
}
function openLineSearch(){
  toggleMenu(false);
  $("#ln-h").textContent=t("lineH"); $("#ln-p").textContent=t("lineP");
  $("#lnq").placeholder=t("linePh");
  $("#lnres").innerHTML="";
  $("#linebg").classList.add("on");
  $("#lnq").value=""; setTimeout(()=>$("#lnq").focus(),80);
  loadLines();
}
function closeLineSearch(){ $("#linebg").classList.remove("on"); }
/* "22" should find 022 and Α22 but not 220 — so: exact, then prefix,
   then anywhere, and only fall back to the description text after that. */
function matchLines(lines,q){
  const s=q.trim().toLowerCase();
  if(!s) return [];
  const norm=x=>String(x||"").toLowerCase().replace(/^0+/,"");
  const ns=norm(s);
  const score=l=>{
    const id=l.id.toLowerCase(), nid=norm(id);
    if(id===s||nid===ns) return 0;
    if(id.startsWith(s)||nid.startsWith(ns)) return 1;
    if(id.includes(s)) return 2;
    if((l.el+" "+l.en).toLowerCase().includes(s)) return 3;
    return 9;
  };
  return lines.map(l=>({l,r:score(l)})).filter(x=>x.r<9)
    .sort((a,b)=>a.r-b.r||String(a.l.id).localeCompare(String(b.l.id),undefined,{numeric:true}))
    .slice(0,25).map(x=>x.l);
}
/* One field, two kinds of answer: lines (matched against the cached
   catalogue) and stops. OASA has no stop-name search, so stops come from
   the Worker's /stops/search, which geocodes the query and returns the
   stops around that place — plus anything matching among the stops
   already loaded around you, which needs no request at all. */
function localStopMatches(q){
  const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const n=norm(q);
  if(!n) return [];
  const pool=(state.stops||[]).concat(Object.values(state.favLive||{}));
  const seen={},out=[];
  pool.forEach(s=>{
    const key=String(s.code);
    if(seen[key]) return;
    if(norm(s.name_el).includes(n)||norm(s.name_en).includes(n)||norm(s.street).includes(n)){
      seen[key]=1; out.push(s);
    }
  });
  return out.sort((a,b)=>(a.dist||0)-(b.dist||0)).slice(0,6);
}
/* "No line by that name" is only true if we actually looked. Offline, or
   with the service unreachable, the honest answer is that we could not,
   and with no location fix the local match had nothing to match against.
   Saying the wrong one of these sends people hunting for a typo. */
function emptyMsg(netFail,fallback){
  if(navigator.onLine===false) return t("offline");
  if(netFail) return t("netErr");
  if(!hasBackend()&&!here.gps) return t("noFix");
  return t(fallback);
}
async function doLineSearch(){
  const box=$("#lnres"), q=$("#lnq").value;
  if(!q.trim()) return;
  box.innerHTML=`<div class="res-msg">${t("searching")}</div>`;

  const lines=await loadLines();
  const lineHits=matchLines(lines,q);
  const localStops=localStopMatches(q);

  let remoteStops=[], netFail=false;
  if(hasBackend()){
    try{
      const r=await fetch(`${base()}/stops/search?q=${encodeURIComponent(q)}`,{cache:"no-store"});
      if(r.ok){ const j=await r.json(); remoteStops=Array.isArray(j.stops)?j.stops:[]; }
      else netFail=true;
    }catch(_){ netFail=true; }
  }
  // de-dupe: a stop we already hold locally wins (it has live arrivals)
  const haveLocal={}; localStops.forEach(s=>{ haveLocal[String(s.code)]=1; });
  const stopHits=localStops.concat(remoteStops.filter(s=>!haveLocal[String(s.code)]))
    .slice(0,8);

  if(!lineHits.length&&!stopHits.length){
    box.innerHTML=`<div class="res-msg">${esc(emptyMsg(netFail||!lines.length,"noLine"))}</div>`;
    return;
  }
  box.innerHTML="";
  if(lineHits.length){
    const h=document.createElement("div"); h.className="sec-label";
    h.textContent=t("secLines"); box.appendChild(h);
  }
  lineHits.forEach(l=>{
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`<b class="num">${esc(l.id)}</b> · ${esc((LANG==="en"?(l.en||l.el):(l.el||l.en))||"")}`;
    b.onclick=()=>pickLineDirection(l);
    box.appendChild(b);
  });
  if(stopHits.length){
    const h=document.createElement("div"); h.className="sec-label";
    h.textContent=t("secStops"); box.appendChild(h);
  }
  stopHits.forEach(raw=>{
    const s=adoptStop(raw);
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`${isFav(s.code)?'<span class="star">★</span> ':""}🚏 ${esc(stopName(s))}`
      +(isFinite(s.dist)?` <span style="color:var(--ink3)">· ${fmtDist(s.dist)}</span>`:"");
    /* The results stay open underneath. Picking a stop used to close the
       search, so deciding it was the wrong stop meant typing the query
       again; now closing the card puts you back in the list you were
       choosing from. */
    b.onclick=()=>openStopCard(s);
    box.appendChild(b);
  });
}
/* Turn a search result into a full stop object we can load arrivals
   into — reusing the live one if we already track that code. */
function adoptStop(raw){
  const key=String(raw.code);
  const existing=(state.stops||[]).find(s=>String(s.code)===key)||state.favLive[key];
  if(existing) return existing;
  const s={code:key,name_el:raw.name_el||"",name_en:raw.name_en||"",street:raw.street||"",
    lat:Number(raw.lat),lng:Number(raw.lng),
    dist:(isFinite(raw.lat)&&isFinite(here.lat))?haversine(here.lat,here.lng,Number(raw.lat),Number(raw.lng)):NaN,
    lines:[],routes:[],routeMap:{},arrivals:[],routesLoaded:false,arrLoaded:false};
  state.favLive[key]=s;      // keep it around so favouriting works
  return s;
}
/* A line has two directions (and sometimes more variants); each is its
   own route code, and a route code is what the preview needs. */
async function pickLineDirection(line){
  const box=$("#lnres");
  box.innerHTML=`<div class="res-msg">${t("searching")}</div>`;
  const raw=await oasa("getRoutesForLine",line.code).catch(()=>null);
  const routes=(Array.isArray(raw)?raw:[]).map(r=>({
    code:String(pick(r,"RouteCode","route_code")||""),
    el:pick(r,"RouteDescr","route_descr")||line.el,
    en:pick(r,"RouteDescrEng","route_descr_eng")||line.en,
  })).filter(r=>r.code);
  if(!routes.length){ box.innerHTML=`<div class="res-msg">${t("noRoute")}</div>`; return; }
  const show=r=>{ closeLineSearch();
    openRoutePreview(null,r.code,null,{line:line.id,el:r.el,en:r.en}); };
  if(routes.length===1){ show(routes[0]); return; }
  box.innerHTML=`<div class="res-msg">${t("pickDir")}</div>`;
  routes.slice(0,6).forEach(r=>{
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`<b class="num">${esc(line.id)}</b> · ${esc(destOf((LANG==="en"?(r.en||r.el):(r.el||r.en))||""))}`;
    b.onclick=()=>show(r);
    box.appendChild(b);
  });
}

/* ---------------------- live bus map -------------------------------
 * "Every bus in Athens" is more subrequests than a Worker gets in one
 * go, so the map is honest about it: it loads the lines around the map
 * centre and draws every vehicle running on them. Pan and hit ↻ to load
 * another area. */
let lmap=null,llayer=null,liveBusy=false;
function openLiveMap(){
  toggleMenu(false);
  $("#live").classList.add("on");
  $("#live-title").textContent=t("liveH");
  if(!lmap){
    lmap=L.map("livemap",{zoomControl:true}).setView([here.lat,here.lng],14);
    L.tileLayer(tileUrl(),{subdomains:"abcd",maxZoom:20,detectRetina:true,attribution:TILE_ATTR}).addTo(lmap);
    llayer=L.layerGroup().addTo(lmap);
  }
  $("#live-hint").innerHTML=`<div class="shint">${t("liveHint")}</div>`;
  setTimeout(()=>lmap.invalidateSize(),70);
  loadLive();
}
function closeLiveMap(){ $("#live").classList.remove("on"); }
async function loadLive(){
  if(liveBusy||!lmap) return;
  liveBusy=true;
  $("#live-sub").textContent=t("liveLoading");
  const c=lmap.getCenter();
  let buses=[];
  try{
    if(hasBackend()){
      const r=await fetch(`${base()}/live?lat=${c.lat.toFixed(4)}&lng=${c.lng.toFixed(4)}`,{cache:"no-store"});
      if(r.ok){ const j=await r.json(); buses=Array.isArray(j.buses)?j.buses:[]; }
    } else {
      // no backend: fan out over the routes we already know about
      const routes=[]; (state.stops||[]).forEach(s=>(s.routes||[]).forEach(x=>{
        if(!routes.some(y=>y.code===x.code)) routes.push(x); }));
      await withLimit(routes.slice(0,10).map(rt=>async()=>{
        const arr=await oasa("getBusLocation",rt.code).catch(()=>null);
        (Array.isArray(arr)?arr:[]).forEach(v=>buses.push({
          veh:String(pick(v,"VEH_NO","veh_no")||""), line:rt.id, routeCode:rt.code,
          el:rt.el, en:rt.en,
          lat:Number(pick(v,"CS_LAT","cs_lat")), lng:Number(pick(v,"CS_LNG","cs_lng"))}));
      }),5);
    }
  }catch(_){}
  llayer.clearLayers();
  L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:900}).addTo(llayer);
  let n=0;
  buses.forEach(v=>{
    if(!isFinite(v.lat)||!isFinite(v.lng)) return;
    n++;
    const dest=destOf((LANG==="en"?(v.en||v.el):(v.el||v.en))||"");
    L.marker([v.lat,v.lng],{icon:L.divIcon({className:"",
      html:`<div class="livebus num">${esc(v.line||"")}</div>`,iconSize:[30,20],iconAnchor:[15,10]})})
      .addTo(llayer).bindTooltip(`${esc(v.line||"")}${dest?" · "+esc(dest):""}`,{direction:"top"});
  });
  $("#live-sub").textContent = n?t("liveCount")(n):t("liveNone");
  liveBusy=false;
}

/* ====================== journey planning (A → B) ==================== *
 * The Worker does the routing; this end picks the two ends, renders the
 * itineraries, and is honest about which numbers are measured and which
 * are modelled. The distinction is per leg, not per journey, because a
 * trip is routinely half of each: a live ETA for the bus you are about to
 * catch, an estimate for the train you will change onto in forty minutes.
 * ------------------------------------------------------------------ */
const jp = { from: null, to: null, res: null, picking: null, map: null, layer: null, busy: false };

function jpPlaceLabel(p) {
  if (!p) return null;
  if (p.kind === "me") return t("jpMyLoc");
  return p.label || "";
}
function paintJourneyForm() {
  const f = $("#jp-from"), to = $("#jp-to");
  const lf = jpPlaceLabel(jp.from), lt = jpPlaceLabel(jp.to);
  $("#jp-from-t").textContent = lf || t("jpFrom");
  $("#jp-to-t").textContent = lt || t("jpTo");
  f.classList.toggle("empty", !lf);
  to.classList.toggle("empty", !lt);
  $("#jp-go").textContent = jp.busy ? t("jpSearching") : t("jpGo");
  $("#jp-go").disabled = jp.busy || !jp.from || !jp.to;
}
function openJourney() {
  toggleMenu(false);
  $("#jp-title").textContent = t("jpH");
  $("#jp-sub").textContent = "";
  if (!jp.from && here && isFinite(here.lat)) jp.from = { kind: "me", lat: here.lat, lng: here.lng };
  paintJourneyForm();
  $("#jp").classList.add("on");
  loadMetro().catch(() => {});      // so stations are searchable in the picker
}
function closeJourney() { $("#jp").classList.remove("on"); }

/* Both ends are picked the same way, and from everything the app already
   knows how to name: where you are, your favourites, the stops around you,
   every metro station, and failing all that the geocoder. */
function openJourneyPick(which) {
  jp.picking = which;
  $("#jpp-h").textContent = t("jpPickH");
  $("#jpp-q").placeholder = t("jpPickPh");
  $("#jpp-q").value = "";
  jpPickResults("");
  $("#jppick").classList.add("on");
  setTimeout(() => $("#jpp-q").focus(), 80);
}
function closeJourneyPick() { $("#jppick").classList.remove("on"); jp.picking = null; }
function jpChoose(place) {
  if (jp.picking === "to") jp.to = place; else jp.from = place;
  closeJourneyPick(); paintJourneyForm();
}
async function jpPickResults(q) {
  const box = $("#jpp-res");
  const add = (label, place, note) => {
    const b = document.createElement("button");
    b.className = "res";
    b.innerHTML = esc(label) + (note ? ` <span style="color:var(--ink3)">· ${esc(note)}</span>` : "");
    b.onclick = () => jpChoose(place);
    box.appendChild(b);
  };
  box.innerHTML = "";
  const query = q.trim().toLowerCase();

  if (!query) {
    if (here && isFinite(here.lat)) add(t("jpMyLoc"), { kind: "me", lat: here.lat, lng: here.lng });
    favs.slice(0, 4).forEach(f => {
      const s2 = state.favLive[String(f.code)] || byCode(f.code) || f;
      if (isFinite(s2.lat)) add("★ " + stopName(s2), { kind: "stop", lat: s2.lat, lng: s2.lng, label: stopName(s2) });
    });
    state.stops.slice(0, 4).forEach(s2 => add("🚏 " + stopName(s2),
      { kind: "stop", lat: s2.lat, lng: s2.lng, label: stopName(s2) }, fmtDist(s2.dist)));
    return;
  }

  // stations and loaded stops match instantly, with no request at all
  const norm = x => String(x || "").toLowerCase();
  (state.metro || []).filter(m => norm(m.name).includes(query) || norm(m.name_en).includes(query))
    .slice(0, 5).forEach(m => add("Ⓜ " + (LANG === "en" ? (m.name_en || m.name) : m.name),
      { kind: "metro", lat: m.lat, lng: m.lng, label: LANG === "en" ? (m.name_en || m.name) : m.name }));
  localStopMatches(query).slice(0, 4).forEach(s2 => add("🚏 " + stopName(s2),
    { kind: "stop", lat: s2.lat, lng: s2.lng, label: stopName(s2) }));

  if (query.length < 3) return;
  const msg = document.createElement("div");
  msg.className = "res-msg"; msg.textContent = t("searching"); box.appendChild(msg);
  let items = [], failed = false;
  try { items = await geocode(q); } catch (_) { failed = true; }
  msg.remove();
  items.slice(0, 6).forEach(it => {
    const lab = placeLabel(it);
    const la = Number(it.lat), ln = Number(it.lon != null ? it.lon : it.lng);
    if (!lab || !isFinite(la) || !isFinite(ln)) return;
    add(lab, { kind: "addr", lat: la, lng: ln, label: lab });
  });
  if (!box.children.length) {
    const m2 = document.createElement("div");
    m2.className = "res-msg";
    m2.textContent = navigator.onLine === false ? t("offline")
      : failed ? t("netErr") : t("noResults");
    box.appendChild(m2);
  }
}

async function runJourney() {
  if (!jp.from || !jp.to || jp.busy) return;
  jp.busy = true; paintJourneyForm();
  const out = $("#jp-out");
  out.innerHTML = `<div class="res-msg">${esc(t("jpSearching"))}</div>`;
  try {
    const u = `${base()}/plan?from=${jp.from.lat},${jp.from.lng}&to=${jp.to.lat},${jp.to.lng}`;
    const r = await fetch(u, { cache: "no-store" });
    if (!r.ok) throw new Error("plan " + r.status);
    jp.res = await r.json();
    renderJourney();
  } catch (_) {
    out.innerHTML = `<div class="res-msg">${esc(navigator.onLine === false ? t("offline") : t("netErr"))}</div>`;
