/* ---------------- "which bus am I on?" -----------------------------
 * You can only flag the vehicle you are actually inside, so the app has
 * to work out which one that is.
 *
 * WHY THE OLD VERSION FAILED ON A MOVING BUS. It shortlisted vehicles by
 * distance and only then compared velocities. But an OASA fix is 30-60 s
 * old, so a bus doing 8 m/s reports itself 250-450 m behind where it
 * actually is — and the shortlist threw it away before the velocity
 * comparison ever saw it. The error is proportional to speed, so it
 * vanishes the moment the bus stops: hence "it only finds my bus when we
 * pull into a stop". Worse, the slack that was supposed to cover this was
 * scaled by navigator.geolocation's `speed`, which is null on most single
 * fixes — so in practice there was no slack at all.
 *
 * WHAT IT DOES NOW.
 *  0. TRACK YOURSELF FIRST. watchMe() collects several fixes over ~8 s and
 *     fits a velocity to them. Never trust one fix's `speed` field; a
 *     least-squares fit over real displacement always exists.
 *  1. SHORTLIST WIDE. Every live vehicle the server returns (it trims at
 *     1.5 km) ranked by PLAUSIBILITY, not raw distance: sideways offset
 *     from your path costs full price, lag along your own path is nearly
 *     free, because that is exactly what a stale fix looks like from a
 *     seat. Nothing is discarded for being "too far".
 *  2. CO-MOVEMENT decides. Two more samples ~5.5 s apart. If you are on
 *     board, your track and the vehicle's point the same way — and
 *     direction, unlike speed, is completely immune to the feed's timing
 *     being unknown. Those get "moving with you" and float to the top.
 *  3. YOU CONFIRM WITH A TAP. The app ranks and marks the one that moves
 *     with you; it never picks for you, and every pick is trusted.
 * ------------------------------------------------------------------ */
/* Returns {generated, buses[]} — the timestamp matters: the first sample
   may come from the Worker's 10 s cache, so measuring velocity against
   wall-clock would understate it. opts.fresh bypasses that cache and
   opts.routes narrows the fan-out to the candidates we care about. */
async function sampleBuses(at,opts){
  const pos=at||here;
  const o=opts||{};
  await ensureMode();
  if(hasBackend()){
    try{
      let u=`${base()}/scan?lat=${pos.lat.toFixed(5)}&lng=${pos.lng.toFixed(5)}`;
      if(o.fresh) u+="&fresh=1";
      if(o.routes&&o.routes.length) u+="&routes="+encodeURIComponent(o.routes.join(","));
      const r=await fetch(u,{cache:"no-store"});
      if(r.ok){
        const j=await r.json();
        return { generated:Number(j.generated)||Date.now()/1000,
          buses:(Array.isArray(j.buses)?j.buses:[]).map(b=>({
            veh:String(b.veh),route:b.route||{},lat:Number(b.lat),lng:Number(b.lng),
            ts:Number(b.ts)||null })) };
      }
    }catch(_){}
  }
  // no backend: the old phone-side fan-out
  let routes=[];
  (state.stops||[]).forEach(s=>(s.routes||[]).forEach(r=>{
    if(!routes.some(x=>x.code===r.code)) routes.push(r); }));
  if(o.routes&&o.routes.length) routes=routes.filter(r=>o.routes.includes(String(r.code)));
  const out=[];
  await withLimit(routes.slice(0,ONBOARD.maxRoutes).map(r=>async()=>{
    const buses=await oasa("getBusLocation",r.code,null,!!o.fresh).catch(()=>null);
    (Array.isArray(buses)?buses:[]).forEach(v=>{
      const veh=String(pick(v,"VEH_NO","veh_no","VEH_CODE")||"");
      const la=Number(pick(v,"CS_LAT","cs_lat")), ln=Number(pick(v,"CS_LNG","cs_lng"));
      if(!veh||!isFinite(la)||!isFinite(ln)) return;
      out.push({veh,route:r,lat:la,lng:ln,ts:null});
    });
  }),6);
  return { generated:Date.now()/1000, buses:out };
}
/* Also carries speed/heading when the device reports them (phones do
   while actually moving) and the fix's own timestamp — both feed the
   staleness maths below. */
function myPosition(){
  return new Promise(res=>{
    const fallback={lat:here.lat,lng:here.lng,acc:999,speed:null,heading:null,t:Date.now()/1000};
    if(!navigator.geolocation) return res(fallback);
    navigator.geolocation.getCurrentPosition(
      p=>{ rememberPos(p);
        const c=p.coords;
        res({lat:c.latitude,lng:c.longitude,acc:c.accuracy||0,
          speed:(isFinite(c.speed)&&c.speed>=0)?c.speed:null,
          heading:(isFinite(c.heading)&&c.heading>=0)?c.heading:null,
          t:(p.timestamp?p.timestamp/1000:Date.now()/1000)});
      },
      ()=>res(fallback),
      {enableHighAccuracy:true,timeout:6000,maximumAge:0});
  });
}

/* Watch our own position for a while and hand back a TRACK, not a point.
   One getCurrentPosition gives `speed:null` on most Android fixes (the
   fused provider only fills it from raw GNSS doppler) and -1 on iOS, so
   anything scaled by it silently became zero. Several fixes always give
   displacement, and displacement always gives velocity. */
function watchMe(ms,onFix){
  return new Promise(res=>{
    const fixes=[]; let id=null,done=false,timer=null;
    const finish=()=>{
      if(done) return; done=true;
      clearTimeout(timer);
      if(id!=null){ try{ navigator.geolocation.clearWatch(id); }catch(_){} }
      res(track(fixes));
    };
    timer=setTimeout(finish,ms);
    if(!navigator.geolocation){ finish(); return; }
    try{
      id=navigator.geolocation.watchPosition(p=>{
        const c=p.coords;
        if(!isFinite(c.latitude)||!isFinite(c.longitude)) return;
        rememberPos(p);
        fixes.push({lat:c.latitude,lng:c.longitude,acc:c.accuracy||0,
          speed:(isFinite(c.speed)&&c.speed>=0)?c.speed:null,
          heading:(isFinite(c.heading)&&c.heading>=0)?c.heading:null,
          t:(p.timestamp?p.timestamp/1000:Date.now()/1000)});
        if(onFix) onFix(fixes.length,fixes[fixes.length-1]);
        // enough spread to fit a line? don't make the rider wait out the timer
        if(fixes.length>=ONBOARD.trackMin&&
           (fixes[fixes.length-1].t-fixes[0].t)>=ms/1000*0.6) finish();
      },()=>finish(),{enableHighAccuracy:true,timeout:ms,maximumAge:0});
    }catch(_){ finish(); }
  });
}

/* Least-squares velocity through a set of fixes: fit east(t) and north(t)
   independently and take the slopes. Robust to the metre-scale jitter a
   single pair of fixes would turn into a wild vector. */
function fitVelocity(fixes){
  if(!fixes||fixes.length<2) return null;
  const o=fixes[0], t0=o.t;
  let n=0,st=0,stt=0,sx=0,sy=0,stx=0,sty=0;
  fixes.forEach(f=>{
    const d=vec(o,f), dt=f.t-t0;
    n++; st+=dt; stt+=dt*dt; sx+=d[0]; sy+=d[1]; stx+=dt*d[0]; sty+=dt*d[1];
  });
  const den=n*stt-st*st;
  if(!(Math.abs(den)>1e-6)) return null;
  return [(n*stx-st*sx)/den,(n*sty-st*sy)/den];
}

/* Roll a set of fixes up into {pos, v, speed, acc, fixes, ok}. */
function track(fixes){
  const list=(fixes||[]).slice().sort((a,b)=>a.t-b.t);
  const last=list[list.length-1]||null;
  const pos=last||{lat:here.lat,lng:here.lng,acc:999,speed:null,heading:null,t:Date.now()/1000};
  const span=list.length>1?(list[list.length-1].t-list[0].t):0;
  let v=null;
  // a fit needs both several fixes and a few seconds of them; otherwise
  // fall back to whatever the device volunteered on the last one
  if(list.length>=3&&span>=4) v=fitVelocity(list);
  if(!v&&list.length>=2&&span>=2){
    const d=vec(list[0],last); v=[d[0]/span,d[1]/span];
  }
  if(!v&&last&&last.speed!=null&&last.heading!=null){
    const rad=last.heading*Math.PI/180;
    v=[last.speed*Math.sin(rad),last.speed*Math.cos(rad)];   // heading is from north, clockwise
  }
  const accs=list.map(f=>f.acc).filter(a=>isFinite(a)&&a>0).sort((a,b)=>a-b);
  const acc=accs.length?accs[Math.floor(accs.length/2)]:(pos.acc||999);
  return { pos, v, speed:v?len(v):0, acc, fixes:list, span,
           ok:list.length>0&&acc<=ONBOARD.accMax };
}
/* metres east/north between two points — small-angle flat projection,
   which is plenty over the few dozen metres travelled in 6 seconds. */
function vec(a,b){
  const k=Math.cos(a.lat*Math.PI/180);
  return [(b.lng-a.lng)*111320*k,(b.lat-a.lat)*111320];
}
function len(v){ return Math.hypot(v[0],v[1]); }
function cosAngle(u,v){
  const l=len(u)*len(v);
  return l?((u[0]*v[0]+u[1]*v[1])/l):0;
}
/* The 100 m rule is against TRUE distance, but we only ever see two
   noisy estimates of it:
     · your GPS fix — tens of metres off in a street canyon;
     · the bus's telematics ping — refreshed every ~20-40 s, so a MOVING
       bus reports where it was, not where it is.
   That second error is the killer. At 30 km/h a 35 s-old fix sits ~290 m
   behind the bus, so the vehicle you are sitting in falls outside a
   100 m gate and never appears — while a bus stopped at the kerb, whose
   stale position has caught up with reality, does. Hence:

     while you are moving, the gate widens by exactly how far a bus
     travels during that staleness, and the decision of which candidate
     is YOURS is made on velocity, not distance (see matchBuses).

   Standing still the gate stays ~100 m, so the product rule — you can't
   flag a bus you're merely watching go past — is unchanged. */
/* How believable is "I am sitting inside that vehicle", in metres of
   doubt? Standing still we have nothing but distance. Moving, we split
   the gap between the bus's reported position and us into:
     along — displacement along OUR direction of travel. Positive means
             the bus is behind us, which is exactly what a stale fix
             looks like from on board, so it is nearly free.
     cross — sideways. A bus one street over has this no matter how
             stale it is, so it is charged in full.
   This is the inversion of the old behaviour: a bus 400 m behind us on
   our own street now outranks one 60 m away on a parallel one. */
function plausibility(at,me){
  const raw=haversine(at.lat,at.lng,me.pos.lat,me.pos.lng);
  if(!me.v||me.speed<ONBOARD.moveMs) return raw;
  const unit=[me.v[0]/me.speed,me.v[1]/me.speed];
  const off=vec(at,me.pos);                       // bus fix → me
  const along=off[0]*unit[0]+off[1]*unit[1];
  const cross=Math.hypot(off[0]-along*unit[0],off[1]-along*unit[1]);
  const reach=me.speed*ONBOARD.maxStaleS+120;     // furthest a stale fix can lag
  const lag=along<0 ? -along*1.5                  // ahead of us: not staleness
                    : Math.max(0,along-reach);    // behind us: free up to `reach`
  return cross+lag;
}

async function findMyBus(onProgress){
  const me=await watchMe(ONBOARD.trackMs,onProgress&&(n=>onProgress({phase:"fix",fixes:n})));
  if(!me.ok) return { me, p0:me.pos, t0:Date.now()/1000, list:[], badFix:true };
  if(onProgress) onProgress({phase:"scan"});
  const scan=await sampleBuses(me.pos);
  const near={};
  (scan.buses||[]).forEach(c=>{
    const d=haversine(c.lat,c.lng,me.pos.lat,me.pos.lng);
    if(d>ONBOARD.gateM) return;                   // the server's own trim, nothing tighter
    // the same vehicle can surface on two route variants — keep the closest
    if(!near[c.veh]||d<near[c.veh].d){
      near[c.veh]={...c,d,rawD:d,p0:{lat:c.lat,lng:c.lng},t0:c.ts||scan.generated};
    }
  });
  const list=Object.values(near).map(c=>{
    c.cost=plausibility(c,me); c.withYou=false; return c;
  }).sort(candOrder).slice(0,ONBOARD.shortlist);
  return { me, p0:me.pos, t0:scan.generated, list };
}
function candOrder(a,b){
  return (b.withYou?1:0)-(a.withYou?1:0) || a.cost-b.cost || a.d-b.d;
}

/* Two more looks, ~5.5 s apart. This is where the real decision happens.
 *
 * The insight: a stale feed shifts a bus's REPORTED POSITION, but not
 * the DIRECTION it is travelling. If you are on board, your track and the
 * bus's point the same way even when the reported positions are 300 m
 * apart — and direction, unlike speed, needs no knowledge of when the
 * feed's fixes were actually taken. So heading agreement is the primary
 * test and pace is applied only when OASA timestamps both ends.
 *
 * Three samples rather than two: a single 6 s baseline at walking-pace
 * speeds is barely larger than GPS noise, and OASA often repeats the
 * same fix across one interval and jumps across the next. Duplicated
 * fixes are dropped, so the baseline stretches to whatever the feed
 * actually gave us.
 *
 * onProgress fires after each round so the list re-ranks in front of the
 * rider instead of sitting still for 12 s. */
async function refineMyBus(cands,me0,t0,onProgress){
  const codes=[...new Set(cands.map(c=>String((c.route||{}).code||"")).filter(Boolean))].slice(0,6);
  const hist=new Map();
  cands.forEach(c=>hist.set(c.veh,[{lat:c.p0.lat,lng:c.p0.lng,ts:c.ts||null,t:c.t0||t0}]));
  let fixes=me0.fixes.slice();

  for(let round=1;round<ONBOARD.samples;round++){
    const seg=await watchMe(ONBOARD.sampleMs);
    fixes=fixes.concat(seg.fixes);
    const wall=Date.now()/1000;
    let scan;
    try{ scan=await sampleBuses(me0.pos,{fresh:true,routes:codes}); }catch(_){ scan=null; }
    if(scan) (scan.buses||[]).forEach(v=>{
      const h=hist.get(v.veh); if(!h) return;
      const prev=h[h.length-1];
      // an unchanged fix is not a new observation — recording it would
      // read as "this bus is parked" and destroy the baseline
      if(Math.abs(v.lat-prev.lat)<1e-7&&Math.abs(v.lng-prev.lng)<1e-7) return;
      h.push({lat:v.lat,lng:v.lng,ts:v.ts||null,t:Math.max(scan.generated||0,wall)});
    });
    const me=scoreCands(cands,hist,fixes);
    if(onProgress) onProgress(cands.slice().sort(candOrder),round,me);
  }
  return { list:cands.slice().sort(candOrder), me:track(fixes) };
}

/* Turn the accumulated position histories into a verdict per candidate.
   Returns the rider's own track. */
function scoreCands(cands,hist,fixes){
  const me=track(fixes);
  cands.forEach(c=>{
    const h=hist.get(c.veh)||[];
    const last=h[h.length-1]||c.p0;
    c.lat=last.lat; c.lng=last.lng;
    c.rawD=haversine(last.lat,last.lng,me.pos.lat,me.pos.lng);
    c.d=c.rawD; c.withYou=false; c.age=0;

    // nothing moved, or the feed never gave us a second distinct fix:
    // no velocity to compare, so no verdict — plausibility ranking stands
    if(h.length<2||!me.v||me.speed<ONBOARD.moveMs){
      c.cost=plausibility(last,me); return;
    }
    const first=h[0];
    const moved=vec(first,last), dist=len(moved);
    if(dist<ONBOARD.minMove){ c.cost=plausibility(last,me); return; }
    const dir=[moved[0]/dist,moved[1]/dist];

    /* Split the gap between the bus's reported position and me along its
       OWN direction of travel:
         along — what a stale fix looks like (the bus is behind itself)
         cross — what a DIFFERENT street looks like
       A stale fix inflates `along` and leaves `cross` at GPS-noise level;
       a bus one street over inflates `cross` however stale it is. */
    const off=vec(last,me.pos);
    const along=off[0]*dir[0]+off[1]*dir[1];
    const cross=Math.hypot(off[0]-along*dir[0],off[1]-along*dir[1]);
    c.cross=cross; c.along=along;

    /* Pace, and the dead-reckoning that follows it, both need to know how
       much real time the bus's displacement took. Only OASA's own stamps
       can tell us that — our sample interval is an upper bound on it, not
       a measurement. With stamps: compare speeds. Without: assume we are
       together, which makes the along-track lag itself the age of the fix. */
    let paceOK=true, busSpeed=me.speed;
    if(first.ts&&last.ts&&last.ts>first.ts){
      busSpeed=dist/(last.ts-first.ts);
      const ratio=Math.min(me.speed,busSpeed)/Math.max(me.speed,busSpeed);
      paceOK=ratio>ONBOARD.paceOK;
      c.age=Math.max(0,Math.min(ONBOARD.maxStaleS,(Date.now()/1000)-last.ts));
    }else{
      c.age=Math.max(0,Math.min(ONBOARD.maxStaleS,along/Math.max(busSpeed,0.5)));
    }
    const proj=project(last,[dir[0]*busSpeed,dir[1]*busSpeed],c.age);
    c.d=haversine(proj.lat,proj.lng,me.pos.lat,me.pos.lng);

    const cos=cosAngle(me.v,dir);
    const sameStreet=cross<=Math.max(ONBOARD.crossMax,me.acc||0);
    const reach=me.speed*ONBOARD.maxStaleS+150;
    const explainable=along>=-150&&along<=reach;
    c.agree=cos>ONBOARD.cosOK&&paceOK;
    c.withYou=c.agree&&sameStreet&&explainable;
    c.cost=cross+Math.max(0,along-reach);
  });
  return me;
}

/* move a point by a velocity vector (m/s, east/north) for `secs` */
function project(p,v,secs){
  const k=Math.cos(p.lat*Math.PI/180)||1;
  return { lat:p.lat+(v[1]*secs)/111320, lng:p.lng+(v[0]*secs)/(111320*k) };
}

/* -------------------- report form (2 steps) ------------------------ */
const reportForm={open:false};
const NOTICE_KEY="repNotice";
/* Shown once, before anyone's first report. It is the app's only
   acceptable-use statement at the point it actually matters, and it is
   also what makes "you are responsible for what you file" something the
   rider has read rather than something buried in the terms. */
function openReportForm(){
  if(!localStorage.getItem(NOTICE_KEY)){ firstReportNotice(); return; }
  reportFormBody();
}
function firstReportNotice(){
  const box=$("#rep-strip");
  reportForm.open=true;
  box.innerHTML=`<div class="field"><label>${t("firstH")}</label>
      <div class="note">${esc(t("firstP"))}</div></div>
    <button class="rep-cta" id="rf-ok" style="margin-top:12px">${t("agree")}</button>
    <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
  $("#rf-ok").onclick=()=>{
    try{ localStorage.setItem(NOTICE_KEY,"1"); }catch(_){}
    reportFormBody();
  };
  $("#rf-cancel").onclick=()=>{
    reportForm.open=false; drawReportMap(); renderReportList();
  };
}
function reportFormBody(){
  const box=$("#rep-strip");
  reportForm.open=true;
  // No category preselected: scanning for buses costs a burst of API
  // calls and a GPS fix, so nothing happens until the user says where
  // they are.
  let kind=null, target=null, type=null, busy=false;

  const close=()=>{ reportForm.open=false; drawReportMap(); renderReportList(); };
  const kindChips=()=>`<div class="field"><label>${t("reportWhere")}</label>
    <div class="chips" id="rf-kind">
      <button class="chip${kind==="bus"?" on":""}" data-k="bus">${t("onBus")}</button>
      <button class="chip${kind==="metro"?" on":""}" data-k="metro">${t("atMetro")}</button>
    </div></div>`;
  const wireKind=()=>box.querySelectorAll("#rf-kind .chip").forEach(c=>c.onclick=()=>{
    if(busy||c.dataset.k===kind) return;
    kind=c.dataset.k; type=TYPES_BY_KIND[kind][0]; target=null; step1();
  });

  /* ---- step 1: what are you on / at? ---- */
  function step1(){
    if(!kind){
      box.innerHTML=kindChips()+
        `<div class="note">${t("pickWhere")}</div>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-cancel").onclick=close;
      return;
    }
    box.innerHTML=kindChips()+
      `<div class="note" id="rf-body">${kind==="bus"?t("scanBus"):t("searching")}</div>
       <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
    wireKind(); $("#rf-cancel").onclick=close;
    kind==="bus"?pickBus():pickMetro();
  }

  async function pickBus(){
    busy=true;
    const myKind=kind;
    const alive=()=>reportForm.open&&kind===myKind;
    const note=txt=>{ const b=$("#rf-body"); if(b) b.textContent=txt; };
    let found=null, me=null;
    try{
      found=await findMyBus(p=>{ if(alive()) note(p.phase==="scan"?t("scanBus"):t("gpsFix")); });
    }catch(_){ found=null; }
    busy=false;
    if(!alive()) return;

    // A vague fix can't identify anything; say so instead of scanning and
    // then blaming the feed for the empty list it was always going to give.
    if(!found||found.badFix){
      box.innerHTML=kindChips()+
        `<div class="note">${t("gpsWeak")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      return;
    }
    if(!found.list.length){
      box.innerHTML=kindChips()+
        `<div class="note">${t("noBusNear")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      return;
    }
    const cands=found.list;
    me=found.me;
    drawCands(cands.slice().sort(candOrder),1);
    // further opinions arrive every few seconds and re-rank in place
    refineMyBus(cands,found.me,found.t0,(list,round,mNow)=>{
      me=mNow||me;
      if(alive()&&!target) drawCands(list,round+1);
    }).then(res=>{
      me=res.me||me;
      if(alive()&&!target) drawCands(res.list,ONBOARD.samples);
    }).catch(()=>{});

    function drawCands(list,round){
      const pending=round<ONBOARD.samples;
      box.innerHTML=kindChips()+
        `<div class="field"><label>${t("confirmBus")}</label>
          <div class="cands" id="rf-cands">${list.map((c,i)=>{
            const dest=destOf((LANG==="en"?(c.route.en||c.route.el):(c.route.el||c.route.en))||"");
            return `<button class="cand${c.withYou?" hot":""}" data-i="${i}">
              <span class="cand-tile num">${esc(c.route.id||"")}</span>
              <span class="cand-txt"><span class="cand-dest">${esc(dest)}</span>
                <span class="cand-meta">${fmtDist(c.d)}${c.withYou?` · ✓ ${t("withYou")}`:""}</span></span>
            </button>`; }).join("")}</div></div>
         <div class="shint">${pending?t("scanRefine"):t("onboardNote")}</div>
         <button class="ghost" id="rf-again">${t("rescan")}</button>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-again").onclick=step1; $("#rf-cancel").onclick=close;
      box.querySelectorAll(".cand").forEach(b=>b.onclick=()=>{
        const c=list[+b.dataset.i];
        target={ id:c.veh, name:destOf((LANG==="en"?(c.route.en||c.route.el):(c.route.el||c.route.en))||""),
          lineId:c.route.id||"", routeCode:c.route.code, veh:c.veh, lat:c.lat, lng:c.lng };
        step2();
      });
    }
  }

  async function pickMetro(){
    busy=true; await loadMetro(); busy=false;
    if(!reportForm.open||kind!=="metro") return;
    const near=(state.metro||[]).map(m=>({...m,d:haversine(m.lat,m.lng,here.lat,here.lng)}))
      .filter(m=>m.d<=ONBOARD.metroRadius).sort((a,b)=>a.d-b.d);
    if(!near.length){
      box.innerHTML=kindChips()+
        `<div class="note">${t("noMetroNear")}</div>
         <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
      wireKind(); $("#rf-cancel").onclick=close; return;
    }
    box.innerHTML=kindChips()+
      `<div class="field"><label>${t("nearestStation")}</label>
        <div class="cands" id="rf-cands">${near.map((m,i)=>`
          <button class="cand" data-i="${i}"><span class="cand-tile">Ⓜ</span>
            <span class="cand-txt"><span class="cand-dest">${esc(LANG==="en"?(m.name_en||m.name):m.name)}</span>
              <span class="cand-meta">${esc(m.lines.map(l=>"M"+l).join(" · "))} · ${fmtDist(m.d)}</span></span>
          </button>`).join("")}</div></div>
       <div class="shint">${t("metroNote")}</div>
       <button class="ghost" id="rf-cancel">${t("cancel")}</button>`;
    wireKind(); $("#rf-cancel").onclick=close;
    box.querySelectorAll(".cand").forEach(b=>b.onclick=()=>{
      const m=near[+b.dataset.i];
      target={ id:m.id, name:(LANG==="en"?(m.name_en||m.name):m.name)||"",
        lineId:m.lines.map(l=>"M"+l).join("/"), routeCode:null, veh:null,
        lat:m.lat, lng:m.lng };
      step2();
    });
  }

  /* ---- step 2: what's happening? One flat row of chips in the order
     TYPES_BY_KIND lists them — the things that stop you travelling come
     before the things that merely tell you what to expect. */
  function step2(){
    const types=TYPES_BY_KIND[kind]||[];
    if(!types.includes(type)) type=types[0];
    const chips=types.map(x=>
      `<button class="chip${x===type?" on":""}" data-t="${x}">${esc(issueLabel(x))}</button>`
    ).join("");
    box.innerHTML=`
      <div class="field"><label>${kind==="bus"?t("onBus"):t("atMetro")}</label>
        <div class="picked"><span class="cand-tile num">${esc(target.lineId||"Ⓜ")}</span>
          <span class="cand-dest">${esc(target.name||target.id)}</span></div></div>
      <div id="rf-type"><div class="field"><label>${t("catWhat")}</label>
        <div class="chips">${chips}</div></div></div>
      <button class="rep-cta" id="rf-send" style="margin-top:14px">${t("send")}</button>
      <button class="ghost" id="rf-back">${t("back")}</button>
      <div class="note" id="rf-msg" style="display:none"></div>`;
    box.querySelectorAll("#rf-type .chip").forEach(c=>c.onclick=()=>{
      type=c.dataset.t;
      box.querySelectorAll("#rf-type .chip").forEach(x=>x.classList.toggle("on",x===c));
    });
    $("#rf-back").onclick=()=>{ target=null; step1(); };
    $("#rf-send").onclick=send;
  }

  async function send(){
    const btn=$("#rf-send"), msg=$("#rf-msg");
    if(!target) return;
    btn.disabled=true; btn.textContent="…";
    const fail=txt=>{ msg.style.display=""; msg.textContent=txt;
      btn.disabled=false; btn.textContent=t("send"); };
    try{
      const res=await fetch(base()+"/reports",{method:"POST",cache:"no-store",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ by:myId(), kind, type,
          targetId:target.id, targetName:target.name, lineId:target.lineId,
          routeCode:target.routeCode, veh:target.veh, lat:target.lat, lng:target.lng })});
      let j={}; try{ j=await res.json(); }catch(_){}
      if(!res.ok){ fail(j.error||("HTTP "+res.status)); return; }
      reportForm.open=false;
      await refreshReports(); await refreshFlagPositions();
      drawReportMap(); renderReportList(); renderView();
    }catch(e){ fail(String((e&&e.message)||e)); }
  }

  step1();
}

/* ------------------------ line lookup ------------------------------ */
async function loadLines(){
  if(state.lines&&state.lines.length) return state.lines;
  if(hasBackend()){
    try{ const r=await fetch(base()+"/lines",{cache:"no-store"});
      if(r.ok){ const j=await r.json(); if(Array.isArray(j)&&j.length){ state.lines=j; return j; } } }catch(_){}
  }
  // no backend (or the endpoint failed): go straight to OASA
  const raw=await oasa("webGetLines").catch(()=>null);
  state.lines=(Array.isArray(raw)?raw:[]).map(l=>({
    code:String(pick(l,"LineCode","line_code")||""),
    id:String(pick(l,"LineID","line_id")||""),
    el:pick(l,"LineDescr","line_descr")||"", en:pick(l,"LineDescrEng","line_descr_eng")||"",
  })).filter(l=>l.code&&l.id);
  return state.lines;
}
function openLineSearch(){
  toggleMenu(false);
  $("#ln-h").textContent=t("lineH"); $("#ln-p").textContent=t("lineP");
  $("#lnq").placeholder=t("linePh");
  $("#lnres").innerHTML="";
  $("#linebg").classList.add("on");
  $("#lnq").value=""; setTimeout(()=>$("#lnq").focus(),80);
  loadLines();
}
function closeLineSearch(){ $("#linebg").classList.remove("on"); }
/* "22" should find 022 and Α22 but not 220 — so: exact, then prefix,
   then anywhere, and only fall back to the description text after that. */
function matchLines(lines,q){
  const s=q.trim().toLowerCase();
  if(!s) return [];
  const norm=x=>String(x||"").toLowerCase().replace(/^0+/,"");
  const ns=norm(s);
  const score=l=>{
    const id=l.id.toLowerCase(), nid=norm(id);
    if(id===s||nid===ns) return 0;
    if(id.startsWith(s)||nid.startsWith(ns)) return 1;
    if(id.includes(s)) return 2;
    if((l.el+" "+l.en).toLowerCase().includes(s)) return 3;
    return 9;
  };
  return lines.map(l=>({l,r:score(l)})).filter(x=>x.r<9)
    .sort((a,b)=>a.r-b.r||String(a.l.id).localeCompare(String(b.l.id),undefined,{numeric:true}))
    .slice(0,25).map(x=>x.l);
}
/* One field, two kinds of answer: lines (matched against the cached
   catalogue) and stops. OASA has no stop-name search, so stops come from
   the Worker's /stops/search, which geocodes the query and returns the
   stops around that place — plus anything matching among the stops
   already loaded around you, which needs no request at all. */
function localStopMatches(q){
  const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const n=norm(q);
  if(!n) return [];
  const pool=(state.stops||[]).concat(Object.values(state.favLive||{}));
  const seen={},out=[];
  pool.forEach(s=>{
    const key=String(s.code);
    if(seen[key]) return;
    if(norm(s.name_el).includes(n)||norm(s.name_en).includes(n)||norm(s.street).includes(n)){
      seen[key]=1; out.push(s);
    }
  });
  return out.sort((a,b)=>(a.dist||0)-(b.dist||0)).slice(0,6);
}
/* "No line by that name" is only true if we actually looked. Offline, or
   with the service unreachable, the honest answer is that we could not,
   and with no location fix the local match had nothing to match against.
   Saying the wrong one of these sends people hunting for a typo. */
function emptyMsg(netFail,fallback){
  if(navigator.onLine===false) return t("offline");
  if(netFail) return t("netErr");
  if(!hasBackend()&&!here.gps) return t("noFix");
  return t(fallback);
}
async function doLineSearch(){
  const box=$("#lnres"), q=$("#lnq").value;
  if(!q.trim()) return;
  box.innerHTML=`<div class="res-msg">${t("searching")}</div>`;

  const lines=await loadLines();
  const lineHits=matchLines(lines,q);
  const localStops=localStopMatches(q);

  let remoteStops=[], netFail=false;
  if(hasBackend()){
    try{
      const r=await fetch(`${base()}/stops/search?q=${encodeURIComponent(q)}`,{cache:"no-store"});
      if(r.ok){ const j=await r.json(); remoteStops=Array.isArray(j.stops)?j.stops:[]; }
      else netFail=true;
    }catch(_){ netFail=true; }
  }
  // de-dupe: a stop we already hold locally wins (it has live arrivals)
  const haveLocal={}; localStops.forEach(s=>{ haveLocal[String(s.code)]=1; });
  const stopHits=localStops.concat(remoteStops.filter(s=>!haveLocal[String(s.code)]))
    .slice(0,8);

  if(!lineHits.length&&!stopHits.length){
    box.innerHTML=`<div class="res-msg">${esc(emptyMsg(netFail||!lines.length,"noLine"))}</div>`;
    return;
  }
  box.innerHTML="";
  if(lineHits.length){
    const h=document.createElement("div"); h.className="sec-label";
    h.textContent=t("secLines"); box.appendChild(h);
  }
  lineHits.forEach(l=>{
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`<b class="num">${esc(l.id)}</b> · ${esc((LANG==="en"?(l.en||l.el):(l.el||l.en))||"")}`;
    b.onclick=()=>pickLineDirection(l);
    box.appendChild(b);
  });
  if(stopHits.length){
    const h=document.createElement("div"); h.className="sec-label";
    h.textContent=t("secStops"); box.appendChild(h);
  }
  stopHits.forEach(raw=>{
    const s=adoptStop(raw);
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`${isFav(s.code)?'<span class="star">★</span> ':""}🚏 ${esc(stopName(s))}`
      +(isFinite(s.dist)?` <span style="color:var(--ink3)">· ${fmtDist(s.dist)}</span>`:"");
    /* The results stay open underneath. Picking a stop used to close the
       search, so deciding it was the wrong stop meant typing the query
       again; now closing the card puts you back in the list you were
       choosing from. */
    b.onclick=()=>openStopCard(s);
    box.appendChild(b);
  });
}
/* Turn a search result into a full stop object we can load arrivals
   into — reusing the live one if we already track that code. */
function adoptStop(raw){
  const key=String(raw.code);
  const existing=(state.stops||[]).find(s=>String(s.code)===key)||state.favLive[key];
  if(existing) return existing;
  const s={code:key,name_el:raw.name_el||"",name_en:raw.name_en||"",street:raw.street||"",
    lat:Number(raw.lat),lng:Number(raw.lng),
    dist:(isFinite(raw.lat)&&isFinite(here.lat))?haversine(here.lat,here.lng,Number(raw.lat),Number(raw.lng)):NaN,
    lines:[],routes:[],routeMap:{},arrivals:[],routesLoaded:false,arrLoaded:false};
  state.favLive[key]=s;      // keep it around so favouriting works
  return s;
}
/* A line has two directions (and sometimes more variants); each is its
   own route code, and a route code is what the preview needs. */
async function pickLineDirection(line){
  const box=$("#lnres");
  box.innerHTML=`<div class="res-msg">${t("searching")}</div>`;
  const raw=await oasa("getRoutesForLine",line.code).catch(()=>null);
  const routes=(Array.isArray(raw)?raw:[]).map(r=>({
    code:String(pick(r,"RouteCode","route_code")||""),
    el:pick(r,"RouteDescr","route_descr")||line.el,
    en:pick(r,"RouteDescrEng","route_descr_eng")||line.en,
  })).filter(r=>r.code);
  if(!routes.length){ box.innerHTML=`<div class="res-msg">${t("noRoute")}</div>`; return; }
  const show=r=>{ closeLineSearch();
    openRoutePreview(null,r.code,null,{line:line.id,el:r.el,en:r.en}); };
  if(routes.length===1){ show(routes[0]); return; }
  box.innerHTML=`<div class="res-msg">${t("pickDir")}</div>`;
  routes.slice(0,6).forEach(r=>{
    const b=document.createElement("button"); b.className="res";
    b.innerHTML=`<b class="num">${esc(line.id)}</b> · ${esc(destOf((LANG==="en"?(r.en||r.el):(r.el||r.en))||""))}`;
    b.onclick=()=>show(r);
    box.appendChild(b);
  });
}

/* ---------------------- live bus map -------------------------------
 * "Every bus in Athens" is more subrequests than a Worker gets in one
 * go, so the map is honest about it: it loads the lines around the map
 * centre and draws every vehicle running on them. Pan and hit ↻ to load
 * another area. */
let lmap=null,llayer=null,liveBusy=false;
function openLiveMap(){
  toggleMenu(false);
  $("#live").classList.add("on");
  $("#live-title").textContent=t("liveH");
  if(!lmap){
    lmap=L.map("livemap",{zoomControl:true}).setView([here.lat,here.lng],14);
    addTiles(lmap);
    llayer=L.layerGroup().addTo(lmap);
  }
  $("#live-hint").innerHTML=`<div class="shint">${t("liveHint")}</div>`;
  setTimeout(()=>lmap.invalidateSize(),70);
  loadLive();
}
function closeLiveMap(){ $("#live").classList.remove("on"); }
async function loadLive(){
  if(liveBusy||!lmap) return;
  liveBusy=true;
  $("#live-sub").textContent=t("liveLoading");
  const c=lmap.getCenter();
  let buses=[];
  try{
    if(hasBackend()){
      const r=await fetch(`${base()}/live?lat=${c.lat.toFixed(4)}&lng=${c.lng.toFixed(4)}`,{cache:"no-store"});
      if(r.ok){ const j=await r.json(); buses=Array.isArray(j.buses)?j.buses:[]; }
    } else {
      // no backend: fan out over the routes we already know about
      const routes=[]; (state.stops||[]).forEach(s=>(s.routes||[]).forEach(x=>{
        if(!routes.some(y=>y.code===x.code)) routes.push(x); }));
      await withLimit(routes.slice(0,10).map(rt=>async()=>{
        const arr=await oasa("getBusLocation",rt.code).catch(()=>null);
        (Array.isArray(arr)?arr:[]).forEach(v=>buses.push({
          veh:String(pick(v,"VEH_NO","veh_no")||""), line:rt.id, routeCode:rt.code,
          el:rt.el, en:rt.en,
          lat:Number(pick(v,"CS_LAT","cs_lat")), lng:Number(pick(v,"CS_LNG","cs_lng"))}));
      }),5);
    }
  }catch(_){}
  llayer.clearLayers();
  L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:900}).addTo(llayer);
  let n=0;
  buses.forEach(v=>{
    if(!isFinite(v.lat)||!isFinite(v.lng)) return;
    n++;
    const dest=destOf((LANG==="en"?(v.en||v.el):(v.el||v.en))||"");
    L.marker([v.lat,v.lng],{icon:L.divIcon({className:"",
      html:`<div class="livebus num">${esc(v.line||"")}</div>`,iconSize:[30,20],iconAnchor:[15,10]})})
      .addTo(llayer).bindTooltip(`${esc(v.line||"")}${dest?" · "+esc(dest):""}`,{direction:"top"});
  });
  $("#live-sub").textContent = n?t("liveCount")(n):t("liveNone");
  liveBusy=false;
}

/* --------------------------- onboarding ---------------------------- *
 * Five cards on first run. Each one names a control or a gesture that is
 * otherwise invisible, which is why the permanent hint line under the list
 * could go away. Skippable at any point and shown exactly once — the FAQ
 * carries the same ground for anyone who wants to read it again. */
const TOUR_KEY="tourSeen";
/* Bumped when the cards change enough that someone who saw the old set has
   not seen this one. The flag stores the version rather than a bare "1", so
   a bump shows the carousel once more and then goes quiet again. */
const TOUR_VER="2";
/* The art on each card is the REAL control, not a grey glyph standing in
   for it. A card that says "tap the orange dot" over a black ◉ is asking
   you to translate before you can look, and the thing you are then hunting
   for on screen is a different colour and shape from the thing you were
   shown. These are built from the same classes the app uses, so they
   cannot drift from it either. */
const TOUR=[
  {art:`<span class="livedot art-dot"></span>`,      h:"tour1h", p:"tour1p"},
  {art:`<span class="art-star">★</span>`,            h:"tour2h", p:"tour2p"},
  {art:`<span class="art-seg"><b></b><i></i></span>`, h:"tour3h", p:"tour3p"},
  {art:`<span class="iconbtn art-plan"><span class="ab">A<i></i>B</span></span>`,
                                                     h:"tour6h", p:"tour6p"},
  {art:`<span class="art-bell">🔔</span>`,           h:"tour4h", p:"tour4p"},
  {art:`<span class="mark art-mark">OASA</span>`,    h:"tour5h", p:installCard, html:true},
];
let tourAt=0;

/* ---------------------- installing it as an app --------------------- *
 * Chrome and Edge hand us the install prompt themselves; when they do,
 * the card offers a button that installs in one tap and no instructions
 * are needed. Everywhere else there is no such API and the steps live in
 * a browser menu, so the card has to name them — for the device in your
 * hand, not for all four at once. */
let installEvt=null;
addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); installEvt=e;
  if(!$("#tour").hidden) paintTour();          // upgrade the card if it is open
});
addEventListener("appinstalled",()=>{ installEvt=null; pulse("install"); });

/* One beacon per cold boot, so the operator can tell whether anyone is
   using this. It carries a single word — "the app was opened", and
   whether from a home-screen icon or a browser tab — and the server
   stores nothing but a running total for the day. No id, no session, no
   coordinates: it cannot tell two opens by one person from one open each
   by two, and is not meant to. Fire-and-forget; a failure is silent and
   costs the rider nothing. */
async function pulse(ev){
  try{
    await ensureMode();
    if(!hasBackend()) return;                  // nothing to count against
    const q=ev==="install" ? "?ev=install" : `?mode=${isStandalone()?"app":"web"}`;
    fetch(base()+"/pulse"+q,{method:"POST",cache:"no-store",keepalive:true}).catch(()=>{});
  }catch(_){}
}

function isStandalone(){
  try{
    return matchMedia("(display-mode: standalone)").matches
      || matchMedia("(display-mode: window-controls-overlay)").matches
      || navigator.standalone === true;        // iOS Safari's own flag
  }catch(_){ return false; }
}
/* Coarse on purpose. Getting this wrong shows someone the steps for the
   wrong menu, which is annoying; the "elsewhere" line under it is the
   safety net, and it is always there. */
function platformKey(){
  const ua=navigator.userAgent||"";
  const iOS=/iPad|iPhone|iPod/.test(ua)
    || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1);   // iPadOS lies
  if(/Firefox|FxiOS/.test(ua)) return "instFirefox";
  if(iOS) return "instIOS";
  if(/Android/.test(ua)) return "instAndroid";
  if(/Macintosh/.test(ua) && /Safari/.test(ua) && !/Chrome|Chromium|Edg/.test(ua)) return "instMac";
  return "instDesktop";
}
function installCard(){
  if(isStandalone()) return `<b>${esc(t("instDone"))}</b>`;
  const steps=installEvt
    ? `<button class="tourinstall" id="tour-install">${esc(t("instBtn"))}</button>`
    : `<span class="inst-steps">${t(platformKey())}</span>`;
  return `${esc(t("instWhy"))}<div class="inst">${steps}</div>
    <div class="inst-other">${esc(t("instOther"))}</div>`;
}

/* ====================== journey planning (A → B) ==================== *
 * The Worker does the routing; this end picks the two ends, renders the
 * itineraries, and is honest about which numbers are measured and which
 * are modelled. The distinction is per leg, not per journey, because a
 * trip is routinely half of each: a live ETA for the bus you are about to
 * catch, an estimate for the train you will change onto in forty minutes.
 * ------------------------------------------------------------------ */
const jp = { from: null, to: null, res: null, picking: null, map: null, layer: null, busy: false };

function jpPlaceLabel(p) {
  if (!p) return null;

  return p.label || "";
}

}
function openJourney() {
  toggleMenu(false);
  $("#jp-title").textContent = t("jpH");
  $("#jp-sub").textContent = "";
  if (!jp.from && here && isFinite(here.lat)) jp.from = { kind: "me", lat: here.lat, lng: here.lng };
  paintJourneyForm();
  $("#jp").classList.add("on");
  paintSeg();                       // after the class, or it paints the old state
  loadMetro().catch(() => {});      // so stations are searchable in the picker
}
function closeJourney() { $("#jp").classList.remove("on"); paintSeg(); }
/* The segment keeps showing which board is underneath — the journey panel
   sits on top of it, it does not replace it — and the header button lights
   up while that panel is open. */
function paintSeg() {
  const onPlan = $("#jp") && $("#jp").classList.contains("on");
  $("#planbtn").classList.toggle("on", onPlan);
  $("#t-vlist").classList.toggle("on", state.view === "list");
  $("#t-vmap").classList.toggle("on", state.view === "map");

/* ------------------------- home and work ---------------------------- *
 * Two slots, because two of them cover almost every journey anyone plans
 * twice. They live at the top of the picker, so the common case is one
 * tap rather than a search, and they are cleared by long-press — the same
 * gesture that unpins a favourite, so there is one thing to learn rather
 * than two.
 *
 * Stored per browser, like everything else here; nothing about where you
 * live leaves the device. That is also why they are set from a place you
 * have already picked rather than from a separate address form: the app
 * never needs to know more than the point you chose. */
const SLOTS=[{id:"home",icon:"🏠",set:"slotSetHome",name:"slotHome"},
             {id:"work",icon:"💼",set:"slotSetWork",name:"slotWork"}];
const slotKey=id=>"slot:"+id;
function readSlot(id){
  try{ const v=JSON.parse(localStorage.getItem(slotKey(id))||"null");
    return (v&&isFinite(v.lat)&&isFinite(v.lng))?v:null; }catch(_){ return null; }
}
function writeSlot(id,place){
  try{
    if(place) localStorage.setItem(slotKey(id),JSON.stringify(
      {lat:Number(place.lat),lng:Number(place.lng),label:place.label||""}));
    else localStorage.removeItem(slotKey(id));
  }catch(_){}
}
/* Which slot, if any, the next choice should be saved into. Set by
   tapping an empty slot; cleared as soon as it is used or the picker
   closes, so it can never quietly capture an unrelated search. */
let slotArming=null;
function addPlaceSlots(add){
  for(const sl of SLOTS){
    const v=readSlot(sl.id);
    if(v){
      const row=add(`${sl.icon} ${t(sl.name)}`,
        {kind:"slot",lat:v.lat,lng:v.lng,label:v.label||t(sl.name)},v.label||"");
      // long-press clears it, exactly as it unpins a favourite
      if(row) onLongPress(row,()=>{ writeSlot(sl.id,null); toast(t("slotCleared")(t(sl.name)));
        jpPickResults($("#jpp-q").value); });
    } else {
      const row=add(`${sl.icon} ${t(sl.set)}`,null);
      if(row) row.onclick=()=>{ slotArming=sl.id; paintSlotArming(); };
    }
  }
}
function paintSlotArming(){
  const sl=SLOTS.find(x=>x.id===slotArming);
  $("#jpp-h").textContent=sl?t("slotPick")(t(sl.name)):t("jpPickH");
  $("#jppick").classList.toggle("arming",!!sl);
}

/* Type-ahead pacing. The geocoder behind /geocode matches partial words,
   so three characters is already a useful query — but every miss costs a
   request against a daily quota, hence the debounce. Stops, favourites
   and metro stations are matched locally and appear with no delay at all,
   from the first character. Documented in PARAMETERS.md. */
/* Walking legs routed when an itinerary is opened. Matches the server's
   own per-plan ceiling, so looking at every option costs no more than
   planning would have. */
const JP_WALK_MAX = 4;
const JPQ = { minChars: 3, debounceMs: 260, minGapMs: 700, memo: 40 };
const jpq = { seq: 0, ctrl: null, last: 0, seen: new Map() };

/* Both ends are picked the same way, and from everything the app already
   knows how to name: where you are, your favourites, the stops around you,
   every metro station, and failing all that the geocoder. */
function openJourneyPick(which) {
  jp.picking = which;
  slotArming = null;
  $("#jpp-h").textContent = t("jpPickH");
  $("#jpp-q").placeholder = t("jpPickPh");
  $("#jpp-q").value = "";
  paintSlotArming();
  jpPickResults("");
  $("#jppick").classList.add("on");
  setTimeout(() => $("#jpp-q").focus(), 80);
}
function closeJourneyPick() {
  $("#jppick").classList.remove("on"); jp.picking = null;
  slotArming = null; $("#jppick").classList.remove("arming");
  jpq.seq++;                                    // orphan anything still in flight
  if (jpq.ctrl) { jpq.ctrl.abort(); jpq.ctrl = null; }
}
function jpChoose(place) {
  if (!place) return;
  /* Setting a slot and using a place are the same act, deliberately: you
     pick where home is by picking it, and it is also where you are going
     this time. One flow, no separate address form to fill in twice. */
  if (slotArming) {
    const sl = SLOTS.find(x => x.id === slotArming);
    writeSlot(slotArming, place);
    toast(t("slotSaved")(t(sl.name)));
    slotArming = null;
  }
  if (jp.picking === "to") jp.to = place; else jp.from = place;
  closeJourneyPick(); paintJourneyForm();
}
async function jpPickResults(q) {
  const box = $("#jpp-res");
  /* One place, one row. The same corner reaches this list from three
     directions — a loaded stop, a metro station and the geocoder all know
     "Σύνταγμα" — and before this it was listed three times, which made the
     list look broken and buried the rows that were actually different.
     Keyed on the name AND the position, because two stops genuinely can
     share a name on opposite sides of a road, and those are not the same
     place to walk to. */
  const seen = new Set();
  /* Two kinds of duplicate, needing two different keys.
     A POINT reached from several sources — the stop list has "ΣΥΝΤΑΓΜΑ",
     the metro list has "SYNTAGMA", the geocoder has "Σύνταγμα, Αθήνα" —
     is one place at one position, so points are keyed on WHERE. Four
     decimals is about eleven metres: enough to fuse a station with the
     geocoded point on top of it, fine enough to keep number 12 and number
     14 apart.
     A STREET is not a point. OpenStreetMap holds a long road as several
     ways, each with its own midpoint and — because different people typed
     them — sometimes its own capitalisation, which is how one road came
     back as "φιλοτιμου, Πολύγωνο" and "ΦΙΛΟΤΙΜΟΥ, Πολύγωνο". Those are
     keyed on the NAME instead, folded past case and accents, so the
     segments merge while Φιλοτίμου in another neighbourhood stays its own
     row — which is the thing you actually need to choose between. */
  const key = (label, place, byName) => {
    if (byName) return "name:" + fold(label);
    return place && isFinite(place.lat)
      ? place.lat.toFixed(4) + "," + place.lng.toFixed(4)
      : "label:" + fold(label);
  };
  const add = (label, place, note, byName) => {
    /* Anchors are exempt. "My location", Home and Work are not places the
       search found, they are places you named, and they keep their row
       even when something else sits on the same spot — standing at a stop
       must not delete that stop from the list of things you can travel
       to. Only discovered rows — stops, stations, geocoder hits — are
       candidates for being the same place twice. */
    const anchor = place && (place.kind === "me" || place.kind === "slot");
    const k = key(label.replace(/^\S+\s/, ""), place, byName);  // glyph is not the name
    if (!anchor) {
      if (seen.has(k)) return;
      seen.add(k);
    }
    const b = document.createElement("button");
    b.className = "res";
    b.innerHTML = esc(label) + (note ? ` <span style="color:var(--ink3)">· ${esc(note)}</span>` : "");
    b.onclick = () => jpChoose(place);
    box.appendChild(b);
    return b;
  };
  box.innerHTML = "";
  const query = q.trim().toLowerCase();

  if (!query) {
    if (here && isFinite(here.lat)) add(t("jpMyLoc"), { kind: "me", lat: here.lat, lng: here.lng });
    addPlaceSlots(add);
    favs.slice(0, 4).forEach(f => {
      const s2 = state.favLive[String(f.code)] || byCode(f.code) || f;
      if (isFinite(s2.lat)) add("★ " + stopName(s2), { kind: "stop", lat: s2.lat, lng: s2.lng, label: stopName(s2) });
    });
    state.stops.slice(0, 4).forEach(s2 => add("🚏 " + stopName(s2),
      { kind: "stop", lat: s2.lat, lng: s2.lng, label: stopName(s2) }, fmtDist(s2.dist)));
    return;
  }

  // stations and loaded stops match instantly, with no request at all
  const norm = x => String(x || "").toLowerCase();
  (state.metro || []).filter(m => norm(m.name).includes(query) || norm(m.name_en).includes(query))
    .slice(0, 5).forEach(m => add("Ⓜ " + (LANG === "en" ? (m.name_en || m.name) : m.name),
      { kind: "metro", lat: m.lat, lng: m.lng, label: LANG === "en" ? (m.name_en || m.name) : m.name }));
  localStopMatches(query).slice(0, 4).forEach(s2 => add("🚏 " + stopName(s2),
    { kind: "stop", lat: s2.lat, lng: s2.lng, label: stopName(s2) }));

  /* "nothing found" only when nothing at all is on screen — a local stop
     match still counts, even if the geocoder came back empty. */
  const noneMsg = failed => {
    if (box.children.length) return;
    const m = document.createElement("div");
    m.className = "res-msg";
    m.textContent = navigator.onLine === false ? t("offline")
      : failed ? t("netErr") : t("noResults");
    box.appendChild(m);
  };
  // geocoder rows, under whatever the local matches already put up
  const addAddrs = rows => (rows || []).slice(0, 8).forEach(it => {
    const lab = placeLabel(it);
    const la = Number(it.lat), ln = Number(it.lon != null ? it.lon : it.lng);
    if (!lab || !isFinite(la) || !isFinite(ln)) return;
    /* `precision` comes from the geocoder, not from guessing at fields.
       A STREET is a whole road — many ways, many midpoints — so its
       duplicates are found by name; a building or a square is one place
       at one position. The note fires only when a number was asked for
       and only the road came back, because "the street, not the number
       you wanted" is the difference between an answer and a near miss —
       and OpenStreetMap has no number on a great many Athens roads, so
       that near miss is common and worth naming rather than hiding. */
    const isStreet = it.precision === "street";
    const note = it.precision === "interpolated" ? t("addrApprox")
      : isStreet && it.wantedNumber ? t("addrStreetOnly") : "";
    add("📍 " + lab, { kind: "addr", lat: la, lng: ln, label: lab }, note, isStreet);
  });

  if (query.length < JPQ.minChars) return;

  /* One address request may be in flight at a time. A newer keystroke
     aborts the older one, and the seq check throws away anything that
     still lands late — otherwise a slow "syn" overwrites a fast
     "syntagma" and the list argues with what you just typed. */
  const seq = ++jpq.seq;
  if (jpq.ctrl) jpq.ctrl.abort();
  jpq.ctrl = ("AbortController" in window) ? new AbortController() : null;

  /* Backspacing is the commonest thing anyone does in a search box, and it
     walks back through queries this session already has answers for. Serve
     those from memory: no request, no wait, no quota. */
  if (jpq.seen.has(query)) { addAddrs(jpq.seen.get(query)); noneMsg(false); return; }

  /* A floor between address requests, on top of the debounce. Someone
     typing steadily at just over debounceMs fires one per keystroke
     otherwise — measured at seven for a nine-letter street. Waiting out
     the remainder of the gap gives the next keystroke a chance to
     supersede this request before it is ever sent. */
  const gap = JPQ.minGapMs - (Date.now() - jpq.last);
  if (gap > 0) {
    await new Promise(r => setTimeout(r, gap));
    if (seq !== jpq.seq) return;          // a newer keystroke won; never sent
  }
  jpq.last = Date.now();

  const msg = document.createElement("div");
  msg.className = "res-msg"; msg.textContent = t("searching"); box.appendChild(msg);
  let items = [], failed = false;
  try {
    items = await geocode(q, {
      focus: (here && isFinite(here.lat)) ? here : null,
      signal: jpq.ctrl ? jpq.ctrl.signal : null,
    });
  } catch (e) {
    if (e && e.name === "AbortError") return;   // superseded, leave the DOM alone
    failed = true;
  }
  if (seq !== jpq.seq) return;
  msg.remove();
  if (!failed) {
    jpq.seen.set(query, items);
    // oldest first in a Map, so this drops the least recently asked
    while (jpq.seen.size > JPQ.memo) jpq.seen.delete(jpq.seen.keys().next().value);
  }
  addAddrs(items);
  noneMsg(failed);
}

async function runJourney() {
  if (!jp.from || !jp.to || jp.busy) return;
  jp.busy = true; paintJourneyForm();
  const out = $("#jp-out");
  out.innerHTML = `<div class="res-msg">${esc(t("jpSearching"))}</div>`;
  try {
    const u = `${base()}/plan?from=${jp.from.lat},${jp.from.lng}&to=${jp.to.lat},${jp.to.lng}`;
    const r = await fetch(u, { cache: "no-store" });
    if (!r.ok) throw new Error("plan " + r.status);
    jp.res = await r.json();
    renderJourney();
  } catch (_) {
    out.innerHTML = `<div class="res-msg">${esc(navigator.onLine === false ? t("offline") : t("netErr"))}</div>`;
  }
  jp.busy = false; paintJourneyForm();
}

function hopChip(l) {
  if (l.mode === "walk") return `<span class="hop walk">⏱ ${Math.round(l.min)}′</span>`;
  return `<span class="hop ${esc(l.mode)}">${esc(String(l.line))}</span>`;
}
function modeName(m) {
  return m === "metro" ? t("jpModeMetro") : m === "tram" ? t("jpModeTram")
    : m === "trolley" ? t("jpModeTrolley") : t("jpModeBus");
}
/* Why there is nothing to show. "No route" covers four quite different
   situations and only one of them is the rider's fault to fix, so say
   which — a missing stop at one end is something you can walk out of. */
function emptyPlanMsg(reason) {
  return reason === "closed" ? t("jpClosed")
    : reason === "tooclose" ? t("jpClose")
    : reason === "nostopsfrom" ? t("jpNoStopsFrom")
    : reason === "nostopsto" ? t("jpNoStopsTo")
    : reason === "noconnection" ? t("jpNoConn")
    : t("jpNone");
}

/* The line under a walk-only option. Everything else on the card is a
   number; this is the sentence that stops "walk 34′" from reading as the
   planner giving up. */
function whyWalk(it) {
  const w = it && it.why;
  if (!w) return "";
  if (w.code === "beats") {
    return (w.line && w.waitMin != null)
      ? t("jpWhyBeatsLine")(w.line, w.waitMin, w.viaMin)
      : t("jpWhyBeats")(w.viaMin);
  }
  if (w.code === "also") return t("jpWhyAlso")(w.viaMin);
  if (w.code === "closed") return t("jpWhyClosed");
  return emptyPlanMsg(w.code);       // nostopsfrom / nostopsto / noconnection
}

function renderJourney() {
  const out = $("#jp-out"), res = jp.res || {};
  const list = res.itineraries || [];
  if (!list.length) {
    out.innerHTML = `<div class="res-msg">${esc(emptyPlanMsg(res.reason))}</div>`;
    return;
  }
  const label = { best: t("jpFast"), fewer: t("jpFewer"), metro: t("jpMetro"), ride: t("jpByVehicle") };
  out.innerHTML =
    `<div class="jp-note">${esc(t("jpDisclaim"))}</div>` +
    list.map((it, i) => {
      const chain = it.legs.map(hopChip).join('<span class="hop-sep">›</span>');
      const why = whyWalk(it);
      const meta = it.why ? t("jpWalkAll")
        : `${label[it.kind] || ""} · ${t("jpChanges")(it.changes)}`;
      return `<button class="itin" data-i="${i}">
        <div class="itin-top">
          <span class="itin-min">${it.totalMin}<small>${esc(t("jpMin"))}</small></span>
          <span class="itin-meta">${esc(meta)}</span>
        </div>
        <div class="itin-chain">${chain}</div>
        <div class="itin-basis">${esc(why || basisLine(it))}</div>
      </button>`;
    }).join("");
  $$("#jp-out .itin").forEach(b => b.onclick = () => openItinerary(list[+b.dataset.i]));
}
function basisLine(it) {
  const b = it.basis;
  if (b === "live") return t("jpLive");
  if (b === "timetable") return t("jpSched");
  if (b === "estimated") return t("jpEst");
  return `${t("jpLive")} + ${t("jpEst")}`;     // mixed
}
function legBasis(l) {
  return l.basis === "live" ? t("jpLive")
    : l.basis === "timetable" ? t("jpSched") : t("jpEst");
}

/* The detail view: the legs written out, and the whole thing drawn. */
function openItinerary(it) {
  jp.current = it;
  $("#jpr-title").textContent = `${it.totalMin} ${t("jpMin")}`;
  $("#jpr-sub").textContent = `${t("jpChanges")(it.changes)} · ${basisLine(it)}`;
  $("#jpr").classList.add("on");
  const notes = [];
  // first, because on a walk-only itinerary it is the whole story
  const why = whyWalk(it);
  if (why) notes.push(why);
  if (it.legs.some(l => l.mode !== "walk" && l.basis === "timetable")) notes.push(t("jpNoteSched"));
  if (it.legs.some(l => l.mode !== "walk" && l.basis === "estimated")) notes.push(t("jpNoteEst"));
  if (it.legs.some(l => l.mode === "walk" && l.basis !== "routed")) notes.push(t("jpNoteWalk"));
  const nm = o => o ? (LANG === "en" ? (o.en || o.el) : (o.el || o.en)) : "";
  const rows = it.legs.map(l => {
    if (l.mode === "walk") {
      const dest = nm(l.to) || t("jpDest");
      return `<div class="jp-step"><div class="jp-ic">⏱</div><div class="jp-body">
        <div class="jp-h">${esc(t("jpWalk"))} ${esc(fmtDist(l.metres))}</div>
        <div class="jp-d">${esc(t("jpTo2"))} ${esc(dest)}</div></div>
        <div class="jp-t">${Math.round(l.min)}′</div></div>`;
    }
    const head = l.headsign ? nm(l.headsign) : "";
    const basis = legBasis(l);
    return `<div class="jp-step"><div class="jp-ic line">${esc(String(l.line))}</div><div class="jp-body">
      <div class="jp-h">${esc(t("jpBoard"))} ${esc(nm(l.from))}</div>
      <div class="jp-d">${esc(modeName(l.mode))}${head ? " · " + esc(head) : ""} · ${esc(t("jpStops")(l.stops))} · ${esc(t("jpAlight"))} ${esc(nm(l.to))}</div>
      <div class="jp-d">${esc(t("jpWait"))} ${Math.round(l.wait)}′ · ${esc(t("jpRide"))} ${Math.round(l.rideMin)}′ · ${esc(basis)}</div>
      </div><div class="jp-t">${Math.round(l.min)}′</div></div>`;
  }).join("");
  $("#jpr-strip").innerHTML = notes.map(n => `<div class="jp-note">${esc(n)}</div>`).join("") + rows;
  drawItinerary(it);
  fillWalkPaths(it);
}

/* The planner routes the walking legs of the itinerary it ranks first,
   because before anyone has chosen that is the only one worth spending
   requests on. Open the second option, though, and its walking legs were
   still the straight line the search used for ranking — a line drawn
   across the blocks, which reads as a route and is not one.

   So: when a rider actually opens an itinerary, ask for the real shape of
   whatever it is still guessing at. Idempotent by construction — the legs
   come back `routed`, so the repaint below finds nothing left to do. */
async function fillWalkPaths(it) {
  if (!(jp.res && jp.res.walkRouting)) return;      // no router configured
  const todo = it.legs.filter(l => l.mode === "walk" && l.basis !== "routed"
    && Array.isArray(l.path) && l.path.length >= 2);
  if (!todo.length) return;
  let changed = false;
  for (const l of todo.slice(0, JP_WALK_MAX)) {
    const a = l.path[0], b = l.path[l.path.length - 1];
    try {
      const r = await fetch(`${base()}/walk?from=${a[0]},${a[1]}&to=${b[0]},${b[1]}`,
        { cache: "no-store" });
      if (!r.ok) return;                            // 501/502: stop asking
      const j = await r.json();
      if (!Array.isArray(j.path) || j.path.length < 2) continue;
      l.path = j.path; l.metres = j.metres; l.min = j.min; l.basis = "routed";
      changed = true;
    } catch (_) { return; }
  }
  // still the itinerary on screen? then show what we learned
  if (changed && jp.current === it && $("#jpr").classList.contains("on")) openItinerary(it);
}
function closeItinerary() { $("#jpr").classList.remove("on"); }

function drawItinerary(it) {
  if (!jp.map) {
    jp.map = L.map("jpmap", { zoomControl: true });
    addTiles(jp.map);            // the one place tile options are decided
    jp.layer = L.layerGroup().addTo(jp.map);
    jp.map.setView([here.lat, here.lng], 13);
  } else jp.layer.clearLayers();
  setTimeout(() => jp.map.invalidateSize(), 70);

  /* Each leg draws itself: walking dashed and grey, riding as the same
     snake the rest of the app uses, so the shape of the trip reads at a
     glance without a legend. The line follows the stops it calls at, which
     is not the road, and is close enough to recognise the route by. */
  const pts = [];
  it.legs.forEach(l => {
    const path = (l.path || []).filter(p => Array.isArray(p) && isFinite(p[0]));
    if (path.length < 2) return;
    path.forEach(p => pts.push(p));
    if (l.mode === "walk") {
      L.polyline(path, { color: "#8A8A84", weight: 3, opacity: .95, dashArray: "3 6" }).addTo(jp.layer);
      return;
    }
    L.polyline(path, { color: "#FFFFFF", weight: 8, opacity: .95 }).addTo(jp.layer);
    L.polyline(path, { color: "#17171A", weight: 4 }).addTo(jp.layer);
    if (l.mode === "metro") L.polyline(path, { color: "#FFE24A", weight: 2, opacity: 1 }).addTo(jp.layer);
    // a dot at each intermediate stop, and the line number where you board
    path.slice(1, -1).forEach(p => L.circleMarker(p, { radius: 2.5, color: "#5A6B8C",
      weight: 1, fillColor: "#8A97AD", fillOpacity: .85 }).addTo(jp.layer));
    L.marker(path[0], { icon: L.divIcon({ className: "",
      html: `<div class="endm">${esc(String(l.line))}</div>`, iconSize: [0, 0], iconAnchor: [0, 10] }),
      zIndexOffset: 800 }).addTo(jp.layer);
  });
  if (!pts.length) { pts.push([jp.from.lat, jp.from.lng], [jp.to.lat, jp.to.lng]); }
  L.marker([jp.from.lat, jp.from.lng], { icon: L.divIcon({ className: "",
    html: '<div class="origin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
    zIndexOffset: 900 }).addTo(jp.layer);
  L.marker([jp.to.lat, jp.to.lng], { icon: L.divIcon({ className: "",
    html: '<div class="jp-end"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }),
    zIndexOffset: 900 }).addTo(jp.layer);
  const b = L.latLngBounds(pts.concat([[jp.from.lat, jp.from.lng], [jp.to.lat, jp.to.lng]]));
  if (b.isValid()) jp.map.fitBounds(b, { padding: [42, 42], maxZoom: 16 });
}

function relTime(sec){
  if(!isFinite(sec)||sec<0) return "";
  if(sec<90) return t("justNow");
  if(sec<3600) return `${Math.round(sec/60)}${t("minShort")} ${t("agoWord")}`;
  if(sec<86400) return `${Math.round(sec/3600)}${t("hourShort")} ${t("agoWord")}`;
  return `${Math.round(sec/86400)}${t("dayShort")} ${t("agoWord")}`;
}
function kpi(label,value,cls){ return `<div class="${cls||""}"><b>${value}</b><span>${label}</span></div>`; }
async function showRouteStats(){
  const body=$("#st-body");
  body.innerHTML=`<div class="note">${t("searching")}</div>`;
  try{
    const [s,bunch,miss]=await Promise.all([
      fetch(`${base()}/stats?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),
      fetch(`${base()}/stats/bunching?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),
      fetch(`${base()}/stats/missing?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),
    ]);
    if(!s||!s.enough){
      body.innerHTML=`<div class="note">${t("collecting")}<br>${(s&&s.total)||0} ${t("events")}</div>
        <button class="ghost" id="st-back">←</button>`;
      $("#st-back").onclick=renderStats; return;
    }
    const regCls=s.regularity>=75?"ok":s.regularity>=50?"warn":"bad";  // ok / marked / boxed
    const bunchCls=s.bunchRate<=5?"ok":s.bunchRate<=15?"warn":"bad";
    const missCls=s.missingRate<=5?"ok":s.missingRate<=15?"warn":"bad";
    const maxH=Math.max(1,...(s.hourly||[]).map(h=>h.n));
    const bars=Array.from({length:24},(_,h)=>{
      const f=(s.hourly||[]).find(x=>x.h===h);
      const v=f?f.n:0; const pct=Math.round(v/maxH*100);
      return `<i class="${pct>66?"hi":""}" style="height:${Math.max(2,pct)}%" title="${h}:00 · ${v}"></i>`;
    }).join("");

    body.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div class="tile num" style="height:28px;min-width:44px;font-size:13px">${esc((s.route&&s.route.line_id)||statRoute)}</div>
        <div style="color:var(--muted);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${esc(destOf((s.route&&s.route.descr)||"")||"")}</div>
        <button class="chip${statDays===7?" on":""}" id="d7">${t("last7")}</button>
        <button class="chip${statDays===30?" on":""}" id="d30">${t("last30")}</button>
      </div>
      <div class="kpi">
        ${kpi(t("waitReal"), s.expectedWait+"′")}
        ${kpi(t("headway"), s.typicalGap+"′")}
        ${kpi(t("regular"), s.regularity+"%", regCls)}
        ${kpi(t("bunching"), s.bunchRate+"%", bunchCls)}
        ${kpi(t("missingSvc"), s.missingRate+"%", missCls)}
        ${kpi(t("worst"), s.worstGap+"′")}
      </div>
      <div class="note">${s.total} ${t("events")} · ${s.vehicles} ${t("vehicles").toLowerCase()}</div>
      <div class="sec-label">${t("byHour")}</div>
      <div class="hrs">${bars}</div>
      <div class="hrlab"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
      <div class="sec-label">${t("bunching")} · ${t("incidents")}</div>
      ${bunch&&bunch.length?bunch.slice(0,6).map(b=>
        `<div class="inc"><b>${Math.round(b.gapSec/60*10)/10}′</b> ${t("bunching").toLowerCase()} · ${new Date(b.at*1000).toLocaleString()}</div>`).join("")
        :`<div class="inc">${t("noneYet")}</div>`}
      <div class="sec-label">${t("missingSvc")}</div>
      ${miss&&miss.length?miss.slice(0,6).map(g=>
        `<div class="inc"><b>${g.minutes}′</b> (${t("headway").toLowerCase()} ~${g.typical}′) · ${new Date(g.from*1000).toLocaleString()}</div>`).join("")
        :`<div class="inc">${t("noneYet")}</div>`}
      <button class="ghost" id="st-back">←</button>`;
    $("#d7").onclick=()=>{ statDays=7; showRouteStats(); };
    $("#d30").onclick=()=>{ statDays=30; showRouteStats(); };
    $("#st-back").onclick=renderStats;
  }catch(e){ body.innerHTML=`<div class="note">${t("err")}</div>`; }
}

function u8(b64){ const p="=".repeat((4-b64.length%4)%4);
  const s=(b64+p).replace(/-/g,"+").replace(/_/g,"/"); const raw=atob(s);
  const a=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i); return a; }
async function ensurePush(){
  if(!hasBackend()) throw new Error("nobackend");
  if(!("serviceWorker" in navigator)||!("PushManager" in window)) throw new Error("unsupported");
  const kr=await fetch(base()+"/push/key"); if(!kr.ok) throw new Error("notconfigured");
  const {key}=await kr.json();
  let perm=Notification.permission;
  if(perm==="default") perm=await Notification.requestPermission();
  if(perm!=="granted") throw new Error("denied");
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)});
  const id=localStorage.getItem("subId")||null;
  const r=await fetch(base()+"/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,subscription:sub.toJSON()})});
  const j=await r.json(); localStorage.setItem("subId",j.id); state.subId=j.id; return j.id;
}
async function loadRules(){
  if(!hasBackend()||!state.subId){ state.rules=[]; return; }
  try{ const r=await fetch(`${base()}/rules?sub=${encodeURIComponent(state.subId)}`);
    state.rules=r.ok?await r.json():[]; }catch{ state.rules=[]; }

/* With a rule, the same form edits it; without one, it makes a new one.

   screen is two places to fix every time a field changes. */
function renderForm(edit){
  const form=$("#ruleform"); form.innerHTML="";
  if(edit){
    const h=document.createElement("div"); h.className="fhead";
    h.textContent=`${t("editAlert")} · ${edit.stopName||""}`.trim();

    <div class="field"><label>${t("days")}</label><div class="chips" id="f-days"></div></div>
    <div class="field two"><div><label>${t("from")}</label><input type="time" id="f-from" value="${esc(edit&&edit.from||"08:30")}"></div>
      <div><label>${t("till")}</label><input type="time" id="f-to" value="${esc(edit&&edit.to||"08:50")}"></div></div>
    <div class="field"><label>${t("lead")}</label><div class="chips" id="f-leads"></div></div>`;
  form.appendChild(wrap);
  const sel=new Set(edit&&Array.isArray(edit.days)?edit.days:[1,2,3,4,5]),db=wrap.querySelector("#f-days");
  [1,2,3,4,5,6,0].forEach(i=>{ const c=document.createElement("button");
    c.className="chip"+(sel.has(i)?" on":""); c.textContent=t("dayNames")[i];
    c.onclick=()=>{ sel.has(i)?sel.delete(i):sel.add(i); c.classList.toggle("on"); }; db.appendChild(c); });
  const leads=new Set(edit&&Array.isArray(edit.leads)?edit.leads:[10,5]),lb=wrap.querySelector("#f-leads");
  [15,10,5,3].forEach(L=>{ const c=document.createElement("button");
    c.className="chip"+(leads.has(L)?" on":""); c.textContent=L+"′";
    c.onclick=()=>{ leads.has(L)?leads.delete(L):leads.add(L); c.classList.toggle("on"); }; lb.appendChild(c); });
  const rs=wrap.querySelector("#f-route");
  const stopSel=wrap.querySelector("#f-stop");
  const findBox=wrap.querySelector("#f-find");
  const qIn=wrap.querySelector("#f-q");
  const qRes=wrap.querySelector("#f-qres");

  /* A stop reached by search has no routes yet — it never went through a
     nearby sweep — so fetch them before the line dropdown can mean
     anything. */
  async function fill(){
    const s=stops[+stopSel.value];
    if(!s){ rs.innerHTML=`<option value="">—</option>`; return; }
    if(!s.routesLoaded){
      rs.innerHTML=`<option value="">${esc(t("searching"))}</option>`;
      try{ await loadRoutes(s); }catch(_){}
      if(stops[+stopSel.value]!==s) return;          // user moved on
    }
    rs.innerHTML=(s.routes||[]).map(r=>{ const d=LANG==="en"?(r.en||r.el):(r.el||r.en);
      return `<option value="${esc(r.code)}">${esc(r.id)} · ${esc(d||"")}</option>`; }).join("")
      ||`<option value="">—</option>`;
  }

  function addStop(s){
    const i=stops.findIndex(x=>String(x.code)===String(s.code));
    let idx=i;
    if(i<0){
      idx=stops.push(s)-1;
      const o=document.createElement("option");
      o.value=String(idx); o.textContent=stopName(s);
      stopSel.insertBefore(o,stopSel.lastElementChild);
    }
    stopSel.value=String(idx);
    findBox.hidden=true; qRes.innerHTML=""; qIn.value="";
    fill();
  }

  let qTimer=null;
  async function runFind(){
    const q=qIn.value.trim();
    if(q.length<2){ qRes.innerHTML=""; return; }
    qRes.innerHTML=`<div class="res-msg">${t("searching")}</div>`;
    let hits=localStopMatches(q), netFail=false;
    if(hasBackend()){
      try{
        const r=await fetch(`${base()}/stops/search?q=${encodeURIComponent(q)}`,{cache:"no-store"});
        if(r.ok){
          const j=await r.json();
          const have={}; hits.forEach(x=>{ have[String(x.code)]=1; });
          hits=hits.concat((Array.isArray(j.stops)?j.stops:[]).filter(x=>!have[String(x.code)]));
        } else netFail=true;
      }catch(_){ netFail=true; }
    }
    hits=hits.slice(0,8);
    if(!hits.length){
      qRes.innerHTML=`<div class="res-msg">${esc(emptyMsg(netFail,"noStopHit"))}</div>`; return; }
    qRes.innerHTML="";
    hits.forEach(raw=>{
      const b=document.createElement("button");
      b.className="res-item";
      const d=isFinite(raw.dist)?fmtDist(raw.dist):"";
      b.innerHTML=`<b>${esc(stopName(raw))}</b>${d?` <span class="res-d">${esc(d)}</span>`:""}`;
      b.onclick=()=>addStop(adoptStop(raw));
      qRes.appendChild(b);
    });
  }

  stopSel.onchange=()=>{
    if(stopSel.value==="find"){
      findBox.hidden=false; qRes.innerHTML=""; setTimeout(()=>qIn.focus(),60);
      return;
    }
    findBox.hidden=true; fill();
  };
  qIn.oninput=()=>{ clearTimeout(qTimer); qTimer=setTimeout(runFind,320); };
  qIn.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); clearTimeout(qTimer); runFind(); } };
  if(edit) stopSel.value="0";                    // the rule's own stop, pushed first
  fill().then(()=>{
    const want=(edit&&edit.routeCodes||[])[0];
    if(!want) return;
    rs.value=String(want);
    /* The stop's directions did not come back, or this one has been
       retired since. Either way the rule's own line is the answer here —
       switching it silently to whatever sorted first would change the
       alert into one for a different bus. */
    if(rs.value!==String(want)){
      const o=document.createElement("option");
      o.value=String(want);
      o.textContent=`${edit.lineId||""} · ${edit.routeName||""}`.replace(/^ · | · $/,"")||String(want);
      rs.insertBefore(o,rs.firstChild); rs.value=String(want);
    }
  });
  const save=document.createElement("button"); save.className="primary"; save.textContent=t("save");
  save.onclick=async()=>{
    save.disabled=true;
    try{
      const id=await ensurePush();
      const s=stops[+stopSel.value];
      const rc=rs.value;
      if(!s||!rc) throw new Error("pick");
      const route=(s.routes||[]).find(r=>r.code===rc)||{};
      const rule={sub:id,stopCode:s.code,stopName:stopName(s),lineId:route.id||"",routeCodes:[rc],
        routeName:(LANG==="en"?(route.en||route.el):(route.el||route.en))||"",
        days:[...sel].sort(),from:wrap.querySelector("#f-from").value,to:wrap.querySelector("#f-to").value,
        leads:[...leads].sort((a,b)=>b-a),enabled:true};
      /* Carrying the id turns the same POST into a replace, which is why
         editing needed no new endpoint. A direction kept from a stop whose
         routes never loaded has no `route` object behind it, so fall back
         to what the rule already said rather than blanking the line. */
      if(edit){
        rule.id=edit.id;
        if(edit.enabled!=null) rule.enabled=edit.enabled;
        if(!route.id&&String(rc)===String((edit.routeCodes||[])[0])){
          rule.lineId=edit.lineId||""; rule.routeName=edit.routeName||"";
        }
      }
      const r=await fetch(base()+"/rules",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(rule)});
      if(!r.ok) throw new Error("save");
      await loadRules(); bellBadge(); renderAlerts();
    }catch(e){ const n=document.createElement("div"); n.className="note";
      n.textContent=e.message==="denied"?t("pushDenied"):t("pushOff"); form.appendChild(n); save.disabled=false; }
  };
  form.appendChild(save);
  const cancel=document.createElement("button"); cancel.className="ghost"; cancel.textContent=t("cancel");
  cancel.onclick=renderAlerts; form.appendChild(cancel);
}

function switchLang(){
  LANG=LANG==="el"?"en":"el";
  try{ localStorage.setItem("lang",LANG); }catch(_){}
  if(here.gps) here.label=t("you");
  else if(here.label){ const p=PRESETS.find(x=>x.el===here.label||x.en===here.label);
    if(p) here.label=LANG==="el"?p.el:p.en; }
  // every cached row string is in the old language, so start clean
  cardCache.forEach(c=>c.card.remove()); cardCache.clear();
  applyStatics(); updateRadiusLabel(); paintFresh(); renderView();
  if($("#rep").classList.contains("on")){ drawReportMap(); renderReportList(); }
}

/* Retry re-checks the permission rather than calling getCurrentPosition
   blind: a still-denied call fails so fast that the button looks dead,
   which is the bug this whole panel exists to fix. */
$("#gb-retry").onclick=async()=>{
  const btn=$("#gb-retry"); btn.disabled=true;
  try{
    let st=null;
    if(navigator.permissions&&navigator.permissions.query){
      try{ st=await navigator.permissions.query({name:"geolocation"}); }catch(_){}
    }
    if(st&&st.state==="denied") toast(t("gbStill"));
    else { geoUnblocked(); useGPS(); }
  } finally { btn.disabled=false; }
};

{

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

    here={lat:lp.lat,lng:lp.lng,label:t("you"),gps:true}; } }catch(_){}
