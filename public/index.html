/* ----------------------------- views -------------------------------
 * The slide used to start only after the incoming view had been rendered.
 * Going to the list that costs nothing, but the first trip to the map
 * built the whole Leaflet instance first: on a mid-range phone that is
 * ~150 ms of blocked main thread between lifting your thumb and anything
 * moving, which reads as the animation lagging in one direction only.
 *
 * So `warmMap` builds it in idle time while the list is still on screen,
 * and the switch itself takes whichever order suits what it finds:
 *
 *   warm  - start the slide immediately, render on the next frame, so the
 *           tab moves on the same frame as the gesture
 *   cold  - build first, then slide. Starting a beat late is better than
 *           stalling halfway through the motion, which is what deferring
 *           150 ms of work into the animation actually looks like.
 *
 * In practice the cold branch is only reachable if you swipe within a
 * second of the app opening. */
let warmed=false;
function warmMap(){
  if(warmed||map) return; warmed=true;
  const go=()=>{
    if(map) return;                 // a switch got there first
    /* Build it while it is laid out but invisible. A display:none container
       has no size, so Leaflet would defer every tile and marker position to
       the moment you first swipe to it — which is the reveal that costs
       ~60 ms. Absolute + visibility:hidden keeps the list's own layout
       untouched and nothing appears on screen. */
    const w=$("#mapwrap"), hidden=w.style.display;
    try{
      w.style.display=""; w.classList.add("prewarm");
      ensureMap(); renderMap();
    }catch(_){ warmed=false; }
    finally{ w.classList.remove("prewarm"); w.style.display=hidden; }
  };
  if(window.requestIdleCallback) requestIdleCallback(go,{timeout:600}); else setTimeout(go,300);
}
function setView(v,dir){
  if(state.view===v) return;
  state.view=v;
  $("#mapwrap").style.display=v==="map"?"":"none";
  $("#radwrap").style.display=v==="map"?"":"none";
  $("#list").style.display=v==="list"?"":"none";
  paintSeg();
  // The two tabs are different heights, so a leftover scroll offset from
  // one makes the other land mid-page with the scrollbar flashing. Pin to
  // the top on every switch — the map has nothing to scroll anyway, and a
  // fresh list read always starts from its first stop.
  window.scrollTo(0,0);
  document.body.classList.toggle("mapview",v==="map");
  document.documentElement.classList.toggle("mapview",v==="map");
  if(v==="map") fitMapHeight();
  const el=v==="map"?$("#mapwrap"):$("#list");
  const cold=v==="map"&&!map;
  if(cold) renderView();         // settle the layout, then animate it
  if(dir){                       // slide the incoming view in, swipe-style
    el.classList.remove("slide-l","slide-r");
    // Forces the pending layout to flush now rather than during the slide.
    // Cancelling the running animations instead avoids this reflow, but then
    // the layout lands mid-animation and stalls it far worse: measured 158 ms
    // on a frame, against 47 ms of settling before the motion starts.
    void el.offsetWidth;         // restart the animation
    el.classList.add(dir<0?"slide-l":"slide-r");
    el.addEventListener("animationend",()=>el.classList.remove("slide-l","slide-r"),{once:true});
    if(!cold) requestAnimationFrame(renderView);
  } else if(!cold) renderView();
}

/* ---------------------------- swipes -------------------------------
 * Swipe left → map, swipe right → list. The Leaflet map owns horizontal
 * dragging, so a swipe that starts on it is ignored *unless* it starts
 * at the very left edge — the conventional "back" gesture. Sheets and
 * full-screen panels suppress it entirely, and the gesture must be
 * clearly horizontal and quick so it never fights vertical scrolling.
 *
 * A gesture that STARTS on a control belongs to that control, full stop.
 * Dragging the radius slider is a long horizontal travel by definition,
 * so without this it read as "swipe back to the list" every time — the
 * slider sits in #radwrap, which is a sibling of #mapwrap and so was not
 * covered by the map exemption below. */
/* The decision happens in touchmove, NOT in touchend, and the listeners
 * live on the WHOLE WINDOW, not on .wrap.
 *
 * Two failures this shape fixes, both peculiar to the list tab because
 * the list scrolls and the map does not:
 *
 *  1. DEAD ZONES. .wrap is only as tall as its content. With one or two
 *     stops the rest of the screen — the area under the v## label — is
 *     bare <body>, OUTSIDE .wrap, so a swipe that started there never
 *     reached the old listener. Landing on the window means every pixel
 *     of the viewport is swipeable.
 *
 *  2. THE SCROLL BLEED. A passive touchmove can't stop the page, so an
 *     arced thumb scrolled the list vertically mid-swipe; when the view
 *     then flipped to the shorter map, the retained scroll snapped back
 *     and the scrollbar flashed. Now the move listener is NON-passive:
 *     the instant the gesture commits to horizontal we preventDefault(),
 *     which freezes the scroll for the rest of the gesture, and setView
 *     pins the page to the top on the switch itself so the map always
 *     lands clean. A gesture that commits to vertical is released
 *     untouched, so normal list scrolling is unaffected. */
const SWIPE={edge:34,dead:8,hlock:12,vert:1.5,minX:52,slope:0.8,maxMs:900};
const NO_SWIPE="input,select,textarea,button,a,label,.seg,.radwrap,.leaflet-control";
function initSwipes(){
  let sx=0,sy=0,t0=0,live=false,axis=0;   // axis: 0 undecided, 1 horizontal, -1 vertical
  const stop=()=>{ live=false; axis=0; };
  window.addEventListener("touchstart",e=>{
    stop();
    if(e.touches.length!==1) return;
    if(document.querySelector(".sheet-bg.on,.picker.on,.rp.on,.rl.on")) return;
    const t=e.touches[0];
    if(e.target.closest(NO_SWIPE)) return;                            // the control owns it
    if(e.target.closest("#mapwrap") && t.clientX>SWIPE.edge) return;  // let the map pan
    sx=t.clientX; sy=t.clientY; t0=Date.now(); live=true;
  },{passive:true});
  window.addEventListener("touchmove",e=>{
    if(!live) return;
    if(e.touches.length!==1) return stop();                           // second finger: not a swipe
    const t=e.touches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    const ax=Math.abs(dx), ay=Math.abs(dy);
    /* Lock to one axis and stay there for the rest of the gesture.
       The bias is deliberate: this is a tab swipe, so anything that isn't
       CLEARLY a vertical scroll (ay dominating ax by 1.5x) is treated as
       a horizontal candidate the moment it travels ~12px sideways. A real
       scroll is near-vertical and trips the vertical test long before ax
       reaches 12; a thumb's diagonal arc does not, so it is no longer
       mistaken for a scroll the way it was when list->map "almost never"
       fired. */
    if(!axis){
      if(ay>=SWIPE.dead && ay>ax*SWIPE.vert) axis=-1;                 // clearly a scroll
      else if(ax>=SWIPE.hlock) axis=1;                                // horizontal enough: ours
      else return;                                                    // undecided: keep watching
    }
    if(axis<0) return stop();                                         // hand the scroll back to the page
    e.preventDefault();                                               // horizontal: freeze the scroll bleed
    if(Date.now()-t0>SWIPE.maxMs) return stop();                      // dawdling, not a flick
    if(ax>=SWIPE.minX && ay<=ax*SWIPE.slope){
      const dir=dx<0?"map":"list";
      stop();
      setView(dir, dir==="map"?-1:1);
    }
  },{passive:false});
  window.addEventListener("touchend",stop,{passive:true});
  window.addEventListener("touchcancel",stop,{passive:true});
}
/* Give the map exactly the room that is left under the controls. 57vh was
   a guess, and on a short screen it overflowed, which is what let the map
   tab scroll at all: you would swipe across and land a little way down the
   page. Measured instead, so the frame always ends at the bottom edge. */
function fitMapHeight(){
  const el=document.getElementById("map"); if(!el) return;
  const top=el.getBoundingClientRect().top+window.scrollY;
  const h=Math.max(260,Math.round(window.innerHeight-top-12));
  if(el.style.height!==h+"px"){ el.style.height=h+"px"; if(map) sizeMap(); }
}
addEventListener("resize",()=>{ if(state.view==="map") fitMapHeight(); });
addEventListener("orientationchange",()=>setTimeout(()=>{
  if(state.view==="map") fitMapHeight(); },250));

/* ------------------------------- splash ------------------------------- *
 * The mark holds the screen until there is something behind it worth
 * looking at, and no longer. `maxMs` is the promise that a dead network
 * cannot trap anyone on a logo; `minMs` is the one that a warm cache does
 * not make it flash. */
const SPLASH={minMs:420,maxMs:2200};
let splashAt=Date.now(), splashDone=false;
function hideSplash(){
  if(splashDone) return; splashDone=true;
  const el=$("#splash"); if(el) el.classList.add("gone");
}
function dismissSplash(){
  // whichever comes first: the board is up, or we have waited long enough
  setTimeout(hideSplash,SPLASH.maxMs);
}
function splashReady(){
  if(splashDone) return;
  const waited=Date.now()-splashAt;
  setTimeout(hideSplash,Math.max(0,SPLASH.minMs-waited));
}
/* An installed launch already had a splash, painted by the launcher from
   the manifest icon; ours would be a second one in a row and the app would
   look like it opened twice. The CSS above keeps it from painting at all
   wherever display-mode is reported — this covers iOS home-screen apps,
   which signal the same thing only through navigator.standalone, and it
   also releases the first-run carousel, which waits on splashDone. */
if(isStandalone()){
  splashDone=true;
  const el0=$("#splash"); if(el0) el0.classList.add("off");
}

function renderView(){ state.view==="map"?renderMap():renderList(); splashReady(); }

/* ---------------------- moving to a new address --------------------- */
const MOVED_KEY="movedSeen";
function movedHome(){
  try{ return MOVED_TO ? new URL(MOVED_TO) : null; }catch(_){ return null; }
}
function showMovedNotice(){
  const home=movedHome();
  // nothing set, or this IS the new home: say nothing
  if(!home || home.host===location.host) return;
  try{ if(localStorage.getItem(MOVED_KEY)===home.host) return; }catch(_){}
  const bar=$("#moved");
  $("#moved-t").textContent=t("movedTxt")(home.host);
  const go=$("#moved-go");
  go.textContent=t("movedGo"); go.href=home.origin+location.pathname+location.search;
  $("#moved-x").onclick=()=>{
    bar.hidden=true;
    try{ localStorage.setItem(MOVED_KEY,home.host); }catch(_){}
  };
  bar.hidden=false;
}

/* The list refreshes every 30 s, and it used to throw away every card and
   rebuild it — ~70 elements and as many event listeners, each time. That
   costs a full layout, drops the pressed state under your finger, and
   loses scroll anchoring on a long list.
   Now cards are kept and reconciled: a card is reused if its stop is still
   shown, only the strings that actually changed are written, and gesture
   handlers are bound once per element rather than once per refresh. */
const cardCache=new Map();          // stop code -> {card, hd, rows, sig}

/* A row is three cells and only one of them normally changes: the
   countdown. Writing each cell separately, and only when its own content
   differs, means a steady-state refresh touches the minutes and nothing
   else. */
function paintRow(row,s,a){
  let tile=row.children[0],dest=row.children[1],eta=row.children[2];
  if(!eta){
    row.innerHTML='<div class="tile num"></div><div class="dest"></div><div class="eta"></div>';
    tile=row.children[0]; dest=row.children[1]; eta=row.children[2];
  }
  const line=String(arrLine(s,a.code));
  if(row._line!==line){ tile.textContent=line; row._line=line; }

  const d=arrDest(s,a.code);
  const dHtml=(d?`<span class="to">${t("to")}</span>${esc(d)}`:"")+flagLine(reportForArrival(a));
  if(row._dest!==dHtml){ dest.innerHTML=dHtml; row._dest=dHtml; }

  // the countdown changes on every single sweep, so it is written as text
  // into spans that already exist rather than re-parsed as markup
  const now=a.min<=1;
  let v=eta.firstElementChild,u=v&&v.nextElementSibling;
  if(!v||!u){ eta.innerHTML='<span class="v num"></span><span class="u"></span>';
    v=eta.children[0]; u=eta.children[1]; }
  const vs=now?t("now"):String(a.min), us=now?"":t("min");
  if(v.textContent!==vs) v.textContent=vs;
  if(u.textContent!==us) u.textContent=us;
  v.className=now?"v":"v num";
  eta.className="eta"+(now?" now":"");
}
function headHtml(s){
  const w=walkMin(s.dist), fav=isFav(s.code);
  return `<div class="name">${fav?'<span class="star">★</span>':""}${esc(stopName(s))}</div>`+
    `<div class="meta">${w?`<span class="walk">🚶 ~${w}′</span>`:""}`+
    `<span class="num">${isFinite(s.dist)?fmtDist(s.dist):""}</span></div>`;
}

function renderList(){
  const list=$("#list");
  const shown=listStops();
  if(!shown.length){
    cardCache.clear();
    list.innerHTML=`<div class="msg">${t("nobus")}</div>`;
    return;
  }
  if(list.firstElementChild&&list.firstElementChild.classList.contains("msg")) list.innerHTML="";

  const live=new Set();
  let prev=null;
  shown.forEach(s=>{
    const key=String(s.code);
    live.add(key);
    let c=cardCache.get(key);
    if(!c){
      const card=document.createElement("div"); card.className="stop";
      const hd=document.createElement("div"); hd.className="stop-hd";
      const rows=document.createElement("div"); rows.className="rows";
      card.appendChild(hd); card.appendChild(rows);
      onDoubleTap(hd,()=>{ const cur=byCode(key); if(cur) addFav(cur); });
      onLongPress(hd,()=>{ const cur=byCode(key); if(cur) removeFav(cur); });
      c={card,hd,rows,sig:"",headSig:"",mode:""};
      cardCache.set(key,c);
    }
    // header: name, distance, star
    const headSig=headHtml(s);
    if(c.headSig!==headSig){ c.hd.innerHTML=headSig; c.headSig=headSig; }
    c.card.classList.toggle("fav",isFav(s.code));

    // rows: only rewritten when the rendered content actually differs
    let sig;
    if(!s.arrLoaded) sig="skel";
    else if(!s.arrivals.length) sig="empty";
    else sig=s.arrivals.slice(0,CONFIG.maxRows)
      .map(a=>`${a.code}|${a.veh}|${a.min}`).join(";")+"|"+
      (activeReports().length?groupedReports().map(r=>r.veh||r.targetId).join(","):"");
    if(c.sig!==sig){
      c.sig=sig;
      const mode=!s.arrLoaded?"skel":(!s.arrivals.length?"empty":"rows");
      // Changing shape means the old children are the wrong kind entirely:
      // clear, or index-based reuse below would interleave leftover
      // skeletons with real rows.
      if(c.mode!==mode){ c.rows.innerHTML=""; c.mode=mode; }
      if(!s.arrLoaded) c.rows.innerHTML='<div class="skel"></div><div class="skel"></div>';
      else if(!s.arrivals.length) c.rows.innerHTML=`<div class="empty">${t("nobus")}</div>`;
      else{
        const want=s.arrivals.slice(0,CONFIG.maxRows);
        // reuse the row elements too; only their innards change
        while(c.rows.children.length>want.length) c.rows.lastElementChild.remove();
        want.forEach((a,i)=>{
          let row=c.rows.children[i];
          if(!row||!row.classList.contains("row")){
            if(row) row.remove();
            row=document.createElement("div"); row.className="row";
            c.rows.appendChild(row);
            onLongPress(row,()=>{
              const cur=byCode(key), code=row.dataset.code;
              if(cur&&code) openRoutePreview(cur,code,+row.dataset.min||0);
            });
          }
          row.dataset.code=String(a.code); row.dataset.min=String(a.min);
          paintRow(row,s,a);
        });
      }
    }else if(s.arrLoaded&&s.arrivals.length){
      // same content, but the row's stop/min data must stay current
      s.arrivals.slice(0,CONFIG.maxRows).forEach((a,i)=>{
        const row=c.rows.children[i];
        if(row){ row.dataset.code=String(a.code); row.dataset.min=String(a.min); }
      });
    }

    // place it in the right order without moving nodes that are already right
    const want=prev?prev.nextElementSibling:list.firstElementChild;
    if(want!==c.card) list.insertBefore(c.card,want);
    prev=c.card;
  });

  // drop cards for stops no longer shown
  cardCache.forEach((c,key)=>{
    if(live.has(key)){ return; }
    c.card.remove(); cardCache.delete(key);
  });
}
function byCode(code){
  return (state.stops||[]).find(s=>String(s.code)===String(code))||state.favLive[String(code)]||null;
}

/* ------------------------------ map -------------------------------- */
/* ------------------------------ basemap ----------------------------
 * CARTO began requiring a key on basemaps.cartocdn.com in August 2026.
 * Without one the tiles still load, but every one of them carries an
 * "API KEY REQUIRED" watermark. A key is free (fair use, 5M tiles a
 * month) from carto.com/basemaps/apikey — paste it into TILE_KEY below.
 *
 * It is a public value, like every browser-side tile key: it ships in
 * this file and anyone can read it. Restrict it to your own domain in
 * CARTO's dashboard rather than trying to hide it.
 *
 * With NO key we fall back to OpenStreetMap's own tiles, desaturated to
 * sit closer to this app's palette. That means a fresh clone works out of
 * the box and an expired key degrades to a plain map instead of a
 * watermarked one — but OSM's tiles are a donated service with a usage
 * policy written for small projects, so set a key before you publish to
 * more than a few people.
 *
 * CARTO are also retiring these raster PNG endpoints in favour of vector
 * tiles, so a key buys time rather than settling the question for good.
 */
/* ---------------------- moving to a new address --------------------- *
 * A PWA install, its service worker, its localStorage and its push
 * subscription are all bound to the ORIGIN. Adding a custom domain to the
 * Worker does not move anybody: whoever installed from the old URL keeps
 * loading the old URL, forever, and will never find out there is a better
 * one unless the old one tells them.
 *
 * So set this to the new home and the old origin — and only the old
 * origin — grows a dismissible line saying where the app lives now.
 * Leave it empty and nothing happens anywhere.
 *
 * ORDER MATTERS: set it only once the new domain actually serves the app.
 * A banner pointing at a domain that does not answer yet is worse than no
 * banner, because the people who follow it are the ones who trust you.
 * ------------------------------------------------------------------- */
const MOVED_TO="";              // e.g. "https://oasax.com"

const TILE_KEY="cb1_2zw8_1_69e54b3a1b17086aafdedb75";
const CARTO_LIGHT="https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";
const CARTO_DARK="https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png";
const OSM_TILES="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const CARTO_ATTR='&copy; OpenStreetMap &copy; CARTO';
const OSM_ATTR='&copy; OpenStreetMap contributors';
// tolerate a key pasted as "abc", "key=abc" or "?key=abc"
function tileKey(){ return String(TILE_KEY||"").trim().replace(/^\?/,"").replace(/^key=/,""); }
function hasTileKey(){ return tileKey().length>0; }
let map=null,layerStops=null,mapMarkers={},tileLayer=null;
function tileUrl(){
  if(!hasTileKey()) return OSM_TILES;
  return (state.dark?CARTO_DARK:CARTO_LIGHT)+"?key="+encodeURIComponent(tileKey());
}
/* The two providers do not take the same options: OSM serves no @2x tiles,
   asks that its subdomains not be used, and stops at zoom 19. Building the
   layer in one place keeps the four maps in the app from drifting apart. */
function addTiles(map){
  const keyed=hasTileKey();
  const layer=L.tileLayer(tileUrl(),{
    subdomains: keyed?"abcd":"abc",
    maxZoom: keyed?20:19,
    detectRetina: keyed,
    crossOrigin: true,
    className: keyed?"":"tiles-plain",
    attribution: keyed?CARTO_ATTR:OSM_ATTR,
  });
  layer.addTo(map);
  return layer;
}
function meIcon(){ return L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]}); }
/* Double-tap a pin to favourite it — the whole marker, so the name label
   counts as well as the dot. Nothing is bound to long-press here any more:
   a single tap opens the popup, and the popup is where routes are chosen.
   Bound once per element — Leaflet recreates the element on setIcon, hence
   the guard and the re-bind on redraw. */
function bindMarkerGestures(m,s){
  const el=m.getElement(); if(!el||el._g) return;
  el._g=1;
  onDoubleTap(el,e=>{
    // keep the gesture off the map, or Leaflet's double-tap zoom fires too
    if(e&&e.stopPropagation) e.stopPropagation();
    m.closePopup(); addFav(s);
  });
  onLongPress(el,()=>{ m.closePopup(); removeFav(s); });
}
function stopIcon(s){
  // Pins carry the stop's own name; lines are revealed by opening the popup.
  // A pinned stop trades the toner dot for a highlighter star, so you can
  // pick your regular stops out of a crowded map at a glance.
  const nm=esc(stopName(s));
  const fav=isFav(s.code);
  return L.divIcon({className:"",
    html:`<div class="mk"><div class="mk-name">${nm}</div>`+
      (fav?`<div class="mk-star">★</div>`:`<div class="mk-dot"></div>`)+`</div>`,
    iconSize:[14,14],iconAnchor:[7,7],popupAnchor:[0,-16]});
}
function ensureMap(){
  if(map) return;
  map=L.map("map",{zoomControl:true}).setView([here.lat,here.lng],15);
  const nameZoom=()=>document.getElementById("map").classList.toggle("zoomed",map.getZoom()>=16);
  map.on("zoomend",nameZoom); setTimeout(nameZoom,0);
  tileLayer=addTiles(map);
  layerStops=L.layerGroup().addTo(map);
}
/* Every line in a popup is a button carrying its route code, because the
   route code is what draws a line and the line number is what a rider
   knows it by. A line running both directions through the same stop shows
   up twice, so its destination is spelled out on the chip; otherwise the
   number alone is enough. */
function routeChips(s){
  const rs=(s.routes||[]);
  if(!rs.length) return "";
  /* OASA lists a line once per route VARIANT — short workings, school
     runs, depot trips — so a stop served by one bus route comes back as
     "608, 608, 608". A rider standing there sees one line going one way,
     so collapse on line + destination and keep the first code, which is
     the one its arrivals quote. */
  const uniq=new Map();
  rs.forEach(r=>{
    const d=destOf(LANG==="en"?(r.en||r.el):(r.el||r.en))||"";
    const k=String(r.id)+"|"+d.toLowerCase();
    if(!uniq.has(k)) uniq.set(k,{id:String(r.id),dest:d,code:String(r.code)});
  });
  const items=[...uniq.values()];
  const n={}; items.forEach(x=>{ n[x.id]=(n[x.id]||0)+1; });
  items.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  return items.map(x=>{
    // spell out the destination only when the same number appears twice,
    // i.e. it genuinely runs both ways through this stop
    const d=n[x.id]>1?x.dest:"";
    return `<button type="button" class="pp-chip num${String(rline.code)===x.code?" on":""}"
      data-rc="${esc(x.code)}">${esc(x.id)}${d?` <i>▸ ${esc(d)}</i>`:""}</button>`;
  }).join("");
}
function popupHtml(s){
  const w=walkMin(s.dist);
  const chips=s.routesLoaded?routeChips(s):"";
  const lines = s.routesLoaded
    ? (chips ? `<div class="pp-lines">${chips}</div>` : `<div class="pp-empty">${t("noLines")}</div>`)
    : `<div class="pp-empty">${t("searching")}</div>`;
  // Only show an arrival once we know which line it belongs to, otherwise the
  // raw route code leaks into the UI as a meaningless 4-digit number.
  const rows = !s.arrLoaded
    ? `<div class="pp-empty">${t("searching")}</div>`
    : (s.arrivals.length && s.routesLoaded
        ? s.arrivals.slice(0,5).map(a=>{ const now=a.min<=1;
            return `<button type="button" class="pp-row${String(rline.code)===String(a.code)?" on":""}"
              data-rc="${esc(String(a.code))}"><span class="pp-tile num">${esc(String(arrLine(s,a.code)))}</span>
              <span class="pp-dest">${esc(arrDest(s,a.code))}</span>
              <span class="pp-min">${now?t("now"):a.min+"′"}</span></button>`; }).join("")
        : `<div class="pp-empty">${t("nobus")}</div>`);
  return `<div class="pp-name">${esc(stopName(s))}</div>
    <div class="pp-walk">🚶 ${w?`~${w}′ ${t("walk")} · `:""}${fmtDist(s.dist)}</div>
    <div class="pp-sec">${t("linesHere")}</div>${lines}
    <div class="pp-sec">${t("arrivingSoon")}</div>${rows}
    <div class="pp-hint">${t("ppHint")}</div>`;
}
/* One delegated listener per popup rather than one per chip: Leaflet
   rebuilds the popup's DOM whenever its content is set, and the content is
   set on every refresh sweep. */
function bindPopupPicks(m,s){
  const el=m.getPopup&&m.getPopup(); const node=el&&el.getElement();
  const box=node&&node.querySelector(".leaflet-popup-content");
  if(!box) return;
  box._openedAt=Date.now();          // refreshed even on a re-bind
  if(box._picks) return;
  box._picks=1;
  L.DomEvent.disableClickPropagation(box);
  box.addEventListener("click",e=>{
    const b=e.target.closest("[data-rc]"); if(!b) return;
    /* The popup opens on the first tap. If the second tap of a double-tap
       lands here it means the rider was pinning the stop, not choosing a
       line, so ignore anything that arrives while a double-tap could still
       be in progress. Deliberately picking a line takes longer than this. */
    if(Date.now()-(box._openedAt||0) < DTAP.ms+120) return;
    const code=b.dataset.rc;
    m.closePopup();
    if(String(rline.code)===String(code)) return clearRoute(true);
    drawRoute(s,code,(s.routeMap&&s.routeMap[code])||{});
  });
}
/* What the map draws: the stops around you plus any pinned stop that the
   nearby sweep didn't return — a favourite should be findable on the map
   for the same reason it's pinned to the top of the list. */
function mapStops(){
  const out=state.stops.slice();
  const have={}; out.forEach(s=>{ have[String(s.code)]=1; });
  favs.forEach(f=>{
    const s=state.favLive[String(f.code)];
    if(s&&!have[String(f.code)]&&isFinite(s.lat)) out.push(s);
  });
  return out;
}
/* Leaflet caches the container size, and the map is display:none whenever
   the list is up, so it has to be re-measured on the way back. Only when it
   actually changed, though: renderMap runs on every refresh sweep, and an
   unconditional resize means a forced reflow and a tile repass thirty
   seconds apart for no reason — and, worse, in the middle of a slide. */
function sizeMap(){
  const el=document.getElementById("map"); if(!el) return;
  const w=el.clientWidth,h=el.clientHeight;
  if(!w||!h||(map._oaW===w&&map._oaH===h)) return;
  map._oaW=w; map._oaH=h; map.invalidateSize({animate:false});
}
function renderMap(){
  ensureMap();
  sizeMap();
  const drawn=mapStops();
  // the key includes which stops are pinned, so pinning rebuilds the pins
  const codes=drawn.map(s=>s.code).join(",")+"|"+favs.map(f=>f.code).join(",");
  if(codes!==state._mapCodes){
    layerStops.clearLayers(); mapMarkers={};
    meMarker=L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:1000}).addTo(layerStops);
    const b=[[here.lat,here.lng]];
    drawn.forEach(s=>{
      if(!isFinite(s.lat)||!isFinite(s.lng)) return;
      const m=L.marker([s.lat,s.lng],{icon:stopIcon(s)}).addTo(layerStops);
      /* autoPan is off on purpose. Leaflet's default is to shove the map so
         a tall popup fits, which slides the stop's dot down the screen and
         puts the popup where your finger already is — so the second tap of
         a double-tap lands on a line chip and draws a route instead of
         pinning the stop. With the map held still, the popup opens above
         the dot and the dot stays under your thumb. The popup is capped in
         height (.leaflet-popup-content) so it has room to do that. */
      m.bindPopup(()=>popupHtml(s),{autoPan:false,closeButton:true});
      m.on("popupopen",()=>{
        bindPopupPicks(m,s);
        const jobs=[];
        if(!s.routesLoaded) jobs.push(loadRoutes(s));
        if(!s.arrLoaded)    jobs.push(loadArrivals(s));
        if(jobs.length) Promise.all(jobs).catch(()=>{}).then(()=>{
          // No line serves this stop any more — drop the pin instead of
          // showing an empty popup, remember it locally so the next
          // refresh doesn't resurrect it, and tell the server so it
          // disappears for everyone (the server re-verifies first).
          if(s.routesLoaded && !s.lines.length){
            markStopDead(s.code);
            m.closePopup(); layerStops.removeLayer(m); delete mapMarkers[s.code];
            state.stops=state.stops.filter(x=>x.code!==s.code);
            state._mapCodes=null;   // force a rebuild with the pin gone
            updateRadiusLabel(); renderView(); return;
          }
          if(m.isPopupOpen()){ m.setPopupContent(popupHtml(s)); bindPopupPicks(m,s); }
        });
      });
      m.on("add",()=>bindMarkerGestures(m,s));
      bindMarkerGestures(m,s);
      s._drawn=s.lines.length; mapMarkers[s.code]=m; b.push([s.lat,s.lng]);
    });
    if(!state.mapFitted&&!rline.code&&b.length>1){ map.fitBounds(b,{padding:[50,50],maxZoom:16}); state.mapFitted=true; }
    state._mapCodes=codes;
  } else {
    if(meMarker) meMarker.setLatLng([here.lat,here.lng]);
    drawn.forEach(s=>{
      const m=mapMarkers[s.code]; if(!m) return;
      // redraw when the line count changes OR the stop was pinned/unpinned
      const fav=isFav(s.code)?1:0;
      /* setIcon throws the marker's element away and builds a new one. Do
         that while a tap is in flight and the tap is lost, which is the
         "sometimes the popup just doesn't open" — a refresh sweep landed
         between finger down and finger up. Never re-icon a marker whose
         popup is open; the icon is redrawn when it closes. */
      if(((s._drawn||0)!==s.lines.length||s._fav!==fav) && !(m.isPopupOpen&&m.isPopupOpen())){
        m.setIcon(stopIcon(s)); s._drawn=s.lines.length; s._fav=fav;
        bindMarkerGestures(m,s); }
      if(m.isPopupOpen&&m.isPopupOpen()){ m.setPopupContent(popupHtml(s)); bindPopupPicks(m,s); }
    });
  }
}

/* --------------------------- data loading -------------------------- */
function samplePoints(lat,lng,r){
  if(r<=600) return [[lat,lng]];
  const d=r*0.62, dLat=d/111320, dLng=d/(111320*Math.cos(lat*Math.PI/180));
  return [[lat,lng],[lat+dLat,lng],[lat-dLat,lng],[lat,lng+dLng],[lat,lng-dLng]];
}
/* ---------------------------- favourites ---------------------------
 * Long-press a stop to pin it. Pinned stops sort to the top of the list
 * and keep a ★. We store the whole stop (name + coords), not just the
 * code, so a favourite OUT of range can still be shown — its arrivals
 * are fetched separately, which is the point: your home stop while
 * you're at work. Capped, because each out-of-range favourite costs a
 * couple of requests per refresh. */
const FAV_KEY="favStops", FAV_MAX=6;
let favs=[];
try{ const v=JSON.parse(localStorage.getItem(FAV_KEY)||"[]");
  if(Array.isArray(v)) favs=v.filter(f=>f&&f.code).slice(0,FAV_MAX); }catch(_){}
function saveFavs(){ try{ localStorage.setItem(FAV_KEY,JSON.stringify(favs)); }catch(_){} }
function isFav(code){ return favs.some(f=>String(f.code)===String(code)); }
function afterFav(msg){
  saveFavs();
  if(navigator.vibrate) try{ navigator.vibrate(18); }catch(_){}
  toast(msg);
  renderView();
  if($("#stopcard").classList.contains("on")) renderStopCard();
}
/* Adding and removing are separate gestures now, not one toggle.
   Double-tap only ever ADDS; long-press only ever REMOVES. A toggle
   bound to a double-tap meant the same gesture did opposite things
   depending on state you could not see mid-tap, so an accidental
   repeat silently undid the thing you had just done. */
function addFav(s){
  const code=String(s.code);
  if(isFav(code)){ toast(t("favAlready")); return; }
  if(favs.length>=FAV_MAX){ toast(t("favFull")); return; }
  favs.push({code,name_el:s.name_el||"",name_en:s.name_en||"",
    street:s.street||"",lat:Number(s.lat),lng:Number(s.lng)});
  afterFav(t("favAdded"));
}
function removeFav(s){
  const code=String(s.code);
  if(!isFav(code)) return;               // long-press on a plain stop: not for us
  favs=favs.filter(f=>String(f.code)!==code);
  afterFav(t("favRemoved"));
}
/* Does this stop have a bus worth waiting for? */
function hasImminent(s){
  return (s.arrivals||[]).some(a=>isFinite(a.min)&&a.min<=CONFIG.imminentMin);
}
/* Promotion tier: 0 = a bus is coming, 1 = nothing coming, or we don't
   know yet. "Don't know" deliberately ranks WITH dead rather than with
   live: an un-loaded stop is one the server didn't detail, i.e. outside
   listPool, and letting those pass for live would float far unknowns
   over near stops only to demote them a second later once their arrivals
   land. /nearby returns the pool's arrivals in the same response, so in
   practice the tier is known by first paint and nothing reshuffles. */
function listRank(s){ return hasImminent(s)?0:1; }

/* The list: favourites first (in the order pinned), then the nearest
   stops. A favourite that isn't in range is carried in from `favLive`.
   Capped at CONFIG.listStops TOTAL — favourites count toward the cap
   rather than adding on top of it, or a pinned stop would push an
   un-loaded one past the loaded window and it would sit forever on the
   grey loading bars.

   Within the un-pinned remainder, distance is the sort key but a DEAD
   stop yields to a live one: the nearest shelter is useless if nothing
   calls there for half an hour, and the point of the screen is "what can
   I actually catch". So the order is (has an imminent arrival, then
   distance) — a stop 300 m away with a bus in 4 minutes outranks one at
   60 m whose next bus is in 40. The server details CONFIG.listPool stops,
   which is wider than the cap precisely so there are live candidates to
   promote. */
function listStops(){
  const byCode={};
  (state.stops||[]).forEach(s=>{ byCode[String(s.code)]=s; });
  const pinned=[];
  favs.forEach(f=>{
    const live=byCode[String(f.code)]||state.favLive[String(f.code)];
    if(live) pinned.push(live);
  });
  /* With "hide stops with no arrivals" on, a dead stop is dropped rather
     than demoted — however close it is. Favourites are exempt: pinning
     one is an explicit "always show me this".
     The filter demands a KNOWN arrival, not merely the absence of a known
     gap. Letting un-loaded stops through would pull in ones beyond the
     detailed pool, only to drop them again a moment later once their
     arrivals landed — a list that reshuffles itself after every refresh. */
  const ranked=(state.stops||[]).filter(s=>!isFav(s.code))
    .sort((a,b)=>listRank(a)-listRank(b)||a.dist-b.dist);
  let rest=hideEmpty?ranked.filter(hasImminent):ranked;
  // never blank the screen: if the filter leaves nothing, show the normal list
  if(hideEmpty&&!rest.length&&!pinned.length) rest=ranked;
  // never drop a favourite the user explicitly pinned, even past the cap
  const cap=Math.max(CONFIG.listStops,pinned.length);
  return pinned.concat(rest).slice(0,cap);
}
/* Fetch arrivals for favourites the nearby sweep didn't return. */
/* The sweep answered for them, so shape its rows into the same live stop
   objects the per-stop path builds. Returning true means nothing more is
   owed this round. */
function farFavsFromSweep(rows){
  favSweep=false;
  if(!rows) return false;
  favSweep=true;
  rows.forEach(row=>{
    const key=String(row.code);
    const f=favs.find(x=>String(x.code)===key)||{};
    let s=state.favLive[key];
    if(!s){
      s={code:key,name_el:f.name_el,name_en:f.name_en,street:f.street||"",
        lat:Number(f.lat),lng:Number(f.lng),dist:NaN,
        lines:[],routes:[],routeMap:{},arrivals:[],routesLoaded:false,arrLoaded:false};
      state.favLive[key]=s;
    }
    const routes=(row.routes&&row.routes.length)?row.routes:s.routes;
    const rm={}; (routes||[]).forEach(r=>{ rm[r.code]={line:r.id,el:r.el,en:r.en}; });
    s.routes=routes||[]; s.routeMap=rm;
    s.lines=(row.lines&&row.lines.length)?row.lines:s.lines;
    s.routesLoaded=(routes||[]).length>0;
    s.arrivals=(row.arrivals||[]).map(a=>({code:String(a.code||""),veh:String(a.veh||""),min:a.min}));
    s.arrLoaded=true;
    if(isFinite(here.lat)&&isFinite(s.lat)) s.dist=haversine(here.lat,here.lng,s.lat,s.lng);
  });
  return true;
}
let favSweep=false;

async function loadFarFavs(){
  if(!favs.length) return;
  // the sweep already carried them; asking again is the bug this replaced
  if(favSweep){ renderView(); return; }
  const have={}; (state.stops||[]).forEach(s=>{ have[String(s.code)]=1; });
  const missing=favs.filter(f=>!have[String(f.code)]);
  if(!missing.length) return;
  await withLimit(missing.map(f=>async()=>{
    const key=String(f.code);
    let s=state.favLive[key];
    if(!s){
      s={code:key,name_el:f.name_el,name_en:f.name_en,street:f.street||"",
        lat:Number(f.lat),lng:Number(f.lng),dist:NaN,
        lines:[],routes:[],routeMap:{},arrivals:[],routesLoaded:false,arrLoaded:false};
      state.favLive[key]=s;
    }
    if(isFinite(here.lat)&&isFinite(s.lat)) s.dist=haversine(here.lat,here.lng,s.lat,s.lng);
    try{
      if(!s.routesLoaded) await loadRoutes(s);
      await loadArrivals(s);
    }catch(_){}
  }),3);
  renderView();
}

/* ---------------------- dead stops (no lines) ----------------------
 * A stop nobody serves any more should vanish for good. The server keeps
 * the shared list, but it only probes a few unknown stops per request —
 * so when the client is the one that discovers a dead stop (by opening
 * its popup) it must (a) remember it locally, or the next /nearby brings
 * it straight back, and (b) tell the server, which re-verifies with OASA
 * before recording it for everyone. */
const DEAD_KEY="deadStops";
let deadStops=new Set();
try{ const v=JSON.parse(localStorage.getItem(DEAD_KEY)||"[]");
  if(Array.isArray(v)) deadStops=new Set(v.map(String)); }catch(_){}
function markStopDead(code){
  code=String(code); if(!code||deadStops.has(code)) return;
  deadStops.add(code);
  // keep the local list from growing without bound
  if(deadStops.size>400) deadStops=new Set([...deadStops].slice(-300));
  try{ localStorage.setItem(DEAD_KEY,JSON.stringify([...deadStops])); }catch(_){}
  if(hasBackend()) fetch(base()+"/stops/dead",{method:"POST",cache:"no-store",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({code})})
    .catch(()=>{});
}
function notDead(list){ return (list||[]).filter(s=>!deadStops.has(String(s.code))); }

function mapStop(s){
  const lat=Number(pick(s,"StopLat","StopY","stop_lat"));
  const lng=Number(pick(s,"StopLng","StopX","stop_lng"));
  const dist=(isFinite(lat)&&isFinite(lng))?haversine(here.lat,here.lng,lat,lng):Infinity;
  return { code:String(pick(s,"StopCode","StopID","stop_code")||""),
    name_el:pick(s,"StopDescr","StopDescrEng")||"", name_en:pick(s,"StopDescrEng","StopDescr")||"",
    street:pick(s,"StopStreet","StopStreetEng")||"", lat,lng,dist,
    lines:[],routes:[],routeMap:{},arrivals:[],routesLoaded:false,arrLoaded:false };
}
async function loadRoutes(s){
  const routes=await oasa("webRoutesForStop",s.code);
  const rm={},seen=new Set(),lines=[],all=[];
  (Array.isArray(routes)?routes:[]).forEach(r=>{
    const rc=pick(r,"RouteCode","route_code"); if(rc==null) return;
    const id=pick(r,"LineID","line_id","LineCode","line_code");
    const el=pick(r,"RouteDescr","route_descr","LineDescr","line_descr");
    const en=pick(r,"RouteDescrEng","route_descr_eng","LineDescrEng","line_descr_eng");
    rm[String(rc)]={line:id,el,en};
    all.push({code:String(rc),id:String(id||rc),el,en});
    const key=String(id||rc);
    if(id&&!seen.has(key)){ seen.add(key); lines.push({id:String(id),el,en}); }
  });
  s.routeMap=rm; s.routes=all;
  s.lines=lines.sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  s.routesLoaded=true;
}
async function loadArrivals(s){
  const arr=await oasa("getStopArrivals",s.code);
  s.arrivals=(Array.isArray(arr)?arr:[])
    .map(a=>({code:String(pick(a,"route_code","RouteCode")||""),
      veh:String(pick(a,"veh_code","VEH_NO","VEH_CODE")||""),
      min:parseInt(pick(a,"btime2","btime","stop_time")||"999",10)}))
    .filter(a=>isFinite(a.min)).sort((x,y)=>x.min-y.min);
  s.arrLoaded=true;
}

/* One request instead of ~9: the Worker fans out to OASA for us. */
async function loadStopsBatch(){
  /* Favourites ride along with the sweep. Each one pinned outside the
     nearby set used to be its own request, every 30 s — three of them and
     a session cost four times what it should. The server skips any that
     the sweep already returned. */
  const favQ=favs.length?`&favs=${favs.map(f=>encodeURIComponent(f.code)).join(",")}`:"";
  const u=`${base()}/nearby?lat=${here.lat}&lng=${here.lng}&radius=${state.radius}`
        +`&limit=${CONFIG.listPool}&markers=${CONFIG.maxMarkers}${favQ}`;
  const r=await fetch(u,{cache:"no-store"});
  if(!r.ok) throw new Error("nearby "+r.status);
  const j=await r.json();
  if(Array.isArray(j.reports)){ state.reports=j.reports; repBadge(); }
  farFavsFromSweep(Array.isArray(j.favs)?j.favs:null);
  const prev={}; state.stops.forEach(s=>prev[s.code]=s);
  state.stops=notDead(j.stops).filter(s=>!(s.routes&&s.routes.length===0&&s.lines&&s.lines.length===0&&s.detail)).map(s=>{
    const p=prev[s.code]||{};
    const routes=(s.routes&&s.routes.length)?s.routes:(p.routes||[]);
    const rm={}; routes.forEach(r=>{ rm[r.code]={line:r.id,el:r.el,en:r.en}; });
    return {
      code:String(s.code), name_el:s.name_el||"", name_en:s.name_en||"", street:s.street||"",
      lat:Number(s.lat), lng:Number(s.lng), dist:Number(s.dist),
      lines:(s.lines&&s.lines.length)?s.lines:(p.lines||[]),
      routes, routeMap:rm,
      arrivals: s.detail ? (s.arrivals||[]).map(a=>({code:String(a.code||""),veh:String(a.veh||""),min:a.min}))
        : (p.arrivals||[]),
      routesLoaded: routes.length>0,
      arrLoaded: !!s.detail || !!p.arrLoaded
    };
  });
  state._mapCodes=null;
  fetchedFrom={lat:here.lat,lng:here.lng};
  markLoaded();
  updateRadiusLabel(); renderView();
  warmMap();
  loadFarFavs();
  fillVisibleArrivals();
}

/* The guarantee behind the cap: whatever the list is about to SHOW, it
   shows with arrivals. The server loads the closest CONFIG.listStops, so
   normally there is nothing left to do; this only fires for a stop the
   list surfaces that the batch didn't cover (a far favourite reordering
   the window, or the server trimming under its subrequest budget). It is
   bounded by the cap, so at most a handful of requests, and it means a
   row can never sit on the grey loading bars forever. Favourites are left
   to loadFarFavs so we don't fetch the same stop twice. */
async function fillVisibleArrivals(){
  const need=listStops().filter(s=>s&&!s.arrLoaded&&!isFav(s.code));
  if(!need.length) return;
  await withLimit(need.map(s=>async()=>{
    try{ if(!s.routesLoaded) await loadRoutes(s); await loadArrivals(s); }catch(_){}
  }),4);
  if(state.view==="list") renderView();
}

async function loadStops(){
  if(loading) return; loading=true;
  try{
    await ensureMode();
    if(hasBackend()){ await loadStopsBatch(); loading=false; return; }
    await loadStopsLegacy();
  }catch(e){
    if(state.view==="list")
      $("#list").innerHTML=`<div class="msg"><b>${esc(navigator.onLine===false?t("offline"):t("err"))}</b><br><button onclick="startRefresh()">${t("retry")}</button></div>`;
  }
  loading=false;
}

/* Fallback path (no backend — e.g. opened as a local file via CORS proxies). */
async function loadStopsLegacy(){
    const pts=samplePoints(here.lat,here.lng,state.radius);
    const res=await Promise.all(pts.map(p=>oasa("getClosestStops",p[0],p[1]).catch(()=>null)));
    const byCode={};
    res.forEach(arr=>{ if(Array.isArray(arr)) arr.forEach(s=>{
      const c=String(pick(s,"StopCode","StopID","stop_code")||""); if(c&&!byCode[c]) byCode[c]=s; }); });
    const prev={}; state.stops.forEach(s=>prev[s.code]=s);
    let stops=notDead(Object.values(byCode).map(mapStop))
      .filter(s=>isFinite(s.dist)&&s.dist<=state.radius)
      .sort((a,b)=>a.dist-b.dist).slice(0,CONFIG.maxMarkers);
    stops.forEach(s=>{ const p=prev[s.code]; if(p){
      s.lines=p.lines; s.routes=p.routes; s.routeMap=p.routeMap; s.routesLoaded=p.routesLoaded;
      s.arrivals=p.arrivals; s.arrLoaded=p.arrLoaded; } });
    state.stops=stops; state._mapCodes=null;
    fetchedFrom={lat:here.lat,lng:here.lng};
    markLoaded();
    updateRadiusLabel(); renderView();
    warmMap();

    await withLimit(state.stops.filter(s=>!s.routesLoaded).map(s=>()=>loadRoutes(s)),6);
    renderView();

    const need=state.stops.slice(0,CONFIG.listStops).slice();
    state.stops.forEach(s=>{ const m=mapMarkers[s.code];
      if(m&&m.isPopupOpen&&m.isPopupOpen()&&!need.includes(s)) need.push(s); });
    await withLimit(need.map(s=>()=>loadArrivals(s)),4);
    renderView(); updateRadiusLabel();
    loadFarFavs();
}

/* Polling pauses when the tab is hidden — a forgotten tab used to keep
   refreshing all night for nobody. Coming back refreshes immediately. */
let paused=false, lastTouch=Date.now(), sleeping=false;

/* Polling is tiered, because an open tab that nobody is looking at used to
   refresh forever:
     active   — every 30s
     idle     — after 4 min without interaction, every 45s
     asleep   — after 15 min, stop entirely and wait for a tap
     hidden   — stop immediately (tab backgrounded / phone locked) */
function stopTimers(){ clearInterval(timer); timer=null; }
/* When the numbers were last refreshed. The old two-pixel bar animated a
   width every 250 ms forever, which is a repaint per tick on every device
   for information nobody reads mid-sweep. One line of text, updated every
   20 s, says the same thing and costs nothing. */
let lastLoad=0;
function markLoaded(){ lastLoad=Date.now(); paintFresh(); }
function paintFresh(){
  const el=$("#fresh"); if(!el) return;
  if(!lastLoad){ if(el.textContent){ el.textContent=""; el.classList.remove("stale"); } return; }
  const secs=Math.round((Date.now()-lastLoad)/1000);
  const txt=secs<15?t("freshNow"):t("freshAgo")(secs<90?`${secs}${t("secShort")}`
    :`${Math.round(secs/60)}${t("minShort")}`);
  // called four times a second, so never write what is already there
  if(el.textContent!==txt) el.textContent=txt;
  el.classList.toggle("stale",secs>150);
}
function currentInterval(){
  return (Date.now()-lastTouch > CONFIG.idleAfter) ? CONFIG.idleMs : CONFIG.refreshMs;
}
function showSleep(){
  sleeping=true; stopTimers(); stopWatch();
  const b=$("#wake"); if(b) b.classList.add("on");
}
function wake(){
  const b=$("#wake"); if(b) b.classList.remove("on");
  sleeping=false; lastTouch=Date.now(); startRefresh();
}
/* Why a 250 ms tick drives a 30 s refresh.
 *
 * A bare setInterval(loadStops, 30000) is wrong in two ways on a phone.
 * Browsers throttle long timers on a page that looks idle, and a plain
 * interval has no memory: if a tick is deferred you do not get it late,
 * you get it a whole period later. Between the two, arrivals were landing
 * a minute or more behind the sign at the stop, and a bus that had already
 * gone kept its row until the sweep that never came.
 *
 * So the deadline is the state and the tick only asks whether it has
 * passed. Late ticks self-correct instead of compounding, and the tier
 * (active / idle) is re-read at each refresh rather than frozen when the
 * timer was created. This is the cadence the progress bar used to run on;
 * the bar is what was wasteful, not the tick, since it wrote a style four
 * times a second. Comparing two numbers costs nothing. */
const TICK_MS=250;
function startRefresh(){
  stopTimers();
  if(document.hidden){ paused=true; stopWatch(); return; }
  paused=false; sleeping=false;
  if(here.gps) startWatch();
  const b=$("#wake"); if(b) b.classList.remove("on");
  loadStops();
  nextAt=Date.now()+currentInterval();
  timer=setInterval(tick,TICK_MS);
}
function tick(){
  const now=Date.now();
  if(now-lastTouch > CONFIG.sleepAfter) return showSleep();
  if(now>=nextAt){ nextAt=now+currentInterval(); loadStops(); }
  paintFresh();
}
function touched(){
  const wasIdle = Date.now()-lastTouch > CONFIG.idleAfter;
  lastTouch=Date.now();
  if(sleeping) return;                 // needs an explicit tap on the wake button
  if(wasIdle && !document.hidden) startRefresh();
}
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>
  window.addEventListener(ev,touched,{passive:true}));
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ stopTimers(); stopWatch(); paused=true; }
  else { lastTouch=Date.now();
    if(sleeping) return;
    if(paused){ paused=false; startRefresh(); } }
});


/* ====================== keeping up while you walk ==================== *
 * The board refreshed every 30 s against a position taken ONCE, at boot.
 * Walk 150 m and every distance, every walking estimate and the ordering
 * of the whole list still described where you set off from, while the
 * arrivals beside them were seconds old. The two halves of the screen
 * disagreed, and the stale half was the one you were standing in.
 *
 * So the fix is watched, not sampled. What that has to get right:
 *
 *   - a location you set BY HAND is yours. Searching an address or
 *     dropping the pin means "show me there"; a GPS fix arriving after it
 *     must not drag the board back to your feet.
 *   - a fix is not a fact. Phones emit 300 m garbage between good fixes,
 *     especially indoors and in street canyons, and one of those would
 *     teleport the list. Anything worse than the accuracy gate is dropped
 *     unless we have nothing better at all.
 *   - moving a few metres is not moving. Below the move threshold nothing
 *     happens, or the list would churn while you stand at the kerb.
 *   - most moves need no request. Distances, walking times and the
 *     ordering are all computable from coordinates we already hold, so a
 *     short walk re-sorts locally and instantly; only drifting far enough
 *     to change WHICH stops are near you costs a fetch.
 * ------------------------------------------------------------------ */
const GEO = {
  accGate: 120,     // metres; a fix worse than this is noise, not a position
  moveM: 25,        // metres before we accept that you have moved at all
  refetchM: 150,    // metres of drift before the nearby set is worth refetching
  minFetchMs: 15000,// never refetch faster than this, however fast you walk
  maxAgeMs: 10000,  // a cached fix older than this is not "where you are now"
};
let watchId = null, fetchedFrom = null, lastGeoFetch = 0, meMarker = null;

function startWatch() {
  if (watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(onFix, () => {}, {
    enableHighAccuracy: true, maximumAge: GEO.maxAgeMs, timeout: 30000,
  });
}
function stopWatch() {
  if (watchId == null) return;
  try { navigator.geolocation.clearWatch(watchId); } catch (_) {}
  watchId = null;
}

function onFix(p) {
  if (!here.gps) return;                       // a location you chose stays chosen
  const la = p.coords.latitude, ln = p.coords.longitude;
  const acc = Number(p.coords.accuracy);
  if (!isFinite(la) || !isFinite(ln)) return;
  // a wild fix is worse than a slightly old one
  if (isFinite(acc) && acc > GEO.accGate && here.acc != null && here.acc <= GEO.accGate) return;
  rememberPos(p);

  const moved = haversine(here.lat, here.lng, la, ln);
  const sharper = here.acc != null && isFinite(acc) && acc < here.acc * 0.6;
  if (moved < GEO.moveM && !sharper) { here.acc = isFinite(acc) ? acc : here.acc; return; }

  here.lat = la; here.lng = ln; here.acc = isFinite(acc) ? acc : null;
  onOriginMoved();
}

/* Everything a move changes that costs nothing: how far each stop is, how
   long it takes to walk there, what order they belong in, and where the
   dot sits on the map. */
function onOriginMoved() {
  const fix = s2 => {
    if (!s2 || !isFinite(s2.lat) || !isFinite(s2.lng)) return;
    s2.dist = haversine(here.lat, here.lng, s2.lat, s2.lng);
  };
  (state.stops || []).forEach(fix);
  Object.values(state.favLive || {}).forEach(fix);
  state.stops = (state.stops || []).sort((a, b) => a.dist - b.dist);

  if (meMarker) meMarker.setLatLng([here.lat, here.lng]);
  $("#locwhere").textContent = here.label || t("you");
  updateRadiusLabel();
  renderView();

  // and the one thing that does cost: a different set of stops is near you
  const drift = fetchedFrom ? haversine(fetchedFrom.lat, fetchedFrom.lng, here.lat, here.lng) : Infinity;
  if (drift >= GEO.refetchM && Date.now() - lastGeoFetch >= GEO.minFetchMs) {
    lastGeoFetch = Date.now();
    nextAt = Date.now() + currentInterval();   // this counts as the sweep
    loadStops();
  }
}

/* ------------------------- location flow --------------------------- */
function openSheet(){ $("#sheetbg").classList.add("on"); }
function closeSheet(){ $("#sheetbg").classList.remove("on"); }
function setLocation(lat,lng,label,gps,fromSheet){
  here={lat,lng,label,gps,acc:null}; state.mapFitted=false; state._mapCodes=null; state.stops=[];
  fetchedFrom=null;
  if(fromSheet) closeSheet();
  // watching only makes sense while the board is meant to follow you
  if(gps) startWatch(); else stopWatch();
  applyStatics(); startRefresh();
}
/* One tap, not three. The old flow fired getCurrentPosition with an 8s
   timeout at boot; if you hadn't answered the browser's permission
   prompt within 8s the call "failed", the sheet opened, and you had to
   tap 📍 to start over. Now: ask the Permissions API first — already
   denied goes straight to the sheet (no doomed call), already granted
   gets a normal timeout, and a pending prompt gets 45s so the dialog
   can't outlive the timer. The last good fix is cached so the next
   launch shows your area instantly while a fresh fix arrives. */
function rememberPos(p){
  try{ localStorage.setItem("lastPos",JSON.stringify({
    lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()})); }catch(_){}
}
/* ---------------------- when location is blocked --------------------- *
 * A browser asks for location permission once. Say no, and every later
 * getCurrentPosition fails instantly and silently — which is what made
 * this look broken: the sheet opened, "use my location" did nothing at
 * all, and there was nothing on screen saying why or what to do.
 *
 * Nothing the page can call will re-prompt. Only the person can, in the
 * browser's own site settings. So the app's job here is exactly three
 * things: say plainly that it was blocked, say where to unblock it, and
 * notice by itself the moment they have. */
function geoBlocked(){
  const box=$("#geoblock");
  $("#s-p").textContent=t("denied");
  $("#gb-h").textContent=t("gbH");
  $("#gb-p").textContent=t("gbP");
  $("#gb-steps").innerHTML=t("gbSteps");
  $("#gb-retry").textContent=t("gbRetry");
  box.hidden=false;
  openSheet();
  // the sheet may already be open, so give the eye something that moved
  box.classList.remove("pulse"); void box.offsetWidth; box.classList.add("pulse");
  $("#locwhere").textContent=here.label||PRESETS[0].el;
}
function geoUnblocked(){ const b=$("#geoblock"); if(b) b.hidden=true; }

/* If they change the setting in another tab or in site settings, this
   fires without a reload — so the app fixes itself rather than waiting to
   be restarted, which nobody would think to do. */
function watchGeoPermission(){
  if(!(navigator.permissions&&navigator.permissions.query)) return;
  navigator.permissions.query({name:"geolocation"}).then(st=>{
    st.onchange=()=>{
      if(st.state==="granted"){ geoUnblocked(); toast(t("gbOk")); useGPS(); }
      else if(st.state==="denied") geoBlocked();
    };
  }).catch(()=>{});
}

function useGPS(){
  $("#locwhere").textContent=t("locating");
  if(!navigator.geolocation){ openSheet(); return; }
  const go=timeout=>navigator.geolocation.getCurrentPosition(
    p=>{ geoUnblocked(); rememberPos(p);
      setLocation(p.coords.latitude,p.coords.longitude,t("you"),true,true); },
    err=>{
      if(err&&err.code===1){ geoBlocked(); return; }
      // not blocked, just no fix: a timeout or the phone's radio being cold
      if(!here.gps){ openSheet(); toast(t("gbNoFix")); }
      $("#locwhere").textContent=here.label||PRESETS[0].el;
    },
    {enableHighAccuracy:true,timeout,maximumAge:30000});
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:"geolocation"}).then(st=>{
      if(st.state==="denied"){ geoBlocked(); return; }
      geoUnblocked();
      go(st.state==="granted"?12000:45000);
    }).catch(()=>go(25000));
  } else go(25000);
}
async function doSearch(){
  const q=$("#addr").value.trim(); if(!q) return;
  const box=$("#results"); box.innerHTML=`<div class="res-msg">${t("searching")}</div>`;
  try{
    const items=await geocode(q,{focus:(here&&isFinite(here.lat))?here:null});
    if(!items.length){
      box.innerHTML=`<div class="res-msg">${esc(emptyMsg(false,"noResults"))}</div>`; return; }
    box.innerHTML="";
    items.forEach(it=>{ const b=document.createElement("button"); b.className="res";
      b.textContent=it.display_name;
      b.onclick=()=>setLocation(Number(it.lat),Number(it.lon),placeLabel(it)||t("you"),false,true);
      box.appendChild(b); });
  }catch(_){ box.innerHTML=`<div class="res-msg">${esc(emptyMsg(true,"err"))}</div>`; }
}

/* ==================== route preview (long-press list) ============== */
let rmap=null,rlayer=null;
function polyOf(pts){
  return (Array.isArray(pts)?pts:[]).slice()
    .sort((a,b)=>Number(a.routed_order||0)-Number(b.routed_order||0))
    .map(p=>[Number(p.routed_y),Number(p.routed_x)])
    .filter(p=>isFinite(p[0])&&isFinite(p[1]));
}
function nearestIdx(pl,pt){ let bi=0,bd=Infinity;
  for(let i=0;i<pl.length;i++){ const d=(pl[i][0]-pt[0])**2+(pl[i][1]-pt[1])**2; if(d<bd){bd=d;bi=i;} }
  return bi; }

/* Route preview. Opened two ways, and the only difference is whether we
   have a boarding stop: from the arrivals list we do (highlight the bit
   of the journey ahead of you), from the line search we don't (show the
   whole route end to end). `meta` carries the line labels in that second
   case, since there is no stop.routeMap to read them from. */
async function openRoutePreview(stop,routeCode,minutes,meta){
  const info=stop?(stop.routeMap[routeCode]||{}):(meta||{});
  $("#rp").classList.add("on");
  $("#rp-tile").textContent=info.line||routeCode;
  $("#rp-title").textContent=destOf(LANG==="en"?(info.en||info.el):(info.el||info.en))||"";
  $("#rp-sub").textContent=stop
    ? `${stopName(stop)} · ${minutes<=1?t("now"):minutes+"′"}`
    : t("wholeRoute");
  $("#rp-strip").innerHTML=`<div class="res-msg" style="color:var(--muted);font-size:13px;padding:8px 2px">${t("searching")}</div>`;
  if(!rmap){
    rmap=L.map("rpmap",{zoomControl:true});
    addTiles(rmap);
    rlayer=L.layerGroup().addTo(rmap);
    rmap.setView([here.lat,here.lng],14);
  } else rlayer.clearLayers();
  setTimeout(()=>rmap.invalidateSize(),70);

  const [pts,rstops,buses]=await Promise.all([
    oasa("webRouteDetails",routeCode).catch(()=>null),
    oasa("webGetStops",routeCode).catch(()=>null),
    oasa("getBusLocation",routeCode).catch(()=>null)]);

  const pl=polyOf(pts);
  const list=(Array.isArray(rstops)?rstops:[]).map(x=>({
    code:String(pick(x,"StopCode","StopID","stop_code")||""),
    name:(LANG==="en"?(clean(pick(x,"StopDescrEng","StopDescr"))||clean(pick(x,"StopDescr")))
                     :(clean(pick(x,"StopDescr","StopDescrEng"))))||"",
    lat:Number(pick(x,"StopLat","StopY","stop_lat")),
    lng:Number(pick(x,"StopLng","StopX","stop_lng"))
  })).filter(x=>isFinite(x.lat)&&isFinite(x.lng));

  let idx=-1;
  if(stop){
    idx=list.findIndex(x=>x.code===String(stop.code));
    if(idx<0&&list.length) idx=nearestIdx(list.map(x=>[x.lat,x.lng]),[stop.lat,stop.lng]);
  }
  const onward = idx>=0 ? list.slice(idx,idx+CONFIG.onward+1) : [];
  let ahead=[];                                  // the highlighted stretch, for the fit below

  // with a boarding stop: full route faint, the journey ahead bright.
  // without one: the whole line is the subject, so draw it all bright.
  if(pl.length){
    if(!stop){
      L.polyline(pl,{color:"#FFFFFF",weight:9,opacity:.95}).addTo(rlayer);
      L.polyline(pl,{color:"#17171A",weight:4.5,className:"flashline"}).addTo(rlayer);
      L.polyline(pl,{color:"#FFE24A",weight:2.5,opacity:1,className:"marchline"}).addTo(rlayer);
    } else {
      // The stretch behind you is context, so it stays flat grey. Everything
      // from this stop to the terminus is the journey you are about to make,
      // and gets the same live snake the map draws: white casing, pulsing
      // dark core, dashes marching the way the bus goes.
      L.polyline(pl,{color:"#B4B4AE",weight:3,opacity:.9}).addTo(rlayer);
      const from=idx>=0?list[idx]:(isFinite(stop.lat)?stop:null);
      const i0=from?nearestIdx(pl,[from.lat,from.lng]):-1;
      ahead=i0>=0?pl.slice(i0):[];
      if(ahead.length>1){
        L.polyline(ahead,{color:"#FFFFFF",weight:9,opacity:.95}).addTo(rlayer);
        L.polyline(ahead,{color:"#17171A",weight:4.5,className:"flashline"}).addTo(rlayer);
        L.polyline(ahead,{color:"#FFE24A",weight:2.5,opacity:1,className:"marchline"}).addTo(rlayer);
        L.marker(ahead[ahead.length-1],{icon:L.divIcon({className:"",
          html:`<div class="endm">${esc(destOf(LANG==="en"?(info.en||info.el):(info.el||info.en))||"▸")}</div>`,
          iconSize:[0,0],iconAnchor:[0,10]}),zIndexOffset:800}).addTo(rlayer);
      }
    }
  }
  // every stop on the route as a dot, so the plain stretches aren't blank
  list.forEach((x,i)=>{
    if(idx>=0 && i>=idx && i<=idx+CONFIG.onward) return;   // those get numbered markers below
    if(!stop){
      L.marker([x.lat,x.lng],{icon:L.divIcon({className:"",html:'<div class="nstop"></div>',
        iconSize:[11,11],iconAnchor:[5.5,5.5]})}).addTo(rlayer)
        .bindTooltip(`${i+1}. ${esc(x.name)}`,{direction:"top"});
      return;
    }
    L.circleMarker([x.lat,x.lng],{radius:2.5,color:"#5A6B8C",weight:1,
      fillColor:"#8A97AD",fillOpacity:.85}).addTo(rlayer).bindTooltip(esc(x.name),{direction:"top"});
  });
  onward.forEach((x,i)=>{
    if(i===0) return;
    L.marker([x.lat,x.lng],{icon:L.divIcon({className:"",html:'<div class="nstop"></div>',
      iconSize:[11,11],iconAnchor:[5.5,5.5]})}).addTo(rlayer).bindTooltip(`${i}. ${esc(x.name)}`,{direction:"top"});
  });
  if(stop&&isFinite(stop.lat)) L.marker([stop.lat,stop.lng],{icon:L.divIcon({className:"",
    html:'<div class="board"></div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:600})
    .addTo(rlayer).bindTooltip(esc(stopName(stop)),{direction:"top",permanent:false});
  L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:700}).addTo(rlayer);
  (Array.isArray(buses)?buses:[]).forEach(b=>{
    const la=Number(pick(b,"CS_LAT","cs_lat")),ln=Number(pick(b,"CS_LNG","cs_lng"));
    if(isFinite(la)&&isFinite(ln)) L.marker([la,ln],{icon:L.divIcon({className:"",
      html:'<div class="busm">🚌</div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:500}).addTo(rlayer);
  });

  // zoom: to the part of the journey that matters, or to the whole line
  const b=L.latLngBounds([]);
  if(stop){
    // fit the highlighted stretch, not just the next few stops: the snake now
    // runs to the terminus, and a highlight that leaves the screen is worse
    // than a slightly wider view.
    (ahead.length?ahead:onward.map(x=>[x.lat,x.lng])).forEach(p=>b.extend(p));
    b.extend([here.lat,here.lng]);
    if(isFinite(stop.lat)) b.extend([stop.lat,stop.lng]);
    if(b.isValid()) rmap.fitBounds(b,{padding:[45,45],maxZoom:15});
  } else {
    (pl.length?pl:list.map(x=>[x.lat,x.lng])).forEach(p=>b.extend(p));
    if(b.isValid()) rmap.fitBounds(b,{padding:[30,30]});
  }

  const strip = stop ? onward : list;
  $("#rp-strip").innerHTML = strip.length
    ? `<div class="sec-label">${stop?t("nextStops"):`${t("allStops")} · ${list.length}`}</div>`
      + strip.map((x,i)=>
        `<div class="ns${stop&&i===0?" first":""}"><div class="n">${stop?(i===0?"▶":i):(i+1)}</div>
          <div class="nm">${esc(x.name||("#"+x.code))}</div></div>`).join("")
    : `<div class="note">${t("noRoute")}</div>`;
}
function closeRP(){ $("#rp").classList.remove("on"); }

/* ================ one route, drawn on the main map =================
 * This used to be a carousel: long-press a stop and every line serving it
 * paraded past on a timer. It looked busy and answered a question nobody
 * had asked — you want ONE line, the one you are waiting for. So the
 * choice moved into the stop's popup, where the lines are already listed,
 * and nothing is drawn until you pick one.
 *
 * The drawing itself is unchanged: the same layered snake (white casing,
 * pulsing dark core, marching yellow dashes), the same destination label
 * at the far end, the same origin dot at the stop, the same fit to the
 * whole line. Only the trigger is different.
 *
 * `seq` guards against a slow route arriving after you picked another. */
const rline={code:null,seq:0,layer:null,saved:null,stop:null,cache:{}};
async function drawRoute(stop,code,info){
  if(!map||!code) return;
  const me=++rline.seq;
  if(!rline.saved) rline.saved={c:map.getCenter(),z:map.getZoom()};
  if(!rline.layer) rline.layer=L.layerGroup().addTo(map);
  rline.code=String(code); rline.stop=stop;

  const label=destOf(LANG==="en"?(info.en||info.el):(info.el||info.en))||"";
  $("#rl-tile").textContent=info.line||code;
  $("#rl-dest").textContent=label;
  $("#rl-from").textContent=stop?t("fromStop")(stopName(stop)):"";
  $("#rl").classList.add("on");

  let pl=rline.cache[code];
  if(!pl){ pl=polyOf(await oasa("webRouteDetails",code).catch(()=>null)); rline.cache[code]=pl; }
  if(rline.seq!==me) return;                 // a newer pick won the race

  rline.layer.clearLayers();
  if(!pl.length){ $("#rl-dest").textContent=t("noRoute"); return; }
  L.polyline(pl,{color:"#FFFFFF",weight:9,opacity:.95}).addTo(rline.layer);
  L.polyline(pl,{color:"#17171A",weight:4.5,className:"flashline"}).addTo(rline.layer);
  L.polyline(pl,{color:"#FFE24A",weight:2.5,opacity:1,className:"marchline"}).addTo(rline.layer);
  L.marker(pl[pl.length-1],{icon:L.divIcon({className:"",html:`<div class="endm">${esc(label||"▸")}</div>`,
    iconSize:[0,0],iconAnchor:[0,10]}),zIndexOffset:800}).addTo(rline.layer);
  if(stop&&isFinite(stop.lat)) L.marker([stop.lat,stop.lng],{icon:L.divIcon({className:"",
    html:'<div class="origin"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:900}).addTo(rline.layer);
  map.fitBounds(L.latLngBounds(pl),{padding:[42,42]});
}
function clearRoute(restore){
  rline.seq++; rline.code=null; rline.stop=null;
  if(rline.layer) rline.layer.clearLayers();
  $("#rl").classList.remove("on");
  if(restore&&rline.saved&&map) map.setView(rline.saved.c,rline.saved.z);
  rline.saved=null;
}


/* ======================== issue reports ========================== *
 * Riders flag what they see. Every flag is red and carries its own label
 * on the map. Colour carries the CATEGORY (red = something is wrong,
 * blue = who is present / what is operationally happening); the type
 * decides how long it lives — staff of any sort ride a bus for a few
 * stops but work a station for hours, and a broken lift outlasts both.
 * Reports clear themselves when they expire; only the person who filed
 * one can remove it early. */
/* What can be reported, per target kind. "bus" covers every surface
   vehicle — bus and trolley alike — and "metro" covers stations.

   There are no categories any more. One flag, one colour, one label you
   read instead of decode. Entries stay factual and staff-agnostic: "OASA
   staff on this line" is service information of the same kind as "no
   A/C". The app reports situations, never people. Mirrored server-side
   in REPORT_TYPES — keep the two in sync. */
const TYPES_BY_KIND={ bus:["breakdown","crowded","noac","security","staff"],
                      metro:["lift","escalator","nowheel","crowded","security","staff"] };
/* You may only flag the vehicle you are inside, or a station you are
   standing at — these numbers are what "inside" and "at" mean.

   Locality is enforced by the SHORTLIST, not by a verdict: only vehicles
   the server returned within gateM are offered, ranked by plausibility.
   See the long note above findMyBus for why gating on raw distance was
   the bug that made a moving bus impossible to flag. */
const ONBOARD={ metroRadius:600, maxRoutes:20,
  shortlist:10,       // candidates the co-movement pass is allowed to weigh
  gateM:800,          // how far out a candidate may start (matches SCAN.keepM)
  trackMs:8000,       // how long we watch our OWN position before scanning
  trackMin:3,         // fixes that make a track usable
  sampleMs:5500,      // gap between vehicle samples
  samples:3,          // total vehicle samples (1 up front + 2 while refining)
  minMove:20,
  staleS:40,          // assumed worst-case age of an OASA position fix
  maxRadius:900,      // never widen past this, however fast we're going
  moveMs:2,           // m/s above which we treat the rider as "in traffic"
  cosOK:0.75,         // heading agreement for "moving with you"
  paceOK:0.5,         // slower/faster ratio that still counts as the same
  crossMax:80,        // sideways offset that still counts as the same street
  maxStaleS:75,       // most staleness we'll believe when inferring a fix's age
  accMax:150 };       // above this the fix is too vague to reason about at all
/* Every flag is red now. Inspectors and faults differ in how long they
   live (see TTL in worker.js) and in what the label says, not in colour —
   a two-colour scheme just made people decode the palette before reading
   the word that was already there. */
function agoTxt(sec){
  const m=Math.max(0,Math.round(sec/60));
  if(m<1) return t("justNow");
  return `${m}${t("minShort")} ${t("agoShort")}`;
}
function issueLabel(ty){ return t("ti_"+ty)||ty; }
function myId(){
  let id=localStorage.getItem("subId");
  if(!id){ id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
    localStorage.setItem("subId",id); }
  return id;
}
function activeReports(){
  const now=Date.now()/1000;
  return (state.reports||[]).filter(r=>r.expires>now);
}
/* Every report is trusted. What used to be a confirmation tier is now
   just a head count: each reporter files their own record for a target,
   so N records sharing kind+targetId+type means N different people are
   saying the same thing. We collapse them into ONE flag carrying that
   number — otherwise four people reporting the same bus would stack four
   identical pins on top of each other. */
function reportKey(r){ return `${r.kind}|${r.targetId}|${r.type}`; }
function groupedReports(){
  const by=new Map();
  activeReports().forEach(r=>{
    const k=reportKey(r), g=by.get(k);
    if(!g){ by.set(k,{...r,count:1,mineId:r.mine?r.id:null}); return; }
    g.count++;
    g.mine=g.mine||r.mine;
    if(r.mine) g.mineId=r.id;
    // the group speaks with its most recent voice, and its freshest position
    if(r.at>g.at){ g.at=r.at; g.lat=r.lat; g.lng=r.lng; }
    if(r.expires>g.expires) g.expires=r.expires;
  });
  return [...by.values()];
}

/* Which flag, if any, applies to this arrival row? Prefer an exact
   vehicle match, fall back to one filed against the whole line. */
function reportForArrival(a){
  const rs=groupedReports().filter(r=>r.kind==="bus");
  return rs.find(r=>r.veh && a.veh && r.veh===a.veh)
      || rs.find(r=>!r.veh && r.routeCode===a.code)
      || null;
}
function reportForMetro(id){
  return groupedReports().find(r=>r.kind==="metro"&&r.targetId===String(id))||null;
}
function flagLine(r){
  if(!r) return "";
  const ago=agoTxt(Date.now()/1000-r.at);
  const n=r.count>1?` · ${esc(t("nReports")(r.count))}`:"";
  return `<div class="flagline">${esc(issueLabel(r.type))}${n} · ${ago}</div>`;
}

let repmap=null, replayer=null;
function openReports(){
  $("#rep").classList.add("on");
  $("#rep-title").textContent=t("reports");
  if(!repmap){
    repmap=L.map("repmap",{zoomControl:true});
    addTiles(repmap);
    replayer=L.layerGroup().addTo(repmap);
    repmap.setView([here.lat,here.lng],14);
    repmap.on("zoomend",syncFlagLabels);
  }
  setTimeout(()=>repmap.invalidateSize(),70);
  loadMetro();
  drawReportMap(); renderReportList();
  /* /nearby piggy-backs the public list; re-fetch with ?by= so our own
     rows come back marked mine:true and show their ✕ button. */
  refreshReports()
    .then(()=>{ drawReportMap(); if(!reportForm.open) renderReportList(); })
    .then(refreshFlagPositions).then(drawReportMap);
}
function closeReports(){ $("#rep").classList.remove("on"); }

async function loadMetro(){
  if(state.metro&&state.metro.length) return state.metro;
  if(!hasBackend()) return [];
  try{ const r=await fetch(base()+"/metro"); state.metro=r.ok?await r.json():[]; }
  catch{ state.metro=[]; }
  return state.metro;
}
function flagIcon(kind,count){
  // the head count rides on the pin, so a busy flag reads as busy even
  // when its label is hidden at low zoom
  const badge=count>1?`<span class="flag-n">${count>9?"9+":count}</span>`:"";
  return L.divIcon({className:"",
    html:`<div class="flag ${kind}">${badge}</div>`,
    iconSize:[17,17],iconAnchor:[8,8],popupAnchor:[0,-10]});
}
/* A flagged bus keeps driving after it was reported, so the pin has to
   follow it. We re-read live positions for the flagged vehicles only —
   a handful of routes, not the whole network. */
async function refreshFlagPositions(){
  const reps=activeReports().filter(r=>r.kind==="bus"&&r.routeCode&&r.veh);
  const codes=[...new Set(reps.map(r=>r.routeCode))].slice(0,8);
  if(!codes.length) return;
  const pos={};
  await withLimit(codes.map(c=>async()=>{
    const buses=await oasa("getBusLocation",c).catch(()=>null);
    (Array.isArray(buses)?buses:[]).forEach(v=>{
      const veh=String(pick(v,"VEH_NO","veh_no","VEH_CODE")||"");
      const la=Number(pick(v,"CS_LAT","cs_lat")), ln=Number(pick(v,"CS_LNG","cs_lng"));
      if(veh&&isFinite(la)&&isFinite(ln)) pos[veh]={lat:la,lng:ln};
    });
  }),4);
  state.busPos=Object.assign(state.busPos||{},pos);
}

/* Zoomed out, a dozen permanent labels overlap into an unreadable pile,
   so below this zoom they're hidden and the pin's count badge carries the
   weight; tap a pin for the popup, which says the same thing. */
const REPMAP={ labelZoom:15 };
function syncFlagLabels(){
  if(!repmap) return;
  const el=repmap.getContainer();
  el.classList.toggle("nolabels", repmap.getZoom()<REPMAP.labelZoom);
}

/* The map is a problem map: only buses and metro stations that carry an
   active flag are drawn. Nothing "ok" appears — if it's on here, it's a
   problem. (Your own dot stays, purely so the pins have a reference.) */
function drawReportMap(){
  if(!repmap) return;
  replayer.clearLayers();
  const b=L.latLngBounds([]);
  L.marker([here.lat,here.lng],{icon:meIcon(),zIndexOffset:900}).addTo(replayer);
  b.extend([here.lat,here.lng]);
  groupedReports().forEach(r=>{
    const live=(r.kind==="bus"&&r.veh&&state.busPos)?state.busPos[r.veh]:null;
    const la=live?live.lat:r.lat, ln=live?live.lng:r.lng;
    if(!isFinite(la)||!isFinite(ln)) return;
    // lineId/targetName come straight from a POST /reports body — untrusted.
    // Leaflet renders tooltip strings as HTML, so escape before interpolating.
    const who=r.kind==="bus"?`🚌 ${esc(r.lineId||"")}`:`Ⓜ ${esc(r.targetName||"")}`;
    const n=r.count>1?` · ${esc(t("nReports")(r.count))}`:"";
    const m=L.marker([la,ln],{icon:flagIcon(r.kind,r.count),zIndexOffset:600}).addTo(replayer);
    /* The label sits ON the map above the pin, because the whole point of
       this screen is "what is wrong and where" and a pin you must tap to
       identify answers only half of that. Below REPMAP.labelZoom they are
       hidden — at city scale a dozen of them overlap into noise — and the
       popup carries the same words on tap instead. */
    m.bindTooltip(esc(issueLabel(r.type))+(r.count>1?` ×${r.count}`:""),
      {permanent:true,direction:"top",offset:[0,-9],className:"flaglabel"});
    m.bindPopup(`${who} · ${esc(issueLabel(r.type))}${n} · ${esc(agoTxt(Date.now()/1000-r.at))}`);
    b.extend([la,ln]);
  });
  if(b.isValid()) repmap.fitBounds(b,{padding:[40,40],maxZoom:15});
  syncFlagLabels();
}

function renderReportList(){

  }).join(""):`<div class="note">${t("noReports")}</div>`;

async function refreshReports(){
  if(!hasBackend()) return;

     exposing anyone's reporter token to other clients. */
  try{ const r=await fetch(`${base()}/reports?by=${encodeURIComponent(myId())}`,{cache:"no-store"});
    if(r.ok) state.reports=await r.json(); }catch(_){}

function repBadge(){
