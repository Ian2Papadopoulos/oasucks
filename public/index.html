function hopChip(l) {
  if (l.mode === "walk") return `<span class="hop walk">⏱ ${Math.round(l.min)}′</span>`;
  const cls = l.mode === "metro" ? "hop metro" : "hop";
  return `<span class="${cls}">${esc(String(l.line))}</span>`;
}
function renderJourney() {
  const out = $("#jp-out"), res = jp.res || {};
  const list = res.itineraries || [];
  if (!list.length) {
    const why = res.reason === "closed" ? t("jpClosed") : res.reason === "tooclose" ? t("jpClose") : t("jpNone");
    out.innerHTML = `<div class="res-msg">${esc(why)}</div>`;
    return;
  }
  const label = { best: t("jpFast"), fewer: t("jpFewer"), metro: t("jpMetro") };
  out.innerHTML =
    `<div class="jp-note">${esc(t("jpDisclaim"))}</div>` +
    list.map((it, i) => {
      const chain = it.legs.map(hopChip).join('<span class="hop-sep">›</span>');
      return `<button class="itin" data-i="${i}">
        <div class="itin-top">
          <span class="itin-min">${it.totalMin}<small>${esc(t("jpMin"))}</small></span>
          <span class="itin-meta">${esc(label[it.kind] || "")} · ${esc(t("jpChanges")(it.changes))}</span>
        </div>
        <div class="itin-chain">${chain}</div>
        <div class="itin-basis">${esc(basisLine(it))}</div>
      </button>`;
    }).join("");
  $$("#jp-out .itin").forEach(b => b.onclick = () => openItinerary(list[+b.dataset.i]));
}
function basisLine(it) {
  const b = it.basis;
  if (b === "live") return t("jpLive");
  if (b === "estimated") return t("jpEst");
  if (b === "scheduled") return t("jpSched");
  return `${t("jpLive")} + ${t("jpEst")}`;
}

/* The detail view: the legs written out, and the whole thing drawn. */
function openItinerary(it) {
  jp.current = it;
  $("#jpr-title").textContent = `${it.totalMin} ${t("jpMin")}`;
  $("#jpr-sub").textContent = `${t("jpChanges")(it.changes)} · ${basisLine(it)}`;
  $("#jpr").classList.add("on");
  const notes = [];
  if (it.legs.some(l => l.basis === "scheduled")) notes.push(t("jpNoteSched"));
  if (it.legs.some(l => l.basis === "estimated")) notes.push(t("jpNoteEst"));
  const nm = o => o ? (LANG === "en" ? (o.en || o.el) : (o.el || o.en)) : "";
  const rows = it.legs.map(l => {
    if (l.mode === "walk") {
      const dest = nm(l.to) || t("jpDest");
      return `<div class="jp-step"><div class="jp-ic">⏱</div><div class="jp-body">
        <div class="jp-h">${esc(t("jpWalk"))} ${esc(fmtDist(l.metres))}</div>
        <div class="jp-d">${esc(t("jpTo2"))} ${esc(dest)}</div></div>
        <div class="jp-t">${Math.round(l.min)}′</div></div>`;
    }
    const head = l.headsign ? nm(l.headsign) : "";
    const basis = l.basis === "live" ? t("jpLive") : l.basis === "scheduled" ? t("jpSched") : t("jpEst");
    return `<div class="jp-step"><div class="jp-ic line">${esc(String(l.line))}</div><div class="jp-body">
      <div class="jp-h">${esc(t("jpBoard"))} ${esc(nm(l.from))}</div>
      <div class="jp-d">${head ? esc(head) + " · " : ""}${esc(t("jpStops")(l.stops))} · ${esc(t("jpAlight"))} ${esc(nm(l.to))}</div>
      <div class="jp-d">${esc(t("jpWait"))} ${Math.round(l.wait)}′ · ${esc(t("jpRide"))} ${Math.round(l.rideMin)}′ · ${esc(basis)}</div>
      </div><div class="jp-t">${Math.round(l.min)}′</div></div>`;
  }).join("");
  $("#jpr-strip").innerHTML = notes.map(n => `<div class="jp-note">${esc(n)}</div>`).join("") + rows;
  drawItinerary(it);
}
function closeItinerary() { $("#jpr").classList.remove("on"); }

function drawItinerary(it) {
  if (!jp.map) {
    jp.map = L.map("jpmap", { zoomControl: true });
    L.tileLayer(tileUrl(), { subdomains: "abcd", maxZoom: 20, detectRetina: true,
      attribution: TILE_ATTR }).addTo(jp.map);
    jp.layer = L.layerGroup().addTo(jp.map);
    jp.map.setView([here.lat, here.lng], 13);
  } else jp.layer.clearLayers();
  setTimeout(() => jp.map.invalidateSize(), 70);

  /* Each leg draws itself: walking dashed and grey, riding as the same
     snake the rest of the app uses, so the shape of the trip reads at a
     glance without a legend. The line follows the stops it calls at, which
     is not the road, and is close enough to recognise the route by. */
  const pts = [];
  it.legs.forEach(l => {
    const path = (l.path || []).filter(p => Array.isArray(p) && isFinite(p[0]));
    if (path.length < 2) return;
    path.forEach(p => pts.push(p));
    if (l.mode === "walk") {
      L.polyline(path, { color: "#8A8A84", weight: 3, opacity: .95, dashArray: "3 6" }).addTo(jp.layer);
      return;
    }
    L.polyline(path, { color: "#FFFFFF", weight: 8, opacity: .95 }).addTo(jp.layer);
    L.polyline(path, { color: "#17171A", weight: 4 }).addTo(jp.layer);
    if (l.mode === "metro") L.polyline(path, { color: "#FFE24A", weight: 2, opacity: 1 }).addTo(jp.layer);
    // a dot at each intermediate stop, and the line number where you board
    path.slice(1, -1).forEach(p => L.circleMarker(p, { radius: 2.5, color: "#5A6B8C",
      weight: 1, fillColor: "#8A97AD", fillOpacity: .85 }).addTo(jp.layer));
    L.marker(path[0], { icon: L.divIcon({ className: "",
      html: `<div class="endm">${esc(String(l.line))}</div>`, iconSize: [0, 0], iconAnchor: [0, 10] }),
      zIndexOffset: 800 }).addTo(jp.layer);
  });
  if (!pts.length) { pts.push([jp.from.lat, jp.from.lng], [jp.to.lat, jp.to.lng]); }
  L.marker([jp.from.lat, jp.from.lng], { icon: L.divIcon({ className: "",
    html: '<div class="origin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
    zIndexOffset: 900 }).addTo(jp.layer);
  L.marker([jp.to.lat, jp.to.lng], { icon: L.divIcon({ className: "",
    html: '<div class="jp-end"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }),
    zIndexOffset: 900 }).addTo(jp.layer);
  const b = L.latLngBounds(pts.concat([[jp.from.lat, jp.from.lng], [jp.to.lat, jp.to.lng]]));
  if (b.isValid()) jp.map.fitBounds(b, { padding: [42, 42], maxZoom: 16 });
}

async function trackList(){

    const fail=txt=>{ msg.style.display=""; msg.textContent=txt;

    add.onclick=async()=>{

        renderStats();
      }catch(e){ fail(String((e&&e.message)||e)); }
    };
    body.appendChild(wrap); body.appendChild(add); body.appendChild(msg);
  }
}

function relTime(sec){
  if(!isFinite(sec)||sec<0) return "";
  if(sec<90) return t("justNow");
  if(sec<3600) return `${Math.round(sec/60)}${t("minShort")} ${t("agoWord")}`;
  if(sec<86400) return `${Math.round(sec/3600)}${t("hourShort")} ${t("agoWord")}`;
  return `${Math.round(sec/86400)}${t("dayShort")} ${t("agoWord")}`;
}
function kpi(label,value,cls){ return `<div class="${cls||""}"><b>${value}</b><span>${label}</span></div>`; }
async function showRouteStats(){
  const body=$("#st-body");
  body.innerHTML=`<div class="note">${t("searching")}</div>`;
  try{
    const [s,bunch,miss]=await Promise.all([
      fetch(`${base()}/stats?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),
      fetch(`${base()}/stats/bunching?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),
      fetch(`${base()}/stats/missing?route=${encodeURIComponent(statRoute)}&days=${statDays}`,{cache:"no-store"}).then(r=>r.json()),

    const regCls=s.regularity>=75?"ok":s.regularity>=50?"warn":"bad";  // ok / marked / boxed

    const missCls=s.missingRate<=5?"ok":s.missingRate<=15?"warn":"bad";
    const maxH=Math.max(1,...(s.hourly||[]).map(h=>h.n));

    }).join("");

    body.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div class="tile num" style="height:28px;min-width:44px;font-size:13px">${esc((s.route&&s.route.line_id)||statRoute)}</div>
        <div style="color:var(--muted);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">

        <button class="chip${statDays===7?" on":""}" id="d7">${t("last7")}</button>

      </div>
      <div class="kpi">
        ${kpi(t("waitReal"), s.expectedWait+"′")}
        ${kpi(t("headway"), s.typicalGap+"′")}
        ${kpi(t("regular"), s.regularity+"%", regCls)}
        ${kpi(t("bunching"), s.bunchRate+"%", bunchCls)}
        ${kpi(t("missingSvc"), s.missingRate+"%", missCls)}
        ${kpi(t("worst"), s.worstGap+"′")}
      </div>
      <div class="note">${s.total} ${t("events")} · ${s.vehicles} ${t("vehicles").toLowerCase()}</div>
      <div class="sec-label">${t("byHour")}</div>
      <div class="hrs">${bars}</div>
      <div class="hrlab"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
      <div class="sec-label">${t("bunching")} · ${t("incidents")}</div>
      ${bunch&&bunch.length?bunch.slice(0,6).map(b=>
        `<div class="inc"><b>${Math.round(b.gapSec/60*10)/10}′</b> ${t("bunching").toLowerCase()} · ${new Date(b.at*1000).toLocaleString()}</div>`).join("")
        :`<div class="inc">${t("noneYet")}</div>`}
      <div class="sec-label">${t("missingSvc")}</div>
      ${miss&&miss.length?miss.slice(0,6).map(g=>
        `<div class="inc"><b>${g.minutes}′</b> (${t("headway").toLowerCase()} ~${g.typical}′) · ${new Date(g.from*1000).toLocaleString()}</div>`).join("")
        :`<div class="inc">${t("noneYet")}</div>`}
      <button class="ghost" id="st-back">←</button>`;
    $("#d7").onclick=()=>{ statDays=7; showRouteStats(); };
    $("#d30").onclick=()=>{ statDays=30; showRouteStats(); };
    $("#st-back").onclick=renderStats;
  }catch(e){ body.innerHTML=`<div class="note">${t("err")}</div>`; }
}

function u8(b64){ const p="=".repeat((4-b64.length%4)%4);
  const s=(b64+p).replace(/-/g,"+").replace(/_/g,"/"); const raw=atob(s);
  const a=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i); return a; }
async function ensurePush(){
  if(!hasBackend()) throw new Error("nobackend");
  if(!("serviceWorker" in navigator)||!("PushManager" in window)) throw new Error("unsupported");
  const kr=await fetch(base()+"/push/key"); if(!kr.ok) throw new Error("notconfigured");
  const {key}=await kr.json();
  let perm=Notification.permission;
  if(perm==="default") perm=await Notification.requestPermission();
  if(perm!=="granted") throw new Error("denied");
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)});
  const id=localStorage.getItem("subId")||null;
  const r=await fetch(base()+"/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,subscription:sub.toJSON()})});
  const j=await r.json(); localStorage.setItem("subId",j.id); state.subId=j.id; return j.id;
}
async function loadRules(){
  if(!hasBackend()||!state.subId){ state.rules=[]; return; }

  add.onclick=()=>renderForm(); form.appendChild(add);
  /* The "send a test notification" button lived here. Removed from the
     UI — the first real alert is the test. POST /push/test is still on
     the Worker for debugging by hand:
       curl -X POST <url>/push/test -d '{"sub":"<your sub id>"}' */
}
function renderForm(){
  const form=$("#ruleform"); form.innerHTML="";
  /* The stop list here used to be "whatever is near you right now", which
     meant setting an alarm for your evening stop required dragging the
     location pin across town first. Now the picker offers favourites and
     nearby stops, and — the part that removes the chore — a search that
     reaches any stop in Athens through /stops/search. */
  const stops=[];
  const seen={};
  const push=s=>{ const k=String(s.code); if(!k||seen[k]) return; seen[k]=1; stops.push(s); };
  favs.forEach(f=>{ const live=(state.stops||[]).find(s=>String(s.code)===String(f.code))
    ||state.favLive[String(f.code)]; if(live) push(live); });
  (state.stops||[]).slice(0,CONFIG.listStops).forEach(push);
  const empty=!stops.length;      // no nearby stops yet: open straight into search
  const wrap=document.createElement("div");
  wrap.innerHTML=`
    <div class="field"><label>${t("stop")}</label><select id="f-stop">
      ${stops.map((s,i)=>`<option value="${i}">${isFav(s.code)?"★ ":""}${esc(stopName(s))}</option>`).join("")}
      <option value="find"${empty?" selected":""}>${esc(t("findStop"))}</option></select>
      <div id="f-find"${empty?"":" hidden"}>
        <input id="f-q" type="search" placeholder="${esc(t("linePh"))}" autocomplete="off" />
        <div class="res" id="f-qres"></div>
      </div>
      <div class="shint">${esc(t("alertHint"))}</div></div>
    <div class="field"><label>${t("line")}</label><select id="f-route"></select></div>
    <div class="field"><label>${t("days")}</label><div class="chips" id="f-days"></div></div>
    <div class="field two"><div><label>${t("from")}</label><input type="time" id="f-from" value="08:30"></div>
      <div><label>${t("till")}</label><input type="time" id="f-to" value="08:50"></div></div>
    <div class="field"><label>${t("lead")}</label><div class="chips" id="f-leads"></div></div>`;
  form.appendChild(wrap);
  const sel=new Set([1,2,3,4,5]),db=wrap.querySelector("#f-days");
  [1,2,3,4,5,6,0].forEach(i=>{ const c=document.createElement("button");
    c.className="chip"+(sel.has(i)?" on":""); c.textContent=t("dayNames")[i];
    c.onclick=()=>{ sel.has(i)?sel.delete(i):sel.add(i); c.classList.toggle("on"); }; db.appendChild(c); });
  const leads=new Set([10,5]),lb=wrap.querySelector("#f-leads");
  [15,10,5,3].forEach(L=>{ const c=document.createElement("button");
    c.className="chip"+(leads.has(L)?" on":""); c.textContent=L+"′";
    c.onclick=()=>{ leads.has(L)?leads.delete(L):leads.add(L); c.classList.toggle("on"); }; lb.appendChild(c); });
  const rs=wrap.querySelector("#f-route");
  const stopSel=wrap.querySelector("#f-stop");
  const findBox=wrap.querySelector("#f-find");
  const qIn=wrap.querySelector("#f-q");
  const qRes=wrap.querySelector("#f-qres");

  /* A stop reached by search has no routes yet — it never went through a
     nearby sweep — so fetch them before the line dropdown can mean
     anything. */
  async function fill(){
    const s=stops[+stopSel.value];
    if(!s){ rs.innerHTML=`<option value="">—</option>`; return; }
    if(!s.routesLoaded){
      rs.innerHTML=`<option value="">${esc(t("searching"))}</option>`;
      try{ await loadRoutes(s); }catch(_){}
      if(stops[+stopSel.value]!==s) return;          // user moved on
    }
    rs.innerHTML=(s.routes||[]).map(r=>{ const d=LANG==="en"?(r.en||r.el):(r.el||r.en);
      return `<option value="${esc(r.code)}">${esc(r.id)} · ${esc(d||"")}</option>`; }).join("")
      ||`<option value="">—</option>`;
  }

  function addStop(s){
    const i=stops.findIndex(x=>String(x.code)===String(s.code));
    let idx=i;
    if(i<0){
      idx=stops.push(s)-1;
      const o=document.createElement("option");
      o.value=String(idx); o.textContent=stopName(s);
      stopSel.insertBefore(o,stopSel.lastElementChild);
    }
    stopSel.value=String(idx);
    findBox.hidden=true; qRes.innerHTML=""; qIn.value="";
    fill();
  }

  let qTimer=null;
  async function runFind(){
    const q=qIn.value.trim();
    if(q.length<2){ qRes.innerHTML=""; return; }
    qRes.innerHTML=`<div class="res-msg">${t("searching")}</div>`;
    let hits=localStopMatches(q), netFail=false;
    if(hasBackend()){
      try{
        const r=await fetch(`${base()}/stops/search?q=${encodeURIComponent(q)}`,{cache:"no-store"});
        if(r.ok){
          const j=await r.json();
          const have={}; hits.forEach(x=>{ have[String(x.code)]=1; });
          hits=hits.concat((Array.isArray(j.stops)?j.stops:[]).filter(x=>!have[String(x.code)]));
        } else netFail=true;
      }catch(_){ netFail=true; }
    }
    hits=hits.slice(0,8);
    if(!hits.length){
      qRes.innerHTML=`<div class="res-msg">${esc(emptyMsg(netFail,"noStopHit"))}</div>`; return; }
    qRes.innerHTML="";
    hits.forEach(raw=>{
      const b=document.createElement("button");
      b.className="res-item";
      const d=isFinite(raw.dist)?fmtDist(raw.dist):"";
      b.innerHTML=`<b>${esc(stopName(raw))}</b>${d?` <span class="res-d">${esc(d)}</span>`:""}`;
      b.onclick=()=>addStop(adoptStop(raw));
      qRes.appendChild(b);
    });
  }

  stopSel.onchange=()=>{
    if(stopSel.value==="find"){
      findBox.hidden=false; qRes.innerHTML=""; setTimeout(()=>qIn.focus(),60);
      return;
    }
    findBox.hidden=true; fill();
  };
  qIn.oninput=()=>{ clearTimeout(qTimer); qTimer=setTimeout(runFind,320); };
  qIn.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); clearTimeout(qTimer); runFind(); } };
  fill();
  const save=document.createElement("button"); save.className="primary"; save.textContent=t("save");
  save.onclick=async()=>{
    save.disabled=true;
    try{
      const id=await ensurePush();
      const s=stops[+stopSel.value];
      const rc=rs.value;
      if(!s||!rc) throw new Error("pick");
      const route=(s.routes||[]).find(r=>r.code===rc)||{};
      const rule={sub:id,stopCode:s.code,stopName:stopName(s),lineId:route.id||"",routeCodes:[rc],
        routeName:(LANG==="en"?(route.en||route.el):(route.el||route.en))||"",
        days:[...sel].sort(),from:wrap.querySelector("#f-from").value,to:wrap.querySelector("#f-to").value,
        leads:[...leads].sort((a,b)=>b-a),enabled:true};
      const r=await fetch(base()+"/rules",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(rule)});
      if(!r.ok) throw new Error("save");
      await loadRules(); bellBadge(); renderAlerts();
    }catch(e){ const n=document.createElement("div"); n.className="note";
      n.textContent=e.message==="denied"?t("pushDenied"):t("pushOff"); form.appendChild(n); save.disabled=false; }
  };
  form.appendChild(save);
  const cancel=document.createElement("button"); cancel.className="ghost"; cancel.textContent=t("cancel");
  cancel.onclick=renderAlerts; form.appendChild(cancel);
}

function switchLang(){
  LANG=LANG==="el"?"en":"el";
  try{ localStorage.setItem("lang",LANG); }catch(_){}
  if(here.gps) here.label=t("you");
  else if(here.label){ const p=PRESETS.find(x=>x.el===here.label||x.en===here.label);
    if(p) here.label=LANG==="el"?p.el:p.en; }
  // every cached row string is in the old language, so start clean
  cardCache.forEach(c=>c.card.remove()); cardCache.clear();
  applyStatics(); updateRadiusLabel(); paintFresh(); renderView();
  if($("#rep").classList.contains("on")){ drawReportMap(); renderReportList(); }
}
